
Screens:

    scr_GapTracker:
        Properties:
            Fill: =gblTheme.White
            OnVisible: |
                =If(!gblIsAdmin, Navigate(scr_NoAccess, ScreenTransition.None));
                Set(gblGapTab, "open");
                Set(gblGapSeverity, "All severities");
                Set(gblGapToClose, Blank());
                ClearCollect(colGaps, dsGaps);
                ClearCollect(
                    colActiveFlags,
                    Filter(dsFlags, su_status = "Active")
                )

        Children:

            - cmp_HeaderGap:
                Control: Component
                ComponentName: cmp_Header
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =104
                    ActiveScreen: ="GapTracker"
                    OpenGapCount: =gblOpenGapCount

            - cmp_GapHead:
                Control: Component
                ComponentName: cmp_PageHead
                Properties:
                    X: =64
                    Y: =128
                    Width: =Parent.Width - 460
                    Height: =124
                    Eyebrow: ="Risk and Reporting - Administrator"
                    Title: ="Gap Tracker"
                    Subtitle: |
                        ="Every open compliance gap across the institution, tied to the function it came from. Close a gap with documented notes; the count badge updates everywhere it appears."

            - gal_GapStats:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                    X: =64
                    Y: =262
                    Width: =Parent.Width - 128
                    Height: =104
                    TemplateSize: =(Parent.Width - 128) / 4
                    TemplatePadding: =0
                    ShowScrollbar: =false
                    Items: |
                        =With(
                            {open: Filter(colGaps, su_status <> "Closed")},
                            Table(
                                {
                                    StatValue: CountRows(Filter(open, su_severity = "High")),
                                    StatLabel: "High",
                                    StatNote: "Immediate attention",
                                    StatTone: "bad"
                                },
                                {
                                    StatValue: CountRows(Filter(open, su_severity = "Moderate")),
                                    StatLabel: "Moderate",
                                    StatNote: "",
                                    StatTone: "warn"
                                },
                                {
                                    StatValue: CountRows(Filter(open, su_severity = "Low")),
                                    StatLabel: "Low",
                                    StatNote: "",
                                    StatTone: ""
                                },
                                {
                                    StatValue: RoundDown(Average(open, su_daysopen), 0),
                                    StatLabel: "Avg days open",
                                    StatNote: "Open and in progress",
                                    StatTone: ""
                                }
                            )
                        )
                Children:
                    - rec_GapStatCard:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth - 14
                            Height: =96
                            Fill: =gblTheme.White
                            BorderColor: =gblTheme.Border
                            BorderThickness: =1
                    - lbl_GapStatValue:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =12
                            Width: =Parent.TemplateWidth - 40
                            Height: =40
                            Text: =ThisItem.StatValue
                            Color: |
                                =Switch(
                                    ThisItem.StatTone,
                                    "bad",  gblTheme.High,
                                    "warn", gblTheme.Moderate,
                                    gblTheme.Navy
                                )
                            Size: =24
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontDisplay
                    - lbl_GapStatLabel:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =52
                            Width: =Parent.TemplateWidth - 40
                            Height: =20
                            Text: =ThisItem.StatLabel
                            Color: =gblTheme.GrayDark
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - lbl_GapStatNote:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =70
                            Width: =Parent.TemplateWidth - 40
                            Height: =18
                            Text: =ThisItem.StatNote
                            Color: =gblTheme.GrayMid
                            Size: =8
                            Font: =gblTheme.FontBody

            - btn_GapTabOpen:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =64
                    Y: =386
                    Width: =190
                    Height: =42
                    Text: |
                        ="Open (" &
                         CountRows(Filter(colGaps, su_status = "Open")) & ")"
                    OnSelect: =Set(gblGapTab, "open")
                    Fill: =RGBA(0, 0, 0, 0)
                    Color: =If(gblGapTab = "open", gblTheme.Navy, gblTheme.GrayMid)
                    BorderThickness: =0
                    HoverFill: =RGBA(0, 14, 84, 0.04)
                    Size: =11
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontBody
            - btn_GapTabInProgress:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =258
                    Y: =386
                    Width: =180
                    Height: =42
                    Text: |
                        ="In progress (" &
                         CountRows(
                             Filter(colGaps, su_status = "In Progress")
                         ) & ")"
                    OnSelect: =Set(gblGapTab, "inprogress")
                    Fill: =RGBA(0, 0, 0, 0)
                    Color: =If(gblGapTab = "inprogress", gblTheme.Navy, gblTheme.GrayMid)
                    BorderThickness: =0
                    HoverFill: =RGBA(0, 14, 84, 0.04)
                    Size: =11
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontBody
            - btn_GapTabClosed:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =442
                    Y: =386
                    Width: =150
                    Height: =42
                    Text: |
                        ="Closed (" &
                         CountRows(Filter(colGaps, su_status = "Closed")) & ")"
                    OnSelect: =Set(gblGapTab, "closed")
                    Fill: =RGBA(0, 0, 0, 0)
                    Color: =If(gblGapTab = "closed", gblTheme.Navy, gblTheme.GrayMid)
                    BorderThickness: =0
                    HoverFill: =RGBA(0, 14, 84, 0.04)
                    Size: =11
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontBody
            - btn_GapTabFlags:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =596
                    Y: =386
                    Width: =230
                    Height: =42
                    Text: ="Flagged for review (" & CountRows(colActiveFlags) & ")"
                    OnSelect: =Set(gblGapTab, "flags")
                    Fill: =RGBA(0, 0, 0, 0)
                    Color: =If(gblGapTab = "flags", gblTheme.Navy, gblTheme.GrayMid)
                    BorderThickness: =0
                    HoverFill: =RGBA(0, 14, 84, 0.04)
                    Size: =11
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontBody
            - rec_GapTabRule:
                Control: Rectangle@2.3.0
                Properties:
                    X: =64
                    Y: =428
                    Width: =Parent.Width - 128
                    Height: =1
                    Fill: =gblTheme.Border
                    BorderThickness: =0
            - drp_GapSeverityFilter:
                Control: Classic/DropDown@2.3.1
                Properties:
                    X: =Parent.Width - 264
                    Y: =386
                    Width: =200
                    Height: =42
                    Visible: =gblGapTab <> "flags"
                    Items: |
                        =Table(
                            {Value: "All severities"},
                            {Value: "High"},
                            {Value: "Moderate"},
                            {Value: "Low"}
                        )
                    Default: ="All severities"
                    OnChange: =Set(gblGapSeverity, drp_GapSeverityFilter.Selected.Value)
                    BorderColor: =gblTheme.Border
                    Size: =11
                    Font: =gblTheme.FontBody

            - gal_Gaps:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                    X: =64
                    Y: =446
                    Width: =Parent.Width - 128
                    Height: =Parent.Height - 490
                    TemplateSize: =(Parent.Width - 128) / 3 - 4
                    TemplatePadding: =16
                    WrapCount: =3
                    ShowScrollbar: =true
                    Visible: =gblGapTab <> "flags"
                    Items: |
                        =SortByColumns(
                            Filter(
                                colGaps,
                                Switch(
                                    gblGapTab,
                                    "open",       su_status = "Open",
                                    "inprogress", su_status = "In Progress",
                                    su_status = "Closed"
                                ),
                                gblGapSeverity = "All severities"
                                    || su_severity = Switch(
                                           gblGapSeverity,
                                           "High",     "High",
                                           "Moderate",   "Moderate",
                                           "Low"
                                       )
                            ),
                            "su_severity", SortOrder.Ascending,
                            "su_openeddate", SortOrder.Ascending
                        )
                Children:
                    - rec_GapCard:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth
                            Height: =244
                            Fill: =gblTheme.White
                            BorderColor: =gblTheme.Border
                            BorderThickness: =1
                    - rec_GapCardAccent:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =4
                            Height: =244
                            Fill: |
                                =If(
                                    ThisItem.su_status <> "Closed",
                                    Switch(
                                        ThisItem.su_severity,
                                        "High",     gblTheme.High,
                                        "Moderate",   gblTheme.Moderate,
                                        gblTheme.Low
                                    ),
                                    gblTheme.Low
                                )
                            BorderThickness: =0
                    - cmp_GapSeverityPill:
                        Control: Component
                        ComponentName: cmp_RiskPill
                        Properties:
                            X: =16
                            Y: =14
                            Width: =74
                            Height: =24
                            Risk: |
                                =Switch(
                                    ThisItem.su_severity,
                                    "High",     "High",
                                    "Moderate",   "Moderate",
                                    "Low",      "Low",
                                    ""
                                )
                    - lbl_GapCardMeta:
                        Control: Label@2.5.1
                        Properties:
                            X: =98
                            Y: =14
                            Width: =Parent.TemplateWidth - 114
                            Height: =24
                            Text: |
                                =ThisItem.su_gapcode & "  |  " & ThisItem.su_daysopen & "d open"
                            Color: =gblTheme.GrayMid
                            Size: =8
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
                    - lbl_GapCardTitle:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =44
                            Width: =Parent.TemplateWidth - 32
                            Height: =44
                            Text: =ThisItem.su_name
                            Color: =gblTheme.Navy
                            Size: =11
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontDisplay
                    - lbl_GapCardNote:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =90
                            Width: =Parent.TemplateWidth - 32
                            Height: =62
                            Text: |
                                =If(
                                    ThisItem.su_status = "Closed",
                                    "Closure note - " & ThisItem.su_closenote,
                                    ThisItem.su_note
                                )
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Font: =gblTheme.FontBody
                    - lbl_GapCardOwner:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =158
                            Width: =Parent.TemplateWidth - 32
                            Height: =38
                            Text: |
                                =ThisItem.su_owner.su_name & Char(10) & ThisItem.su_function.su_name
                            Color: =gblTheme.GrayDark
                            Size: =9
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - btn_GapCardFunction:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =16
                            Y: =200
                            Width: =104
                            Height: =32
                            Text: ="Function"
                            OnSelect: |
                                =Set(gblSelectedFunction, ThisItem.su_function);
                                Navigate(scr_FunctionDetail, ScreenTransition.None)
                            Fill: =RGBA(0, 0, 0, 0)
                            Color: =gblTheme.Navy
                            BorderColor: =gblTheme.Navy
                            BorderThickness: =1
                            HoverFill: =RGBA(0, 14, 84, 0.06)
                            Size: =9
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - btn_GapCardClose:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =130
                            Y: =200
                            Width: =90
                            Height: =32
                            Text: ="Close"
                            Visible: =ThisItem.su_status <> "Closed"
                            OnSelect: =Set(gblGapToClose, ThisItem)
                            Fill: =gblTheme.Orange
                            HoverFill: =gblTheme.OrangeMedium
                            Color: =gblTheme.White
                            BorderThickness: =0
                            Size: =9
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody

            - gal_GapFlags:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                    X: =64
                    Y: =446
                    Width: =Parent.Width - 128
                    Height: =Parent.Height - 490
                    TemplateSize: =108
                    TemplatePadding: =0
                    ShowScrollbar: =true
                    Visible: =gblGapTab = "flags"
                    Items: =colActiveFlags
                Children:
                    - lbl_FlagRowFn:
                        Control: Label@2.5.1
                        Properties:
                            X: =14
                            Y: =12
                            Width: =Parent.TemplateWidth - 300
                            Height: =22
                            Text: =ThisItem.su_function.su_name
                            Color: =gblTheme.Navy
                            Size: =11
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - lbl_FlagRowMeta:
                        Control: Label@2.5.1
                        Properties:
                            X: =14
                            Y: =34
                            Width: =Parent.TemplateWidth - 300
                            Height: =18
                            Text: |
                                =ThisItem.su_function.su_riskarea.su_name & "  |  flagged by " &
                                 ThisItem.su_flaggedby.su_name & " on " &
                                 Text(ThisItem.su_flaggedon, "mmm d, yyyy")
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Font: =gblTheme.FontBody
                    - lbl_FlagRowReason:
                        Control: Label@2.5.1
                        Properties:
                            X: =14
                            Y: =54
                            Width: =Parent.TemplateWidth - 300
                            Height: =42
                            Text: =ThisItem.su_reason
                            Color: =gblTheme.GrayDark
                            Size: =9
                            Font: =gblTheme.FontBody
                    - btn_FlagRowReview:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =Parent.TemplateWidth - 264
                            Y: =36
                            Width: =110
                            Height: =36
                            Text: ="Review"
                            OnSelect: |
                                =Set(gblSelectedFunction, ThisItem.su_function);
                                Navigate(scr_FunctionDetail, ScreenTransition.None)
                            Fill: =RGBA(0, 0, 0, 0)
                            Color: =gblTheme.Navy
                            BorderColor: =gblTheme.Navy
                            BorderThickness: =1
                            HoverFill: =RGBA(0, 14, 84, 0.06)
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - btn_FlagRowClear:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =Parent.TemplateWidth - 144
                            Y: =36
                            Width: =110
                            Height: =36
                            Text: ="Clear"
                            OnSelect: |
                                =Patch(
                                    dsFlags,
                                    ThisItem,
                                    {
                                        su_status: "Cleared",
                                        su_clearedby: gblMe,
                                        su_clearedon: gblToday
                                    }
                                );
                                Patch(
                                    dsFunctions,
                                    ThisItem.su_function,
                                    {su_isflagged: false}
                                );
                                ClearCollect(
                                    colActiveFlags,
                                    Filter(dsFlags, su_status = "Active")
                                )
                            Fill: =gblTheme.Orange
                            HoverFill: =gblTheme.OrangeMedium
                            Color: =gblTheme.White
                            BorderThickness: =0
                            Size: =10
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - rec_FlagRowRule:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =107
                            Width: =Parent.TemplateWidth
                            Height: =1
                            Fill: =gblTheme.BorderSoft
                            BorderThickness: =0

            - rec_CloseScrim:
                Control: Rectangle@2.3.0
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =Parent.Height
                    Fill: =RGBA(0, 14, 84, 0.55)
                    BorderThickness: =0
                    Visible: =!IsBlank(gblGapToClose)
            - cnt_CloseDialog:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                    X: =(Parent.Width - 620) / 2
                    Y: =(Parent.Height - 430) / 2
                    Width: =620
                    Height: =430
                    Fill: =gblTheme.White
                    Visible: =!IsBlank(gblGapToClose)
                Children:
                    - rec_CloseHeader:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =620
                            Height: =84
                            Fill: =gblTheme.Navy
                            BorderThickness: =0
                    - lbl_CloseTitle:
                        Control: Label@2.5.1
                        Properties:
                            X: =24
                            Y: =16
                            Width: =520
                            Height: =30
                            Text: ="Close gap"
                            Color: =gblTheme.White
                            Size: =16
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontDisplay
                    - lbl_CloseSub:
                        Control: Label@2.5.1
                        Properties:
                            X: =24
                            Y: =48
                            Width: =520
                            Height: =22
                            Text: |
                                =gblGapToClose.su_gapcode & "  |  " &
                                 gblGapToClose.su_function.su_name
                            Color: =RGBA(199, 210, 234, 1)
                            Size: =9
                            Font: =gblTheme.FontBody
                    - lbl_CloseGapName:
                        Control: Label@2.5.1
                        Properties:
                            X: =24
                            Y: =104
                            Width: =572
                            Height: =44
                            Text: =gblGapToClose.su_name
                            Fill: =gblTheme.Surface
                            Color: =gblTheme.Navy
                            Size: =11
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - lbl_CloseNoteLabel:
                        Control: Label@2.5.1
                        Properties:
                            X: =24
                            Y: =158
                            Width: =572
                            Height: =22
                            Text: ="Closure notes (required)"
                            Color: =gblTheme.Navy
                            Size: =9
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - txt_CloseNote:
                        Control: Classic/TextInput@2.3.2
                        Properties:
                            X: =24
                            Y: =182
                            Width: =572
                            Height: =116
                            Default: =""
                            HintText: ="What was remediated, and what prevents recurrence?"
                            Mode: =TextMode.MultiLine
                            BorderColor: =gblTheme.Border
                            FocusedBorderColor: =gblTheme.Orange
                            FocusedBorderThickness: =2
                            Size: =11
                            Font: =gblTheme.FontBody
                    - lbl_CloseHint:
                        Control: Label@2.5.1
                        Properties:
                            X: =24
                            Y: =304
                            Width: =572
                            Height: =40
                            Text: |
                                ="Closing records the date, the closing user, and these notes on the gap record. The open-gap count updates immediately."
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Font: =gblTheme.FontBody
                    - btn_CloseConfirm:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =24
                            Y: =360
                            Width: =150
                            Height: =42
                            Text: ="Mark closed"
                            DisplayMode: |
                                =If(
                                    IsBlank(Trim(txt_CloseNote.Text)),
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                            OnSelect: |
                                =Patch(
                                    dsGaps,
                                    gblGapToClose,
                                    {
                                        su_status: "Closed",
                                        su_closenote: txt_CloseNote.Text,
                                        su_closeddate: gblToday,
                                        su_closedby: gblMe
                                    }
                                );
                                ClearCollect(colGaps, dsGaps);
                                Set(
                                    gblOpenGapCount,
                                    CountRows(
                                        Filter(colGaps, su_status <> "Closed")
                                    )
                                );
                                Reset(txt_CloseNote);
                                Set(gblGapToClose, Blank())
                            Fill: =gblTheme.Orange
                            HoverFill: =gblTheme.OrangeMedium
                            DisabledFill: =gblTheme.GrayLight
                            Color: =gblTheme.White
                            BorderThickness: =0
                            Size: =11
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - btn_CloseCancel:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =186
                            Y: =360
                            Width: =110
                            Height: =42
                            Text: ="Cancel"
                            OnSelect: =Reset(txt_CloseNote); Set(gblGapToClose, Blank())
                            Fill: =RGBA(0, 0, 0, 0)
                            Color: =gblTheme.Navy
                            BorderColor: =gblTheme.Navy
                            BorderThickness: =1
                            HoverFill: =RGBA(0, 14, 84, 0.06)
                            Size: =11
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
