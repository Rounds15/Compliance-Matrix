                        =Switch(
                            gblSelectedAssessment.su_risk,
                            "High",     "High",
                            "Moderate", "Moderate",
                            "Low",      "Low",
                            ""
                        )
            - lbl_AdCode:
                Control: Label@2.5.1
                Properties:
                    X: =148
                    Y: =262
                    Width: =110
                    Height: =24
                    Text: =gblSelectedAssessment.su_assessmentcode
