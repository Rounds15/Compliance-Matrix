                                {NavKey: "ExecutiveTeam",  NavLabel: "Executive Team", NavAdmin: false},
                                {NavKey: "Assessments",    NavLabel: "Assessments",    NavAdmin: true},
                                {NavKey: "GapTracker",     NavLabel: "Gap Tracker",    NavAdmin: true},
                                {NavKey: "RiskDashboard",  NavLabel: "Risk Dashboard", NavAdmin: true},
