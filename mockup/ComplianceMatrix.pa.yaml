                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth
                            Height: =100
                            Fill: =gblTheme.White
                            BorderColor: =gblTheme.Border
                            BorderThickness: =1
                            BorderRadius: =4
                            Text: =""
                            OnSelect: =false
                            HoverFill: =Self.Fill
                            PressedFill: =Self.Fill
                            HoverBorderColor: =Self.BorderColor
                            PressedBorderColor: =Self.BorderColor
                            FocusedBorderThickness: =0
                            TabIndex: =-1
