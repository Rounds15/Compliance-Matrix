                    - gal_HeatCells:
                        Control: Gallery@2.15.0
                        Variant: Horizontal
                        Properties:
                            X: =264
                            Y: =0
                            Width: =Parent.TemplateWidth - 364
                            Height: =36
                            TemplateSize: =(Parent.TemplateWidth - 364) / 4
                            TemplatePadding: =0
                            ShowScrollbar: =false
                            Items: |
                                =Table(
                                    {CellRisk: "High",     CellLabel: "High"},
                                    {CellRisk: "Moderate", CellLabel: "Moderate"},
                                    {CellRisk: "Low",      CellLabel: "Low"},
                                    {CellRisk: Blank(),               CellLabel: "Unrated"}
                                )
                        Children:
                            - rec_HeatCell:
                                Control: Rectangle@2.3.0
                                Properties:
                                    X: =1
                                    Y: =1
                                    Width: =Parent.TemplateWidth - 2
                                    Height: =34
                                    Fill: |
                                        =With(
                                            {
                                                n: CountRows(
                                                    Filter(
                                                        colAllFunctions,
                                                        su_riskarea.su_riskareaid
                                                            = gal_HeatRows.Selected.su_riskareaid,
                                                        If(
                                                            ThisItem.CellLabel = "Unrated",
                                                            IsBlank(su_risk),
                                                            su_risk = ThisItem.CellRisk
                                                        )
                                                    )
                                                )
                                            },
                                            If(
                                                n = 0,
                                                gblTheme.White,
                                                ColorFade(
                                                    Switch(
                                                        ThisItem.CellLabel,
                                                        "High",     gblTheme.High,
                                                        "Moderate", gblTheme.Moderate,
                                                        "Low",      gblTheme.Low,
                                                        gblTheme.Unrated
                                                    ),
                                                    0.90 - 0.62 * (n / Max(gblHeatMax, 1))
                                                )
                                            )
                                        )
                                    BorderColor: =gblTheme.BorderSoft
                                    BorderThickness: =1
                            - lbl_HeatCellValue:
                                Control: Label@2.5.1
                                Properties:
                                    X: =1
                                    Y: =1
                                    Width: =Parent.TemplateWidth - 2
                                    Height: =34
                                    Text: |
                                        =With(
                                            {
                                                n: CountRows(
                                                    Filter(
                                                        colAllFunctions,
                                                        su_riskarea.su_riskareaid
                                                            = gal_HeatRows.Selected.su_riskareaid,
                                                        If(
                                                            ThisItem.CellLabel = "Unrated",
                                                            IsBlank(su_risk),
                                                            su_risk = ThisItem.CellRisk
                                                        )
                                                    )
                                                )
                                            },
                                            If(n = 0, "", Text(n))
                                        )
                                    Color: =gblTheme.GrayDark
                                    Size: =10
                                    FontWeight: =FontWeight.Bold
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Font: =gblTheme.FontBody
