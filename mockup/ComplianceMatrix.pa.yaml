                    - lbl_AdDetailHead:
                        Control: Label@2.5.1
                        Properties:
                            Height: =24
                            Width: =Parent.Width
                            Text: ="ASSESSMENT DETAIL"
                            Color: =gblTheme.OrangeDark
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - lbl_AdDetailBody:
                        Control: Label@2.5.1
                        Properties:
                            Height: =154
                            Width: =Parent.Width
                            Text: |
                                ="Date                        " &
                                 If(
                                     IsBlank(gblSelectedAssessment.su_assessmentdate),
                                     "Not recorded",
                                     Text(gblSelectedAssessment.su_assessmentdate, "mmm d, yyyy")
                                 ) & Char(10) &
                                 "Unit                         " &
                                 Coalesce(gblSelectedAssessment.su_unit, "Not recorded") & Char(10) &
                                 "Current holder      " &
                                 Coalesce(gblSelectedAssessment.su_currentholder, "Not recorded") & Char(10) &
                                 "Follow-up round   " &
                                 Coalesce(Text(gblSelectedAssessment.su_followupround), "0") & Char(10) &
                                 "Key controls missing   " &
                                 Coalesce(Text(gblSelectedAssessment.su_keycontrolsmissing), "0")
