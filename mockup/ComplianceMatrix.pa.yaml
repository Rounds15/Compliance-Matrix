                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth
                            Height: =44
                            Text: =""
                            Fill: =RGBA(0, 0, 0, 0)
                            HoverFill: =RGBA(0, 14, 84, 0.04)
                            PressedFill: =RGBA(0, 14, 84, 0.08)
                            BorderThickness: =0
                            OnSelect: |
                                =Switch(
                                    ThisItem.NavKey,
                                    "Home",          Navigate(scr_Home, ScreenTransition.None),
                                    "Functions",     Navigate(scr_Functions, ScreenTransition.None),
                                    "RiskAreas",     Navigate(scr_RiskAreas, ScreenTransition.None),
                                    "Domains",       Navigate(scr_Domains, ScreenTransition.None),
                                    "Deadlines",     Navigate(scr_Deadlines, ScreenTransition.None),
                                    "Directory",     Navigate(scr_Directory, ScreenTransition.None),
                                    "ExecutiveTeam", Navigate(scr_ExecutiveTeam, ScreenTransition.None),
                                    "Assessments",   Navigate(scr_Assessments, ScreenTransition.None),
                                    "GapTracker",    Navigate(scr_GapTracker, ScreenTransition.None),
                                    "RiskDashboard", Navigate(scr_RiskDashboard, ScreenTransition.None),
                                    "Reporting",     Navigate(scr_Reporting, ScreenTransition.None)
                                )
    cmp_PageHead:
        DefinitionType: CanvasComponent
        Description: "Page heading block: eyebrow, title, and supporting copy."
        AllowCustomization: true
        AccessAppScope: false
        CustomProperties:
            Eyebrow:
                PropertyKind: Input
                DisplayName: Eyebrow
                DataType: Text
                Default: ="Browse"
            Title:
                PropertyKind: Input
                DisplayName: Title
                DataType: Text
                Default: ="Page title"
            Subtitle:
                PropertyKind: Input
                DisplayName: Subtitle
                DataType: Text
                Default: =""
        Properties:
            Height: =124
            Width: =1000
            Fill: =RGBA(0, 0, 0, 0)
        Children:
            - lbl_Eyebrow:
                Control: Label@2.5.1
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =18
                    Text: =Upper(cmp_PageHead.Eyebrow)
                    Color: =gblTheme.OrangeDark
                    Size: =8
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontBody
            - lbl_Title:
                Control: Label@2.5.1
                Properties:
                    X: =0
                    Y: =22
                    Width: =Parent.Width
                    Height: =46
                    Text: =cmp_PageHead.Title
                    Color: =gblTheme.Navy
                    Size: =26
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontDisplay
            - lbl_Subtitle:
                Control: Label@2.5.1
                Properties:
                    X: =0
                    Y: =72
                    Width: =Min(Parent.Width, 760)
                    Height: =46
                    Text: =cmp_PageHead.Subtitle
                    Color: =gblTheme.GrayMid
                    Size: =11
                    Font: =gblTheme.FontBody
                    Visible: =!IsBlank(cmp_PageHead.Subtitle)
    cmp_RiskPill:
        DefinitionType: CanvasComponent
        Description: "Risk or severity chip. High, Moderate, Low, or Unrated when blank."
        AllowCustomization: true
        AccessAppScope: false
        CustomProperties:
            Risk:
                PropertyKind: Input
                DisplayName: Risk
                Description: >-
                    High, Moderate, or Low. Anything else - including blank -
                    renders as Unrated.
                DataType: Text
                Default: =""
            RiskColor:
                PropertyKind: Output
                DisplayName: Risk Color
                DataType: Color
            RiskLabel:
                PropertyKind: Output
                DisplayName: Risk Label
                DataType: Text
        Properties:
            Height: =24
            Width: =74
            Fill: =RGBA(0, 0, 0, 0)
            RiskColor: |
                =Switch(
                    cmp_RiskPill.Risk,
                    "High",     gblTheme.High,
                    "Moderate", gblTheme.Moderate,
                    "Low",      gblTheme.Low,
                    gblTheme.Unrated
                )
            RiskLabel: |
                =If(
                    cmp_RiskPill.Risk in ["High", "Moderate", "Low"],
                    cmp_RiskPill.Risk,
                    "Unrated"
                )
        Children:
            - rec_RiskBg:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =Parent.Height
                    Fill: =ColorFade(cmp_RiskPill.RiskColor, 0.88)
                    BorderRadius: =4
                    BorderThickness: =0
                    Text: =""
                    OnSelect: =false
                    HoverFill: =Self.Fill
                    PressedFill: =Self.Fill
                    HoverBorderColor: =Self.BorderColor
                    PressedBorderColor: =Self.BorderColor
                    FocusedBorderThickness: =0
                    TabIndex: =-1
            - rec_RiskDot:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =8
                    Y: =(Parent.Height - 7) / 2
                    Width: =7
                    Height: =7
                    Fill: =cmp_RiskPill.RiskColor
                    BorderRadius: =2
                    BorderThickness: =0
                    Text: =""
                    OnSelect: =false
                    HoverFill: =Self.Fill
                    PressedFill: =Self.Fill
                    HoverBorderColor: =Self.BorderColor
                    PressedBorderColor: =Self.BorderColor
                    FocusedBorderThickness: =0
                    TabIndex: =-1
            - lbl_RiskText:
                Control: Label@2.5.1
                Properties:
                    X: =19
                    Y: =0
                    Width: =Parent.Width - 22
                    Height: =Parent.Height
                    Text: =cmp_RiskPill.RiskLabel
                    Color: =cmp_RiskPill.RiskColor
                    Size: =9
                    FontWeight: =FontWeight.Bold
                    VerticalAlign: =VerticalAlign.Middle
                    Font: =gblTheme.FontBody

Screens:
    scr_AssessmentDetail:
        Properties:
            Fill: =gblTheme.White
            OnVisible: |
                =If(!gblIsAdmin, Navigate(scr_NoAccess, ScreenTransition.None));
                ClearCollect(
                    colAsmtOwners,
                    Filter(
                        dsAssessmentOwners,
                        su_assessment.su_assessmentid
                            = gblSelectedAssessment.su_assessmentid
                    )
                );
                ClearCollect(
                    colAsmtGaps,
                    SortByColumns(
                        Filter(
                            dsGaps,
                            su_assessment.su_assessmentid
                                = gblSelectedAssessment.su_assessmentid
                        ),
                        "su_status",
                        SortOrder.Ascending
                    )
                )

        Children:

            - cmp_HeaderAsmtDetail:
                Control: Component
                ComponentName: cmp_Header
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =104
                    ActiveScreen: ="Assessments"
                    OpenGapCount: =gblOpenGapCount

            - btn_AdBack:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =64
                    Y: =116
                    Width: =150
                    Height: =32
                    Text: ="All assessments"
                    OnSelect: =Back()
                    Fill: =RGBA(0, 0, 0, 0)
                    Color: =gblTheme.OrangeDark
                    HoverFill: =RGBA(215, 65, 0, 0.06)
                    BorderThickness: =0
                    Align: =Align.Left
                    Size: =10
                    FontWeight: =FontWeight.Semibold
                    Font: =gblTheme.FontBody

