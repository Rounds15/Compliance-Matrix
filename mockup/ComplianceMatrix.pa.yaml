    scr_Home:
        Properties:
            Fill: =gblTheme.White
            OnVisible: |
                =// Deadline windows used by the figures band and the assignment rail.
                Set(gblHomeUpcoming90,
                    CountRows(
                        Filter(
                            dsDeadlines,
                            su_complete = false,
                            su_duedate >= gblToday,
                            su_duedate <= DateAdd(gblToday, 90, TimeUnit.Days)
                        )
                    )
                );
                Set(gblHomeOverdue,
                    CountRows(
                        Filter(
                            dsDeadlines,
                            su_complete = false,
                            su_duedate < gblToday
                        )
                    )
                );
                Set(gblOpenGapCount,
                    CountRows(
                        Filter(dsGaps, su_status <> "Closed")
                    )
                );
                Set(gblFunctionCount, CountRows(dsFunctions));

                // "Assigned to you" spans all three tiers of the ownership chain,
                // so it reads from the junction table rather than the three fixed
                // lookups. Blank directory row means nothing is assigned.
                ClearCollect(
                    colMyFunctions,
                    If(
                        IsBlank(gblMe),
                        Blank(),
                        ShowColumns(
                            Filter(
                                dsOwnership,
                                su_person.su_compliancedirectoryid = gblMe.su_compliancedirectoryid
                            ),
                            "su_function"
                        )
                    )
                );
                // Assessments this person owns, so "assigned to you" reflects
                // the review work as well as the obligations.
                ClearCollect(
                    colMyAssessments,
                    If(
                        IsBlank(gblMe),
                        Blank(),
                        Filter(
                            dsAssessmentOwners,
                            su_person.su_compliancedirectoryid
                                = gblMe.su_compliancedirectoryid
                        )
                    )
                );
                ClearCollect(
                    colMyDeadlines,
                    FirstN(
                        SortByColumns(
                            Filter(
                                dsDeadlines,
                                su_complete = false,
                                su_owner.su_compliancedirectoryid = gblMe.su_compliancedirectoryid
                            ),
                            "su_duedate",
                            SortOrder.Ascending
                        ),
                        4
                    )
                );

