                            Size: =8
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
                    - lbl_AdGapTitle:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =34
