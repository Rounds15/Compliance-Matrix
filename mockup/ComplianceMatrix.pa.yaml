                        Properties:
                            X: =116
                            Y: =10
                            Width: =Parent.TemplateWidth - 132
                            Height: =22
                            Text: |
                                =ThisItem.su_gapcode &
                                 If(
                                     IsBlank(ThisItem.su_targetquarter)
                                         && IsBlank(ThisItem.su_targetfy),
                                     "  |  no remediation target set",
                                     "  |  target " & ThisItem.su_targetquarter & " " &
                                         ThisItem.su_targetfy
                                 )
