                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =4
                            Height: =100
                            Fill: |
                                =Switch(
                                    ThisItem.su_status,
                                    "Open",          gblTheme.High,
                                    "In Progress", gblTheme.Moderate,
                                    gblTheme.Low
                                )
                            BorderThickness: =0
                    - lbl_AdGapStatus:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =10
                            Width: =92
                            Height: =22
                            Text: |
                                =Switch(
                                    ThisItem.su_status,
                                    "Open",          "Open",
                                    "In Progress", "In Progress",
                                    "Closed"
                                )
                            Fill: |
                                =ColorFade(
                                    Switch(
                                        ThisItem.su_status,
                                        "Open",          gblTheme.High,
                                        "In Progress", gblTheme.Moderate,
                                        gblTheme.Low
                                    ),
                                    0.88
                                )
                            Color: |
                                =Switch(
                                    ThisItem.su_status,
                                    "Open",          gblTheme.High,
                                    "In Progress", gblTheme.Moderate,
                                    gblTheme.Low
                                )
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Align: =Align.Center
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
