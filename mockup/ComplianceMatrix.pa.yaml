                                 If(gblSelectedFunction.su_opengapcount > 0,
                                    Text(gblSelectedFunction.su_opengapcount),
                                    "None") & Char(10) &
                                 "Next deadline    " &
                                 If(IsBlank(gblSelectedFunction.su_nextduedate),
                                    "None scheduled",
                                    Text(gblSelectedFunction.su_nextduedate, "mmm d, yyyy")) & Char(10) &
                                 "Under review     " &
                                 If(IsBlank(gblFdFlag), "No", "Yes") & Char(10) &
                                 "Last reviewed    " &
                                 If(IsBlank(gblSelectedFunction.su_lastreviewed),
                                    "Not recorded",
                                    Text(gblSelectedFunction.su_lastreviewed, "mmm d, yyyy"))
                            Fill: =gblTheme.Surface
                            Color: =gblTheme.GrayDark
                            Size: =10
                            Font: =gblTheme.FontBody
                    - lbl_RailActionHead:
                        Control: Label@2.5.1
                        Properties:
                            Height: =24
                            Width: =Parent.Width
                            Text: ="TAKE ACTION"
                            Color: =gblTheme.OrangeDark
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - btn_RailEdit:
                        Control: Classic/Button@2.2.0
                        Properties:
                            Height: =38
                            Width: =Parent.Width
                            Text: ="Edit this record"
                            Visible: =gblIsAdmin && gblFdMode = "read"
                            OnSelect: =Set(gblFdMode, "edit"); Set(gblFdPanel, "")
                            Fill: =RGBA(0, 0, 0, 0)
                            Color: =gblTheme.Navy
                            BorderColor: =gblTheme.Navy
                            BorderThickness: =1
                            HoverFill: =RGBA(0, 14, 84, 0.06)
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - btn_RailFlag:
                        Control: Classic/Button@2.2.0
                        Properties:
                            Height: =38
                            Width: =Parent.Width
                            Text: ="Flag for review"
                            Visible: =IsBlank(gblFdFlag) && gblFdMode = "read"
                            OnSelect: =Set(gblFdPanel, "flag")
                            Fill: =RGBA(0, 0, 0, 0)
                            Color: =gblTheme.Navy
                            BorderColor: =gblTheme.Navy
                            BorderThickness: =1
                            HoverFill: =RGBA(0, 14, 84, 0.06)
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - btn_RailLogGap:
                        Control: Classic/Button@2.2.0
                        Properties:
                            Height: =38
                            Width: =Parent.Width
                            Text: ="Log a gap"
                            Visible: =gblFdMode = "read"
                            OnSelect: =Set(gblFdPanel, "gap")
                            Fill: =RGBA(0, 0, 0, 0)
                            Color: =gblTheme.High
                            BorderColor: =gblTheme.High
                            BorderThickness: =1
                            HoverFill: =RGBA(220, 38, 38, 0.06)
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - lbl_RailCounselHead:
                        Control: Label@2.5.1
                        Properties:
                            Height: =24
                            Width: =Parent.Width
                            Text: ="LEGAL QUESTIONS"
                            Color: =gblTheme.OrangeDark
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - lbl_RailCounselBody:
                        Control: Label@2.5.1
                        Properties:
                            Height: =134
                            Width: =Parent.Width
                            Text: |
                                ="Counsel of record for " & gblSelectedFunction.su_riskarea.su_name &
                                 ". Reach out before responding to a regulator, signing an agreement, or interpreting the statute." &
                                 Char(10) & Char(10) &
                                 gblFdCounsel.su_attorney.su_name & Char(10) &
                                 gblFdCounsel.su_attorney.su_jobtitle
                            Fill: =gblTheme.Surface
                            Color: =gblTheme.GrayDark
                            Size: =10
                            Font: =gblTheme.FontBody
                    - btn_RailCounselEmail:
                        Control: Classic/Button@2.2.0
                        Properties:
                            Height: =38
                            Width: =Parent.Width
                            Text: ="Email a question"
                            OnSelect: |
                                =Launch(
                                    "mailto:" & gblFdCounsel.su_attorney.su_email &
                                    "?subject=" & EncodeUrl(
                                        "Legal question - " &
                                        gblSelectedFunction.su_functioncode & " " &
                                        gblSelectedFunction.su_name
                                    )
                                )
                            Fill: =gblTheme.Navy
                            HoverFill: =gblTheme.BlueMedium
                            Color: =gblTheme.White
                            BorderThickness: =0
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody

            - rec_FdToast:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =(Parent.Width - 560) / 2
                    Y: =Parent.Height - 84
                    Width: =560
                    Height: =52
                    Fill: =gblTheme.Navy
                    BorderThickness: =0
                    BorderRadius: =5
                    Visible: =!IsBlank(gblFdToast)
                    Text: =""
                    OnSelect: =false
                    HoverFill: =Self.Fill
                    PressedFill: =Self.Fill
                    HoverBorderColor: =Self.BorderColor
                    PressedBorderColor: =Self.BorderColor
                    FocusedBorderThickness: =0
                    TabIndex: =-1
            - rec_FdToastAccent:
                Control: Rectangle@2.3.0
                Properties:
                    X: =(Parent.Width - 560) / 2
                    Y: =Parent.Height - 84
                    Width: =4
                    Height: =52
                    Fill: =gblTheme.Orange
                    BorderThickness: =0
                    Visible: =!IsBlank(gblFdToast)
            - lbl_FdToast:
                Control: Label@2.5.1
                Properties:
                    X: =(Parent.Width - 560) / 2 + 18
                    Y: =Parent.Height - 84
                    Width: =500
                    Height: =52
                    Text: =gblFdToast
                    Color: =gblTheme.White
                    Size: =10
