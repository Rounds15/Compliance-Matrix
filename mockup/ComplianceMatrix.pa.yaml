                            Color: =gblTheme.GrayDark
                            Size: =10
                            Font: =gblTheme.FontBody
                    - lbl_AdOwnersHead:
                        Control: Label@2.5.1
                        Properties:
                            Height: =24
                            Width: =Parent.Width
