ComponentDefinitions:
    cmp_DuePill:
        DefinitionType: CanvasComponent
        Description: "Deadline status chip. Guards against deadlines that carry no due date."
        AllowCustomization: true
        AccessAppScope: false
        CustomProperties:
            DueDate:
                PropertyKind: Input
                DisplayName: Due Date
                DataType: Date
                Default: =Today()
            IsComplete:
                PropertyKind: Input
                DisplayName: Is Complete
                DataType: Boolean
                Default: =false
            DayDiff:
                PropertyKind: Output
                DisplayName: Day Diff
                DataType: Number
            StatusLabel:
                PropertyKind: Output
                DisplayName: Status Label
                DataType: Text
            HasDueDate:
                PropertyKind: Output
                DisplayName: Has Due Date
                DataType: Boolean
            DueColor:
                PropertyKind: Output
                DisplayName: Due Color
                DataType: Color
        Properties:
            Height: =24
            Width: =104
            Fill: =RGBA(0, 0, 0, 0)
            HasDueDate: =!IsBlank(cmp_DuePill.DueDate)
            DayDiff: |
                =If(
                    cmp_DuePill.HasDueDate,
                    DateDiff(gblToday, cmp_DuePill.DueDate, TimeUnit.Days),
                    0
                )
            StatusLabel: |
                =If(
                    !cmp_DuePill.HasDueDate,
                    "No fixed date",
                    cmp_DuePill.IsComplete,
                    "Complete",
                    cmp_DuePill.DayDiff < 0,
                    "Overdue " & Abs(cmp_DuePill.DayDiff) & "d",
                    "Due in " & cmp_DuePill.DayDiff & "d"
                )
            DueColor: |
                =If(
                    !cmp_DuePill.HasDueDate,             gblTheme.GrayMid,
                    cmp_DuePill.IsComplete,              gblTheme.Low,
                    cmp_DuePill.DayDiff < 0,             gblTheme.High,
                    cmp_DuePill.DayDiff <= 30,           gblTheme.Moderate,
                    cmp_DuePill.DayDiff <= 90,           gblTheme.OrangeDark,
                    gblTheme.GrayMid
                )
        Children:
            - rec_DueBg:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =Parent.Height
                    Fill: =ColorFade(cmp_DuePill.DueColor, 0.88)
                    BorderRadius: =4
                    BorderThickness: =0
                    Text: =""
                    OnSelect: =false
                    HoverFill: =Self.Fill
                    PressedFill: =Self.Fill
                    HoverBorderColor: =Self.BorderColor
                    PressedBorderColor: =Self.BorderColor
                    FocusedBorderThickness: =0
                    TabIndex: =-1
            - lbl_DueText:
                Control: Label@2.5.1
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =Parent.Height
                    Text: =cmp_DuePill.StatusLabel
                    Color: =cmp_DuePill.DueColor
                    Size: =9
                    FontWeight: =FontWeight.Bold
                    Align: =Align.Center
                    VerticalAlign: =VerticalAlign.Middle
                    Font: =gblTheme.FontBody
    cmp_Header:
        DefinitionType: CanvasComponent
        Description: "University utility bar, lockup, and primary navigation."
        AllowCustomization: true
        AccessAppScope: false
        CustomProperties:
            ActiveScreen:
                PropertyKind: Input
                DisplayName: Active Screen
                DataType: Text
                Default: ="Home"
            OpenGapCount:
                PropertyKind: Input
                DisplayName: Open Gap Count
                DataType: Number
                Default: =0
        Properties:
            Height: =104
            Width: =1366
            Fill: =RGBA(0, 0, 0, 0)
        Children:
            - rec_UtilBar:
                Control: Rectangle@2.3.0
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =32
                    Fill: =gblTheme.Navy
                    BorderThickness: =0
            - btn_Syracuse:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =Parent.Width - 470
                    Y: =0
                    Width: =110
                    Height: =32
                    Text: ="Syracuse.edu"
                    OnSelect: =Launch("https://www.syracuse.edu")
                    Fill: =RGBA(0, 0, 0, 0)
                    HoverFill: =RGBA(255, 255, 255, 0.08)
                    PressedFill: =RGBA(255, 255, 255, 0.15)
                    Color: =RGBA(199, 210, 234, 1)
                    HoverColor: =gblTheme.White
                    PressedColor: =gblTheme.White
                    BorderThickness: =0
                    Size: =9
                    Font: =gblTheme.FontBody
            - btn_Policies:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =Parent.Width - 360
                    Y: =0
                    Width: =80
                    Height: =32
                    Text: ="Policies"
                    OnSelect: =Launch("https://policies.syr.edu")
                    Fill: =RGBA(0, 0, 0, 0)
                    HoverFill: =RGBA(255, 255, 255, 0.08)
                    PressedFill: =RGBA(255, 255, 255, 0.15)
                    Color: =RGBA(199, 210, 234, 1)
