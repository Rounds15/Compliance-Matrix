                            X: =18
                            Y: =38
                            Width: =Parent.TemplateWidth - 36
                            Height: =3
                            Fill: =gblTheme.Orange
                            BorderThickness: =0
                            Visible: =ThisItem.NavKey = cmp_Header.ActiveScreen
                    - btn_NavOverlay:
