
Screens:

    scr_FunctionDetail:
        Properties:
            Fill: =gblTheme.White
            OnVisible: |
                =Set(gblFdMode, "read");
                Set(gblFdPanel, "");
                Set(gblFdToast, "");
                // Manage mode turns the ownership chain from a read-only roster
                // into an editor. Off on every arrival - an administrator who
                // left it on for one function should not silently be editing
                // the next one.
                Set(gblFdManage, false);
                Set(gblFdAddRole, Blank());
                Set(gblFdAddRoleLabel, "");
                Set(gblFdNewPerson, Blank());
                // Working copy so Cancel can discard without touching Dataverse.
                Set(gblFdDraft, gblSelectedFunction);
                Set(
                    gblFdFlag,
                    LookUp(
                        dsFlags,
                        su_function.su_compliancefunctionid
                            = gblSelectedFunction.su_compliancefunctionid
                            && su_status = "Active"
                    )
                );
                // Counsel of record for this topic, falling back to the single
                // default escalation row (the General Counsel).
                Set(
                    gblFdCounsel,
                    Coalesce(
                        LookUp(
                            colCounsel,
                            su_riskarea.su_riskareaid
                                = gblSelectedFunction.su_riskarea.su_riskareaid
                        ),
                        gblDefaultCounsel
                    )
                );
                ClearCollect(
                    colFdDeadlines,
                    SortByColumns(
                        Filter(
                            dsDeadlines,
                            su_function.su_compliancefunctionid
                                = gblSelectedFunction.su_compliancefunctionid
                        ),
                        "su_duedate",
                        SortOrder.Ascending
                    )
                );
                ClearCollect(
                    colFdGaps,
                    SortByColumns(
                        Filter(
                            dsGaps,
                            su_function.su_compliancefunctionid
                                = gblSelectedFunction.su_compliancefunctionid
                        ),
                        "su_openeddate",
                        SortOrder.Descending
                    )
                );
                ClearCollect(
                    colFdOwnership,
                    Filter(
                        dsOwnership,
                        su_function.su_compliancefunctionid
                            = gblSelectedFunction.su_compliancefunctionid
                    )
                )

        Children:

            - cmp_HeaderFd:
                Control: cmp_Header
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =104
                    ActiveScreen: ="Functions"
                    OpenGapCount: =gblOpenGapCount

            - btn_FdBack:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =64
                    Y: =116
                    Width: =130
                    Height: =32
                    Text: ="All functions"
                    OnSelect: =Back()
                    Fill: =RGBA(0, 0, 0, 0)
                    Color: =gblTheme.OrangeDark
                    HoverFill: =RGBA(215, 65, 0, 0.06)
                    BorderThickness: =0
                    Size: =10
                    FontWeight: =FontWeight.Semibold
                    Font: =gblTheme.FontBody
            - lbl_FdCrumb:
                Control: Label@2.5.1
                Properties:
                    X: =200
                    Y: =116
                    Width: =700
                    Height: =32
                    Text: |
                        ="/  " & gblSelectedFunction.su_riskarea.su_name & "  /  " &
                         gblSelectedFunction.su_name
                    Color: =gblTheme.GrayMid
                    Size: =10
                    VerticalAlign: =VerticalAlign.Middle
                    Font: =gblTheme.FontBody

            - rec_FdHead:
                Control: Rectangle@2.3.0
                Properties:
                    X: =0
                    Y: =156
                    Width: =Parent.Width
                    Height: =150
                    Fill: =gblTheme.Navy
                    BorderThickness: =0
            - rec_FdHeadRule:
                Control: Rectangle@2.3.0
                Properties:
                    X: =0
                    Y: =303
                    Width: =Parent.Width
                    Height: =3
                    Fill: =gblTheme.Orange
                    BorderThickness: =0
            - lbl_FdEyebrow:
                Control: Label@2.5.1
                Properties:
                    X: =64
                    Y: =174
                    Width: =800
                    Height: =20
                    Text: |
                        =Upper(gblSelectedFunction.su_riskarea.su_name & "  |  " &
                               gblSelectedFunction.su_domain.su_name)
                    Color: =gblTheme.OrangeLight
                    Size: =8
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontBody
            - lbl_FdTitle:
                Control: Label@2.5.1
                Properties:
                    X: =64
                    Y: =198
                    Width: =Parent.Width - 460
                    Height: =56
                    Text: |
                        =If(gblFdMode = "edit", "Editing - ", "") & gblSelectedFunction.su_name
                    Color: =gblTheme.White
                    Size: =22
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontDisplay
            - cmp_FdRisk:
                Control: cmp_RiskPill
                Properties:
                    X: =64
                    Y: =262
                    Width: =74
                    Height: =24
                    Risk: |
                        =Switch(
                            gblSelectedFunction.su_risk,
                            "High",     "High",
                            "Moderate",   "Moderate",
                            "Low",      "Low",
                            ""
                        )
            - lbl_FdCode:
                Control: Label@2.5.1
                Properties:
                    X: =148
                    Y: =262
                    Width: =90
                    Height: =24
                    Text: =gblSelectedFunction.su_functioncode
                    Fill: =RGBA(255, 255, 255, 0.1)
                    Color: =RGBA(199, 210, 234, 1)
                    Size: =9
                    Align: =Align.Center
                    VerticalAlign: =VerticalAlign.Middle
                    Font: =gblTheme.FontBody
            - lbl_FdGapCount:
                Control: Label@2.5.1
                Properties:
                    X: =248
                    Y: =262
                    Width: =104
                    Height: =24
                    Text: |
                        =gblSelectedFunction.su_opengapcount & " open " &
                         If(gblSelectedFunction.su_opengapcount = 1, "gap", "gaps")
                    Visible: =gblSelectedFunction.su_opengapcount > 0
                    Fill: =gblTheme.High
                    Color: =gblTheme.White
                    Size: =8
                    FontWeight: =FontWeight.Bold
                    Align: =Align.Center
                    VerticalAlign: =VerticalAlign.Middle
                    Font: =gblTheme.FontBody
            - lbl_FdFlagged:
                Control: Label@2.5.1
                Properties:
                    X: =362
                    Y: =262
                    Width: =140
                    Height: =24
                    Text: ="Flagged for review"
                    Visible: =!IsBlank(gblFdFlag)
                    Fill: =gblTheme.Orange
                    Color: =gblTheme.White
                    Size: =8
                    FontWeight: =FontWeight.Bold
                    Align: =Align.Center
                    VerticalAlign: =VerticalAlign.Middle
                    Font: =gblTheme.FontBody

            - btn_FdSave:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =Parent.Width - 360
                    Y: =252
                    Width: =150
                    Height: =40
                    Text: ="Save changes"
                    Visible: =gblFdMode = "edit"
                    OnSelect: |
                        =Patch(
                            dsFunctions,
                            gblSelectedFunction,
                            {
                                su_name: txt_FdName.Text,
                                // Risk area and domain are lookups now, not free
                                // text. The domain dropdown carries the whole
                                // record, and its parent risk area is written
                                // alongside so the two never disagree.
                                su_domain: drp_FdDomain.Selected,
                                su_riskarea: drp_FdDomain.Selected.su_riskarea,
                                su_statute: txt_FdStatute.Text,
                                su_citation: txt_FdCitation.Text,
                                su_statuteurl: txt_FdStatuteUrl.Text,
                                su_description: txt_FdDescription.Text,
                                su_reporting: txt_FdReporting.Text,
                                su_deadlinenarrative: txt_FdDeadlineNarrative.Text,
                                su_resourcelabel: txt_FdResourceLabel.Text,
                                su_resourceurl: txt_FdResourceUrl.Text,
                                su_risk: Switch(
                                    drp_FdRisk.Selected.Value,
                                    "High",     "High",
                                    "Moderate",   "Moderate",
                                    "Low"
                                ),
                                su_lastreviewed: gblToday
                            }
                        );
                        ForAll(
                            colFdDeadlines As dl,
                            Patch(
                                dsDeadlines,
                                dl,
                                {
                                    su_owner: gblSelectedFunction.su_complianceowner,
                                    su_risk: Switch(
                                        drp_FdRisk.Selected.Value,
                                        "High",     "High",
                                        "Moderate",   "Moderate",
                                        "Low"
                                    )
                                }
                            )
                        );
                        Set(
                            gblSelectedFunction,
                            LookUp(
                                dsFunctions,
                                su_compliancefunctionid
                                    = gblSelectedFunction.su_compliancefunctionid
                            )
                        );
                        Set(gblFdMode, "read");
                        Set(
                            gblFdToast,
                            "Saved. Owner fields on " & CountRows(colFdDeadlines) &
                            " deadline record(s) updated."
                        )
                    Fill: =gblTheme.Orange
                    HoverFill: =gblTheme.OrangeMedium
                    Color: =gblTheme.White
                    BorderThickness: =0
                    Size: =10
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontBody
            - btn_FdCancel:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =Parent.Width - 198
                    Y: =252
                    Width: =110
                    Height: =40
                    Text: ="Cancel"
                    Visible: =gblFdMode = "edit"
                    OnSelect: =Set(gblFdMode, "read")
                    Fill: =RGBA(0, 0, 0, 0)
                    Color: =gblTheme.White
                    BorderColor: =RGBA(255, 255, 255, 0.5)
                    BorderThickness: =1
                    HoverFill: =RGBA(255, 255, 255, 0.1)
                    Size: =10
                    FontWeight: =FontWeight.Semibold
                    Font: =gblTheme.FontBody

            - cnt_FlagPanel:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                    X: =0
                    Y: =306
                    Width: =Parent.Width
                    Height: =222
                    Fill: =ColorFade(gblTheme.Orange, 0.94)
                    Visible: =gblFdPanel = "flag"
                Children:
                    - lbl_FlagPanelTitle:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =18
                            Width: =600
                            Height: =26
                            Text: ="Flag this function for review"
                            Color: =gblTheme.Navy
                            Size: =13
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontDisplay
                    - lbl_FlagPanelLabel:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =50
                            Width: =600
                            Height: =20
                            Text: ="Why does this need review?"
                            Color: =gblTheme.GrayDark
                            Size: =9
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - txt_FlagReason:
                        Control: Classic/TextInput@2.3.2
                        Properties:
                            X: =64
                            Y: =72
                            Width: =Parent.Width - 460
                            Height: =70
                            Default: =""
                            HintText: ="e.g. Citation may be superseded by the 2026 final rule."
                            Mode: =TextMode.MultiLine
                            BorderColor: =gblTheme.Border
                            FocusedBorderColor: =gblTheme.Orange
                            Size: =11
                            Font: =gblTheme.FontBody
                    - lbl_FlagPanelNote:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =148
                            Width: =Parent.Width - 460
                            Height: =20
                            Text: |
                                ="Flagging notifies the compliance office and adds this function to the administrator review queue. The office responds within five business days."
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Font: =gblTheme.FontBody
                    - btn_FlagSubmit:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =64
                            Y: =174
                            Width: =130
                            Height: =38
                            Text: ="Submit flag"
                            DisplayMode: |
                                =If(
                                    IsBlank(Trim(txt_FlagReason.Text)),
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                            OnSelect: |
                                =Collect(
                                    dsFlags,
                                    {
                                        su_name: "Review requested - " &
                                                 gblSelectedFunction.su_functioncode,
                                        su_function: gblSelectedFunction,
                                        su_reason: txt_FlagReason.Text,
                                        su_status: "Active",
                                        su_flaggedby: gblMe,
                                        su_flaggedon: gblToday
                                    }
                                );
                                Patch(
                                    dsFunctions,
                                    gblSelectedFunction,
                                    {su_isflagged: true}
                                );
                                Set(
                                    gblFdFlag,
                                    LookUp(
                                        dsFlags,
                                        su_function.su_compliancefunctionid
                                            = gblSelectedFunction.su_compliancefunctionid
                                            && su_status = "Active"
                                    )
                                );
                                Reset(txt_FlagReason);
                                Set(gblFdPanel, "");
                                Set(gblFdToast, "Flag submitted to the compliance office.")
                            Fill: =gblTheme.Orange
                            HoverFill: =gblTheme.OrangeMedium
                            DisabledFill: =gblTheme.GrayLight
                            Color: =gblTheme.White
                            BorderThickness: =0
                            Size: =10
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - btn_FlagCancel:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =206
                            Y: =174
                            Width: =100
                            Height: =38
                            Text: ="Cancel"
                            OnSelect: =Set(gblFdPanel, "")
                            Fill: =RGBA(0, 0, 0, 0)
                            Color: =gblTheme.Navy
                            BorderColor: =gblTheme.Navy
                            BorderThickness: =1
                            HoverFill: =RGBA(0, 14, 84, 0.06)
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody

            - cnt_GapPanel:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                    X: =0
                    Y: =306
                    Width: =Parent.Width
                    Height: =270
                    Fill: =ColorFade(gblTheme.High, 0.95)
                    Visible: =gblFdPanel = "gap"
                Children:
                    - lbl_GapPanelTitle:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =18
                            Width: =600
                            Height: =26
                            Text: ="Log a compliance gap"
                            Color: =gblTheme.Navy
                            Size: =13
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontDisplay
                    - lbl_GapSummaryLabel:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =50
                            Width: =400
                            Height: =20
                            Text: ="Gap summary"
                            Color: =gblTheme.GrayDark
                            Size: =9
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - txt_GapTitle:
                        Control: Classic/TextInput@2.3.2
                        Properties:
                            X: =64
                            Y: =72
                            Width: =Parent.Width - 640
                            Height: =42
                            Default: =""
                            HintText: ="What is out of compliance?"
                            BorderColor: =gblTheme.Border
                            FocusedBorderColor: =gblTheme.High
                            Size: =11
                            Font: =gblTheme.FontBody
                    - lbl_GapSeverityLabel:
                        Control: Label@2.5.1
                        Properties:
                            X: =Parent.Width - 560
                            Y: =50
                            Width: =180
                            Height: =20
                            Text: ="Severity"
                            Color: =gblTheme.GrayDark
                            Size: =9
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - drp_GapSeverity:
                        Control: Classic/DropDown@2.3.1
                        Properties:
                            X: =Parent.Width - 560
                            Y: =72
                            Width: =180
                            Height: =42
                            Items: |
                                =Table(
                                    {Value: "High"},
                                    {Value: "Moderate"},
                                    {Value: "Low"}
                                )
                            Default: ="Moderate"
                            BorderColor: =gblTheme.Border
                            Size: =11
                            Font: =gblTheme.FontBody
                    - lbl_GapDetailLabel:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =122
                            Width: =400
                            Height: =20
                            Text: ="Detail and remediation plan"
                            Color: =gblTheme.GrayDark
                            Size: =9
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - txt_GapNote:
                        Control: Classic/TextInput@2.3.2
                        Properties:
                            X: =64
                            Y: =144
                            Width: =Parent.Width - 460
                            Height: =62
                            Default: =""
                            HintText: ="What was found, how it was identified, and what happens next."
                            Mode: =TextMode.MultiLine
                            BorderColor: =gblTheme.Border
                            FocusedBorderColor: =gblTheme.High
                            Size: =11
                            Font: =gblTheme.FontBody
                    - lbl_GapPanelNote:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =212
                            Width: =Parent.Width - 460
                            Height: =18
                            Text: |
                                ="Opens a gap record against " & gblSelectedFunction.su_functioncode &
                                 " and notifies " & gblSelectedFunction.su_complianceowner.su_name &
                                 " and the compliance office."
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Font: =gblTheme.FontBody
                    - btn_GapSubmit:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =64
                            Y: =236
                            Width: =120
                            Height: =38
                            Text: ="Log gap"
                            DisplayMode: |
                                =If(
                                    IsBlank(Trim(txt_GapTitle.Text)),
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                            OnSelect: |
                                =Collect(
                                    dsGaps,
                                    {
                                        su_name: txt_GapTitle.Text,
                                        su_gapcode: "GAP-" &
                                            Text(CountRows(dsGaps) + 201, "000"),
                                        su_function: gblSelectedFunction,
                                        su_severity: Switch(
                                            drp_GapSeverity.Selected.Value,
                                            "High",     "High",
                                            "Moderate",   "Moderate",
                                            "Low"
                                        ),
                                        su_status: "Open",
                                        su_openeddate: gblToday,
                                        su_note: txt_GapNote.Text,
                                        su_owner: gblSelectedFunction.su_complianceowner
                                    }
                                );
                                ClearCollect(
                                    colFdGaps,
                                    SortByColumns(
                                        Filter(
                                            dsGaps,
                                            su_function.su_compliancefunctionid
                                                = gblSelectedFunction.su_compliancefunctionid
                                        ),
                                        "su_openeddate",
                                        SortOrder.Descending
                                    )
                                );
                                Set(
                                    gblOpenGapCount,
                                    CountRows(
                                        Filter(dsGaps, su_status <> "Closed")
                                    )
                                );
                                Reset(txt_GapTitle);
                                Reset(txt_GapNote);
                                Set(gblFdPanel, "");
                                Set(gblFdToast, "Gap logged and routed to the gap tracker.")
                            Fill: =gblTheme.High
                            HoverFill: =gblTheme.High
                            DisabledFill: =gblTheme.GrayLight
                            Color: =gblTheme.White
                            BorderThickness: =0
                            Size: =10
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - btn_GapCancel:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =196
                            Y: =236
                            Width: =100
                            Height: =38
                            Text: ="Cancel"
                            OnSelect: =Set(gblFdPanel, "")
                            Fill: =RGBA(0, 0, 0, 0)
                            Color: =gblTheme.Navy
                            BorderColor: =gblTheme.Navy
                            BorderThickness: =1
                            HoverFill: =RGBA(0, 14, 84, 0.06)
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody

            - cnt_PersonPanel:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                    X: =0
                    Y: =306
                    Width: =Parent.Width
                    Height: =310
                    Fill: =ColorFade(gblTheme.Navy, 0.96)
                    Visible: =gblFdPanel = "person"
                Children:
                    - lbl_PersonPanelTitle:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =18
                            Width: =600
                            Height: =26
                            Text: ="Add someone to the " & Lower(gblFdAddRoleLabel) & " role"
                            Color: =gblTheme.Navy
                            Size: =13
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontDisplay
                    - lbl_PersonPanelHint:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =46
                            Width: =600
                            Height: =22
                            Text: ="Search the Compliance Directory by name or email."
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Font: =gblTheme.FontBody
                    - txt_PersonSearch:
                        Control: Classic/TextInput@2.3.2
                        Properties:
                            X: =64
                            Y: =72
                            Width: =400
                            Height: =36
                            Default: =""
                            HintText: ="Search by name or email"
                            BorderColor: =gblTheme.Border
                            FocusedBorderColor: =gblTheme.Orange
                            Size: =11
                            Font: =gblTheme.FontBody
                    - drp_PersonSubrole:
                        Control: Classic/DropDown@2.3.1
                        Properties:
                            X: =476
                            Y: =72
                            Width: =150
                            Height: =36
                            Items: =["Support", "Advisory", "Primary"]
                            BorderColor: =gblTheme.Border
                            Size: =10
                            Font: =gblTheme.FontBody
                    - lbl_PersonSubroleLabel:
                        Control: Label@2.5.1
                        Properties:
                            X: =476
                            Y: =52
                            Width: =150
                            Height: =18
                            Text: ="Weight on this role"
                            Color: =gblTheme.GrayMid
                            Size: =8
                            Font: =gblTheme.FontBody
                    - gal_PersonResults:
                        Control: Gallery@2.15.0
                        Variant: Vertical
                        Properties:
                            X: =64
                            Y: =118
                            Width: =562
                            Height: =140
                            TemplateSize: =46
                            TemplatePadding: =0
                            ShowScrollbar: =true
                            Items: |
                                =If(
                                    Len(Trim(txt_PersonSearch.Text)) < 2,
                                    Blank(),
                                    FirstN(
                                        Filter(
                                            dsDirectory,
                                            su_active = true,
                                            StartsWith(su_name, Trim(txt_PersonSearch.Text))
                                                || StartsWith(su_email, Trim(txt_PersonSearch.Text))
                                        ),
                                        6
                                    )
                                )
                        Children:
                            - lbl_PersonResultName:
                                Control: Label@2.5.1
                                Properties:
                                    X: =4
                                    Y: =4
                                    Width: =Parent.TemplateWidth - 130
                                    Height: =20
                                    Text: =ThisItem.su_name
                                    Color: =gblTheme.Navy
                                    Size: =10
                                    FontWeight: =FontWeight.Semibold
                                    Font: =gblTheme.FontBody
                            - lbl_PersonResultSub:
                                Control: Label@2.5.1
                                Properties:
                                    X: =4
                                    Y: =23
                                    Width: =Parent.TemplateWidth - 130
                                    Height: =18
                                    Text: |
                                        =ThisItem.su_jobtitle & "  |  " & ThisItem.su_email
                                    Color: =gblTheme.GrayMid
                                    Size: =8
                                    Font: =gblTheme.FontBody
                            - btn_PersonResultAdd:
                                Control: Classic/Button@2.2.0
                                Properties:
                                    X: =Parent.TemplateWidth - 122
                                    Y: =8
                                    Width: =118
                                    Height: =30
                                    Text: |
                                        ="Add as " & Lower(drp_PersonSubrole.Selected.Value)
                                    DisplayMode: |
                                        =If(
                                            IsBlank(gblFdAddRole),
                                            DisplayMode.Disabled,
                                            DisplayMode.Edit
                                        )
                                    OnSelect: |
                                        =If(
                                            !IsBlank(
                                                LookUp(
                                                    colFdOwnership,
                                                    su_role = gblFdAddRole
                                                        && su_person.su_compliancedirectoryid
                                                            = ThisItem.su_compliancedirectoryid
                                                )
                                            ),
                                            Set(
                                                gblFdToast,
                                                ThisItem.su_name & " already holds this role."
                                            ),
                                            Collect(
                                                dsOwnership,
                                                {
                                                    su_name: ThisItem.su_name & " - " &
                                                             gblFdAddRoleLabel & " - " &
                                                             gblSelectedFunction.su_functioncode,
                                                    su_function: gblSelectedFunction,
