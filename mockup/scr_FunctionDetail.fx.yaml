            - cnt_FdRail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                    X: =Parent.Width - 396
                    Y: |
                        =306 + If(gblFdPanel = "flag", 222, gblFdPanel = "gap", 270, gblFdPanel = "person", 310, 0) + 24
                    Width: =332
                    Height: =Parent.Height - 400
                    Fill: =RGBA(0, 0, 0, 0)
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGap: =16
                    LayoutOverflowY: =LayoutOverflow.Scroll
                Children:
                    - lbl_RailStatusHead:
                        Control: Label@2.5.1
                        Properties:
                            Height: =24
                            Width: =Parent.Width
                            Text: ="RECORD STATUS"
                            Color: =gblTheme.OrangeDark
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - lbl_RailStatusBody:
                        Control: Label@2.5.1
                        Properties:
                            Height: =126
                            Width: =Parent.Width
                            Text: |
                                ="Open gaps          " &
                                 If(gblSelectedFunction.su_opengapcount > 0,
                                    Text(gblSelectedFunction.su_opengapcount),
                                    "None") & Char(10) &
                                 "Next deadline    " &
                                 If(IsBlank(gblSelectedFunction.su_nextduedate),
                                    "None scheduled",
                                    Text(gblSelectedFunction.su_nextduedate, "mmm d, yyyy")) & Char(10) &
                                 "Under review     " &
                                 If(IsBlank(gblFdFlag), "No", "Yes") & Char(10) &
                                 "Last reviewed    " &
                                 If(IsBlank(gblSelectedFunction.su_lastreviewed),
                                    "Not recorded",
                                    Text(gblSelectedFunction.su_lastreviewed, "mmm d, yyyy"))
                            Fill: =gblTheme.Surface
                            Color: =gblTheme.GrayDark
                            Size: =10
                            Font: =gblTheme.FontBody
                    - lbl_RailActionHead:
                        Control: Label@2.5.1
                        Properties:
                            Height: =24
                            Width: =Parent.Width
                            Text: ="TAKE ACTION"
                            Color: =gblTheme.OrangeDark
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - btn_RailEdit:
                        Control: Classic/Button@2.2.0
                        Properties:
                            Height: =38
                            Width: =Parent.Width
                            Text: ="Edit this record"
                            Visible: =gblIsAdmin && gblFdMode = "read"
                            OnSelect: =Set(gblFdMode, "edit"); Set(gblFdPanel, "")
                            Fill: =RGBA(0, 0, 0, 0)
                            Color: =gblTheme.Navy
                            BorderColor: =gblTheme.Navy
                            BorderThickness: =1
                            HoverFill: =RGBA(0, 14, 84, 0.06)
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - btn_RailFlag:
                        Control: Classic/Button@2.2.0
                        Properties:
                            Height: =38
                            Width: =Parent.Width
                            Text: ="Flag for review"
                            Visible: =IsBlank(gblFdFlag) && gblFdMode = "read"
                            OnSelect: =Set(gblFdPanel, "flag")
                            Fill: =RGBA(0, 0, 0, 0)
                            Color: =gblTheme.Navy
                            BorderColor: =gblTheme.Navy
                            BorderThickness: =1
                            HoverFill: =RGBA(0, 14, 84, 0.06)
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
