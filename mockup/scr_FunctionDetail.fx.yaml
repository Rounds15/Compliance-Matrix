                                        su_role: gblFdAddRole,
                                        su_subrole: Switch(
                                            drp_PersonSubrole.Selected.Value,
                                            "Primary",  "Primary",
                                            "Advisory", "Advisory",
                                            "Support"
                                        )
                                    }
                                );
                                ClearCollect(
                                    colFdOwnership,
                                    Filter(
                                        dsOwnership,
                                        su_function.su_compliancefunctionid
                                            = gblSelectedFunction.su_compliancefunctionid
                                    )
                                );
                                Reset(txt_PersonNewName);
                                Reset(txt_PersonNewEmail);
                                Reset(txt_PersonNewTitle);
                                Reset(txt_PersonNewUnit);
                                Set(gblFdPanel, "");
                                Set(
                                    gblFdToast,
                                    gblFdNewPerson.su_name &
                                    " is in the Compliance Directory and assigned as " &
                                    Lower(drp_PersonSubrole.Selected.Value) & " on the " &
                                    Lower(gblFdAddRoleLabel) & " role."
