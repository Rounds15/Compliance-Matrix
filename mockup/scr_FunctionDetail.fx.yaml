                            Color: =gblTheme.High
                            BorderColor: =gblTheme.High
                            BorderThickness: =1
                            HoverFill: =RGBA(220, 38, 38, 0.06)
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - lbl_RailCounselHead:
                        Control: Label@2.5.1
                        Properties:
                            Height: =24
                            Width: =Parent.Width
                            Text: ="LEGAL QUESTIONS"
                            Color: =gblTheme.OrangeDark
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - lbl_RailCounselBody:
                        Control: Label@2.5.1
                        Properties:
                            Height: =134
                            Width: =Parent.Width
                            Text: |
                                ="Counsel of record for " & gblSelectedFunction.su_riskarea.su_name &
                                 ". Reach out before responding to a regulator, signing an agreement, or interpreting the statute." &
                                 Char(10) & Char(10) &
                                 gblFdCounsel.su_attorney.su_name & Char(10) &
                                 gblFdCounsel.su_attorney.su_jobtitle
                            Fill: =gblTheme.Surface
                            Color: =gblTheme.GrayDark
                            Size: =10
                            Font: =gblTheme.FontBody
                    - btn_RailCounselEmail:
                        Control: Classic/Button@2.2.0
                        Properties:
                            Height: =38
                            Width: =Parent.Width
                            Text: ="Email a question"
                            OnSelect: |
                                =Launch(
                                    "mailto:" & gblFdCounsel.su_attorney.su_email &
                                    "?subject=" & EncodeUrl(
                                        "Legal question - " &
                                        gblSelectedFunction.su_functioncode & " " &
                                        gblSelectedFunction.su_name
                                    )
                                )
                            Fill: =gblTheme.Navy
                            HoverFill: =gblTheme.BlueMedium
                            Color: =gblTheme.White
                            BorderThickness: =0
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody

