                    - btn_PersonNewAdd:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =700
                            Y: =162
                            Width: =260
                            Height: =38
                            Text: ="Add to the directory and assign"
                            DisplayMode: |
                                =If(
                                    IsBlank(Trim(txt_PersonNewName.Text))
                                        || !("@" in txt_PersonNewEmail.Text)
                                        || IsBlank(gblFdAddRole),
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                            OnSelect: |
                                =Set(gblFdNewEmail, Lower(Trim(txt_PersonNewEmail.Text)));
                                If(
                                    IsBlank(
                                        LookUp(
                                            dsDirectory,
                                            Lower(su_email) = gblFdNewEmail
                                        )
                                    ),
                                    Collect(
                                        dsDirectory,
                                        {
                                            su_name: Trim(txt_PersonNewName.Text),
                                            su_email: gblFdNewEmail,
                                            su_jobtitle: Trim(txt_PersonNewTitle.Text),
                                            su_unit: Trim(txt_PersonNewUnit.Text),
                                            su_active: true
                                        }
                                    )
                                );
                                // Read the row back rather than using what the
                                // write returned, so the create and reuse paths
                                // end up holding the same thing.
                                Set(
                                    gblFdNewPerson,
                                    LookUp(
                                        dsDirectory,
                                        Lower(su_email) = gblFdNewEmail
                                    )
                                );
                                Collect(
                                    dsOwnership,
                                    {
                                        su_name: gblFdNewPerson.su_name & " - " &
                                                 gblFdAddRoleLabel & " - " &
                                                 gblSelectedFunction.su_functioncode,
