    The filer must also provide to the attorney a written statement of the information required to be\
    \ included on the return.\n\n \tNote that employers must report entire settlement amounts, including\
    \ the amount paid to the attorneys, as income to the plaintiff, and also prepare a Form 1099 reporting\
    \ the amount paid to the attorneys as income to the attorneys."
