- code: '53'
  name: Perkins Loans
  riskArea: T01
  domain: A007
  risk: null
  statute: Higher Education Act
  citation: 34 CFR Part 674 - FEDERAL PERKINS LOAN PROGRAM
  statuteUrl: https://www.law.cornell.edu/cfr/text/34/part-674
  description: "Perkins Loans are not currently supported or funded by the federal government, and are\
    \ self-sustaining only.  Authorization of additional appropriations for the Federal Perkins Loan program\
    \ beyond FY2015 is prohibited.\n\n \tThe university must: 1) Make loans first to students with exceptional\
    \ need; 2) provide assurances that thorough and adequate loan information is provided to student borrowers;\
    \ and 3) enter into cooperative agreements with credit bureaus to exchange information concerning\
    \ student borrowers.\n\n \tAt or prior to making a Perkins Loan the university must disclose thorough\
    \ and adequate loan information including: 1) Name of institution of higher education and payment\
    \ address; 2) principal loan amount and interest rate; 3) charges collected at or prior to disbursal\
    \ and whether deducted from the loan or paid separately by borrower; 4) yearly and cumulative maximum\
    \ amounts that may be borrowed; 5) when repayment is required and when accrued interest must be paid;\
    \ 6) minimum and maximum repayment term, minimum monthly payment; 7) definition of default and consequences,\
    \ and default penalty; 8) total cumulative balance and projected monthly payment; 9) options for consolidation\
    \ or refinancing; 10) right to prepay without penalty and deferral options; 11) effect of loan on\
    \ eligibility for other aid; 12) cost to borrower in making loan; and 13) a notice and explanation\
    \ regarding the end to future availability of the loan made under this part.\n\n \tAn institution\
    \ was able to make loans to an eligible undergraduate borrower under the Perkins program through September\
    \ 30, 2017, provided that the institution had already awarded all Federal Direct Loans for which the\
    \ student was eligible. Through March 31, 2018, an institution may continue to disburse Perkins Loans\
    \ to an eligible graduate student to enable the student to continue or complete an academic program,\
    \ provided that the student received a Perkins loan for an academic year ending prior to October 1,\
    \ 2017, and provided that the institution has awarded all Federal Direct Loans for which the student\
    \ is eligible. Prior to Perkins Loan disbursement, an IHE must provide notice and explanation to all\
    \ borrowers regarding unavailability of future Perkins loans, limited Perkins loan repayment and forgiveness\
    \ options, and Direct Loan consolidation options. Also, an IHE must provide notice and explanation\
    \ to new and current undergraduate borrowers regarding a comparison of Perkins and Direct loan interest\
    \ rates.\n\n \tBeginning October 1, 2017, each participating IHE must pay to the Department of Education:\
    \ (1) a portion of the federal share of the balance of its Perkins Loan funds; (2) a portion of the\
    \ Perkins student loan payments, including principal and interest, received by the institution; and\
    \ (3) a capital distribution from its Perkins Loan fund."
  reporting: >-
    20 U.S.C. § 1087bb and 34 C.F.R. § 674.19: Fiscal Operations Report and Application to Participate
    (FISAP) reports cover the institution’s fiscal operations and request for future funding for Title
    IV Federal campus-based funds (SEOG, Perkins Loans, Work Study, and Federal Pell Grants. Due by September
    30 each year.
  deadlineNarrative: September 30 annually (FISAP submission)
  resourceLabel: Perkins Loans - CFO
  resourceUrl: https://finance.syr.edu/bursar/perkins-loans/
  executiveOwner: lpagnew@syr.edu
  unitOwner: mbsipley@syr.edu
  complianceOwner: cdiecuch@syr.edu
