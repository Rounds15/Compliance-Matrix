  statuteUrl: https://www.law.cornell.edu/uscode/text/18/part-II
  description: |-
    The guidelines at §8B2.1 set forth the requirements for an effective compliance and ethics program for organizations. Companies should affirmatively answer three fundamental questions in evaluating a
    compliance program: 1) is the compliance program well designed? 2) is the program being implemented effectively and in good faith? and 3) does the compliance program work in practice? An effective compliance program relies on seven key elements: 1) Written policies and procedures; 2) Effective training and education; 3) Clear Communication; 4) Internal monitoring and auditing; 6) Enforcement with disciplinary guidelines; and 7) Prompt response and corrective action. Organizations are vicariously liable under federal criminal law for acts committed by their agents. The definition of "organization" at 18 U.S.C. §18 includes non-profits such as a university.
