  statuteUrl: https://grants.nih.gov/grants/policy/coi/
  description: >-
    Federal law prohibits investigators and employees from participating in matters where they have a
    personal financial interest (5 U.S.C. § 7353). Additionally, PHS regulations (42 C.F.R. Part 50) require
    institutions that apply for or receive PHS research funding to maintain FCOI policies, ensure investigator
    disclosure of significant financial interests (SFIs), review disclosed SFIs, and manage identified
    conflicts prior to expending award funds. The 2011 revised regulations increased accountability, transparency,
    and effective institutional management of investigators' financial conflicts of interest.
