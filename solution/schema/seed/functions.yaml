    The institution must publish an annual security report containing three years of crime statistics,
    security policy statements, and required disclosures, and distribute it to all students and employees.
  reporting: ASR published and crime statistics submitted to the Department of Education.
  deadlineNarrative: Annually by October 1.
  resourceLabel: Clery Compliance
  resourceUrl: https://policies.syr.edu
  risk: Critical
