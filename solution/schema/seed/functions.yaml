  citation: § 668.217 Default prevention plans.
  statuteUrl: https://www.ecfr.gov/current/title-34/subtitle-B/chapter-VI/part-668/subpart-N/section-668.217
  description: >-
    Renders institutions with high default rates on student loans ineligible to participate in certain
    student loan programs. Institutions may be ineligible for federal student aid if the cohort default
    rate exceeds 30% three straight fiscal years or above 40% for one year. If the institution's cohort
    default rate equals or exceeds 25%, the institution's FCC is reduced to zero. An institution with
    a cohort default rate that equals or exceeds 50% for each of the three most recent years for which
