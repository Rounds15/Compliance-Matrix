- code: '61'
  name: State Authorization
  riskArea: T01
  domain: A008
  risk: null
  statute: Higher Education Act
  citation: HEA § 101(a); 34 C.F.R. § 600.9
  statuteUrl: https://www.law.cornell.edu/uscode/text/20/chapter-28/subchapter-I/part-A
  description: "In order for its students to be eligible for Title IV student financial assistance, an\
    \ institution must be able to demonstrate to ED that it meets the legal authorization standards of\
    \ every state in which it operates.\n\n \tAn institution offering distance education or correspondence\
    \ courses must be authorized by each state in which the institution enrolls students, if such authorization\
    \ is required by the state, in order for these programs to be Title IV eligible. Alternatively, an\
    \ institution may be authorized through state authorization reciprocity agreements. Institutions must\
    \ also (1) document the state process for resolving complaints from students enrolled in distance\
    \ education or correspondence courses and (2) provide public and individualized disclosures to enrolled\
    \ and prospective students regarding its programs offered solely through distance education or correspondence\
    \ courses. (effective July 1, 2018)\n\n \tAn institution must make available, upon request, to any\
    \ enrolled or prospective student a copy of the documents describing the institution's accreditation\
    \ and its state, federal or tribal approval or licensing. In addition, the institution must provide\
    \ students and prospective students with contact information for filing complaints with the institution's\
    \ accreditor and with its state approval agency and any other relevant state official or agency."
  reporting: >-
    State authorization must be obtained in each state where students are enrolled in distance education
    or where the institution has a physical presence. Registration renewal deadlines vary by state.
  deadlineNarrative: Ongoing; renewal per each state's schedule (varies by state, typically annual or
    biennial)
  resourceLabel: State Authorization Compliance
