  statuteUrl: https://www.law.cornell.edu/cfr/text/34/668.163
  description: "To provide Federal Supplemental Educational Opportunity Grant (FSEOG)  grants to exceptionally\
    \ needy undergraduate students the university must: 1) Sign a Participation Agreement with ED; 2)\
    \ maintain funds in accordance with 34 C.F.R. § 668.163; 3) maintain an internal control system so\
