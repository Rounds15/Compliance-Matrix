  citation: 34 CFR § 685.200 - Borrower eligibility
  statuteUrl: https://www.law.cornell.edu/cfr/text/34/685.200
  description: "PLUS Loans are available to the parents of eligible students through the FDLP (Direct)\
    \ or FFEL (private) program, but not both.\n\n \tIf applications are made for an FFEL PLUS loan, the\
    \ University must: 1) Verify the parent's immigration status and social security number in the same\
    \ manner verified for students; 2) extend PLUS loans only to parents who do not have an adverse credit\
    \ history unless certain additional requirements are met; 3) extend such loans on the same terms,\
    \ conditions and benefits as other FFEL loans; 4) for any academic year, limit the loan amount to\
    \ the student's estimated cost of attendance minus other financial aid; and 5) be disbursed to the\
    \ institution electronically or co-payable to the school and parent.\n\n \tGraduate/professional degree\
    \ students are eligible to borrow under the PLUS Loan Program up to their cost of attendance minus\
    \ other estimated financial assistance in both the FFEL and Direct Loan Program. The terms and conditions\
    \ applicable to Parent PLUS Loans apply to Graduate/Professional PLUS loans."
