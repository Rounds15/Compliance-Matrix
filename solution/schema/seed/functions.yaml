    the IRS and furnish statements to employees.
  reporting: Forms 1095-C furnished to employees; 1094-C transmittal filed with the IRS.
  deadlineNarrative: Employee statements by March 2; IRS e-filing by March 31.
  resourceLabel: Benefits Administration
  resourceUrl: https://policies.syr.edu
  risk: High
- code: CF-2011
  name: ERISA Form 5500 Filing
  topic: Human Resources
  area: Benefits
  statute: Employee Retirement Income Security Act
  citation: 29 U.S.C. § 1023
  statuteUrl: https://www.dol.gov/agencies/ebsa
  executiveOwner: awhitaker@syr.edu
  unitOwner: mhollis@syr.edu
  complianceOwner: mhollis@syr.edu
  description: Annual report of employee benefit plan financial condition, investments, and operations
    must be filed for each covered plan.
  reporting: Form 5500 with schedules and independent auditor's report filed via EFAST2.
  deadlineNarrative: Last day of the 7th month after plan year end; extension to October 15.
  resourceLabel: Retirement Plan Governance
  resourceUrl: https://policies.syr.edu
  risk: High
- code: CF-2012
  name: Form I-9 Employment Verification
  topic: Human Resources
  area: Employment Eligibility
