  name: Sex Discrimination in Admissions
  riskArea: T01
  domain: A002
  risk: null
  statute: Title IX of the Education Amendment of 1972
  citation: 20 U.S.C. § 1681; 34 C.F.R. Part 106
  statuteUrl: https://www.law.cornell.edu/uscode/text/20/1681
  description: "Prohibits discrimination on the basis of sex in the admission of education programs or\
    \ activities receiving federal financial assistance including employment.\n\n \tUnder the Title IX\
    \ common rule, a recipient may not discriminate against any person on the basis of sex in the counseling\
    \ or guidance of students or applicants for admission. Specifically, in appraising or counseling students,\
    \ a recipient must not use different testing or other materials on the basis of sex or use materials\
    \ that permit or require different treatment of students on the basis of sex. Such different materials\
    \ may be used, however, where they cover the same occupational interest areas and their use is shown\
    \ to be essential to eliminate sex bias.\n\n \tAny grievance records relating to a Title IX violation\
    \ or complaint must be retained for the period of time cited in state law for personal injury actions."
  reporting: null
  deadlineNarrative: null
  resourceLabel: Title IX - Syracuse University
  resourceUrl: https://www.syracuse.edu/title-ix/
