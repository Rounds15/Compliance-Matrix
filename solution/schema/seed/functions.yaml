    the completed Form I-9 for the required period.
  reporting: Internal I-9 audit sample reported to HR leadership annually.
  deadlineNarrative: Section 1 by first day of work; Section 2 within 3 business days.
  resourceLabel: Hiring Procedures
  resourceUrl: https://policies.syr.edu
  risk: Critical
- code: CF-2013
  name: FLSA Exemption Classification Review
  topic: Human Resources
  area: Wage and Hour
  statute: Fair Labor Standards Act
  citation: 29 CFR Part 541
  statuteUrl: https://www.dol.gov/agencies/whd/flsa
  executiveOwner: awhitaker@syr.edu
  unitOwner: dferrell@syr.edu
  complianceOwner: asundberg@syr.edu
  description: Positions must be reviewed against the duties and salary-basis tests to confirm exempt
    or non-exempt classification, and reclassified when thresholds change.
  reporting: Classification review summary to HR leadership and the CFO.
  deadlineNarrative: Annually, and upon any change to the federal salary threshold.
  resourceLabel: Compensation Policy
  resourceUrl: https://policies.syr.edu
  risk: High
- code: CF-2014
  name: FMLA Eligibility and Designation Notices
  topic: Human Resources
  area: Leave Administration
  statute: Family and Medical Leave Act
  citation: 29 CFR § 825.300
  statuteUrl: https://www.dol.gov/agencies/whd/fmla
  executiveOwner: awhitaker@syr.edu
  unitOwner: mhollis@syr.edu
  complianceOwner: mhollis@syr.edu
  description: >-
    Employers must provide eligibility, rights and responsibilities, and designation notices within five
    business days of a leave request or knowledge of a qualifying reason.
  reporting: Leave tracking log retained 3 years; no external filing.
  deadlineNarrative: Within 5 business days of each qualifying leave event.
  resourceLabel: Leave of Absence Policy
  resourceUrl: https://policies.syr.edu
  risk: Medium
- code: CF-2015
  name: EEO-1 Component 1 Data Filing
