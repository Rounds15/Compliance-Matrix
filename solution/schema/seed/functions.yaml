  riskArea: T07
  domain: A038
  risk: null
  statute: Nonqualified Deferred Inclusion
  citation: Nonqualified Deferred Inclusion
  statuteUrl: https://www.law.cornell.edu/uscode/text/26/409A
  description: >-
    If at any time during a taxable year a nonqualified deferred compensation plan (I) fails to meet the
    distribution, acceleration, and election requirements of 26 U.S.C. § 409A(a) paragraphs (2), (3),
    and (4), or (II) is not operated in accordance with such requirements, all compensation deferred under
    the plan for the taxable year and all preceding tax able years shall be includible in gross income
