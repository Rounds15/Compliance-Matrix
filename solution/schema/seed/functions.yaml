# su_compliancefunction - the core matrix record, one row per obligation.
# Owner fields hold directory emails; the importer resolves them to lookups.
# unitOwner is intentionally null on CF-9082 to exercise the unassigned
# unit-owner state that the Risk Dashboard reports as an exposure signal.

functions:
- code: CF-1041
  name: Clock-to-Credit Hour Conversion
  topic: Academic and Faculty Affairs
  area: Academic Programs
  statute: Higher Education Act
  citation: 34 CFR § 668.8 — Eligible program
  statuteUrl: https://www.ecfr.gov/current/title-34/section-668.8
  executiveOwner: lpagnew@syr.edu
  unitOwner: kmnieder@syr.edu
  complianceOwner: kmrupert@syr.edu
  description: >-
    For programs measured in clock hours and converted to credit hours for Title IV purposes, the institution
    must apply the federal conversion formula and document that the program meets minimum length and eligibility
    requirements.
  reporting: Conversion ratios must be documented and certified. State licensing approval required where
    applicable.
  deadlineNarrative: At program creation or modification. Recertified during PPA renewal.
  resourceLabel: Credit Hours Policy
  resourceUrl: https://policies.syr.edu
  risk: Medium
- code: CF-1042
  name: FERPA Annual Notification
  topic: Academic and Faculty Affairs
  area: Student Records
  statute: Family Educational Rights and Privacy Act
  citation: 34 CFR § 99.7
  statuteUrl: https://www.ecfr.gov/current/title-34/section-99.7
  executiveOwner: lpagnew@syr.edu
  unitOwner: kmnieder@syr.edu
  complianceOwner: amonroe@syr.edu
  description: >-
    Institutions must annually notify students of their rights under FERPA, including the right to inspect
    records, request amendment, and file a complaint with the Department of Education.
  reporting: Annual notice published to all enrolled students; directory information categories disclosed.
  deadlineNarrative: Annually, published before the start of the fall term.
  resourceLabel: Student Records Policy
  resourceUrl: https://policies.syr.edu
  risk: High
- code: CF-1043
  name: Middle States Periodic Review Report
  topic: Academic and Faculty Affairs
  area: Accreditation
  statute: MSCHE Standards for Accreditation
  citation: MSCHE Standard VII
  statuteUrl: https://www.msche.org
  executiveOwner: lpagnew@syr.edu
  unitOwner: kmnieder@syr.edu
  complianceOwner: kmrupert@syr.edu
  description: >-
    The university must submit periodic self-study and review documentation demonstrating continued compliance
    with the Commission's standards and requirements of affiliation.
  reporting: Periodic Review Report submitted to MSCHE with supporting evidence inventory.
  deadlineNarrative: Every 8 years, with a mid-point peer review at year 4.
  resourceLabel: Accreditation Overview
  resourceUrl: https://policies.syr.edu
  risk: Critical
- code: CF-1044
  name: Faculty Credentialing Documentation
  topic: Academic and Faculty Affairs
  area: Faculty Affairs
  statute: MSCHE Standards for Accreditation
  citation: MSCHE Standard III.2
  statuteUrl: https://www.msche.org
  executiveOwner: lpagnew@syr.edu
  unitOwner: kmnieder@syr.edu
  complianceOwner: kmrupert@syr.edu
  description: Official transcripts and credential verification must be on file for all instructors of
    record prior to the start of instruction.
  reporting: Credential file audit reported to the Provost each term.
  deadlineNarrative: Each term, before the start of instruction.
  resourceLabel: Faculty Manual
  resourceUrl: https://policies.syr.edu
  risk: Medium
- code: CF-1045
  name: State Authorization for Distance Education
  topic: Academic and Faculty Affairs
  area: Distance Education
  statute: Higher Education Act
  citation: 34 CFR § 600.9(c)
  statuteUrl: https://www.ecfr.gov/current/title-34/section-600.9
  executiveOwner: lpagnew@syr.edu
  unitOwner: kmnieder@syr.edu
  complianceOwner: kmrupert@syr.edu
  description: >-
    The institution must be authorized, or exempt from authorization, in every state where it enrolls
    distance-education students, and must disclose that status to students.
  reporting: SARA annual renewal and enrollment reporting by state.
  deadlineNarrative: Annually, SARA renewal each spring.
  resourceLabel: Distance Education Authorization
  resourceUrl: https://policies.syr.edu
  risk: High
- code: CF-2010
  name: ACA Employer Reporting (Forms 1094-C / 1095-C)
  topic: Human Resources
  area: Benefits
  statute: Affordable Care Act
  citation: 26 U.S.C. § 6056
  statuteUrl: https://www.irs.gov/affordable-care-act
  executiveOwner: awhitaker@syr.edu
  unitOwner: mhollis@syr.edu
  complianceOwner: asundberg@syr.edu
