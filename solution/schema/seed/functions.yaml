  statute: Title IX of the Education Amendment of 1972
  citation: 20 U.S.C. § 1681; 34 C.F.R. Part 106
  statuteUrl: https://www.law.cornell.edu/uscode/text/20/1681
  description: "When a recipient provides financial assistance to any student participating in an educational\
    \ program or activity, the recipient must ensure that it does not provide different types or amounts\
    \ of assistance, limit eligibility for such assistance, apply different criteria, or otherwise discriminate\
    \ in the provision of financial assistance on the basis of sex. A recipient may not assist through\
    \ solicitation, listing, approval, or provision of facilities or other services any organization or\
    \ person which provides assistance to recipient's students differently on the basis of sex. A recipient\
    \ may not apply any rule concerning eligibility of assistance which treats persons of one sex differently\
    \ from the other sex with regard to marital or parental status.\n\n \tAny grievance records relating\
    \ to a Title IX violation or complaint must be retained for the period of time cited in state law\
    \ for personal injury actions."
