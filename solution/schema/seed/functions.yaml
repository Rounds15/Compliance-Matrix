  riskArea: T01
  domain: A007
  risk: null
  statute: Higher Education Act
  citation: 20 U.S. Code § 1092 - Institutional and financial assistance information for students
  statuteUrl: https://www.law.cornell.edu/uscode/text/20/1092
  description: "Each institution participating in a preferred lender agreement on its website and in all\
    \ informational materials must disclose maximum amount of federal grant and loan aid available to\
    \ students under Title IV, the information identified on the Department of Education's model disclosure,\
    \ and a statement that each institution is required to process the documents required to obtain a\
    \ loan from any eligible lender the student selects.\n\n \tThe university may maintain a preferred\
    \ vendor list so long as it is not used to deny or impede a borrower's choice of lenders, offers three\
    \ or more lenders not affiliated with one another, and doesn't include lenders who have offered financial\
    \ or other benefits to be included on the list.\n\n \tThe university must disclose to borrowers the\
    \ method and criteria used to select preferred lenders, and offer comparative information to borrowers\
    \ about each lender's benefits.\n\n \tThe university must include in its preferred lender materials\
    \ a prominent statement that borrowers are not required to use any lender on the list, and may not\
    \ delay award certification because a preferred lender is not used.\n\n \tThe preferred lender list\
    \ and associated information must be updated annually."
  reporting: Preferred lender arrangements must be disclosed to students and parents. No periodic external
    filing.
