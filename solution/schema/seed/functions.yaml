- code: '3'
  name: Clock-to-Credit Hour Conversion
  riskArea: T01
  domain: A001
  risk: null
  statute: Higher Education Act
  citation: 34 CFR § 668.8 - Eligible program
  statuteUrl: https://www.law.cornell.edu/cfr/text/34/668.8
  description: >-
    For programs measured in clock hours that are converted to credit hours for Title IV purposes, institutions
    must follow the federal conversion formula. Institutions offering non-standard term or non-credit
    programs that receive Title IV aid must document that their credit hours are equivalent to federally-defined
    clock hours. Miscalculation is a common audit finding that can result in overborrowing and required
    returns.
  reporting: >-
    Clock-to-credit hour conversion ratios must be documented and certified. State licensing body approval
    of conversions required where applicable. Reviewed during program approval and recertification.
  deadlineNarrative: At program creation or modification. Recertified during PPA renewal.
  resourceLabel: Credit Hours Policy
  resourceUrl: https://policies.syr.edu/policies/faculty-teaching-and-research/classclassroom-scheduling-and-contact-hours-policy/
