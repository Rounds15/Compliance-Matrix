  risk: null
  statute: Higher Education Act
  citation: 34 CFR § 668.34 - Satisfactory academic progress.
  statuteUrl: https://www.law.cornell.edu/cfr/text/34/668.34
  description: >-
    Institutions must establish and apply reasonable standards of satisfactory academic progress (SAP)
    for students receiving Title IV aid. SAP policies must include qualitative standards (minimum GPA),
    quantitative standards (pace of completion — at least 67% of attempted credits), and a maximum timeframe
    (150% of normal program length). Students who fail to meet SAP must be placed on financial aid warning
    or suspension and may appeal through a defined process.
  reporting: >-
