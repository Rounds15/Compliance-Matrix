  risk: null
  statute: Higher Education Act
  citation: § 668.24 Record retention and examinations.
  statuteUrl: https://www.ecfr.gov/current/title-34/section-668.24
  description: "The university must maintain any application for Title IV, HEA program funds and program\
    \ records that document: 1) Its eligibility to participate and eligibility of its programs to receive\
    \ funds; 2) its administration of the HEA programs per applicable requirements; 3) its financial responsibility;\
    \ 4) information included in any application for program funds; and 5) its disbursement and delivery\
    \ of program funds.\n\n \tThe university must maintain the following financial information: 1) The\
    \ Student Aid Report (SAR) or Institutional Student Information Record (ISIR); 2) application data\
    \ submitted on behalf of the student or parent; 3) documentation of each student's or parent borrower's\
    \ eligibility for and receipt of program funds and loan detail; 4) documentation of and information\
    \ collected at initial or exit loan counseling; 5) reports and forms used by the University in participating\
    \ in an HEA program, and any records needed to verify data in those reports and forms; and 6) documentation\
    \ supporting calculations of the University's completion or graduation rates.\n\n \tThe university\
    \ must keep records relating to administration of the Federal Perkins Loan, FWS, FSEOG, or Federal\
    \ Pell Grant Program for three years after the end of the award year for which the aid was awarded\
    \ and disbursed.\n\n \tThe university must keep records relating to a student or parent borrower's\
    \ eligibility and participation in the FFEL or Direct Loan Program for three years after the end of\
    \ the award year in which the student last attended the institution. All other records relating to\
    \ the University's participation in the FFEL or Direct Loan Program must be kept for three years after\
    \ the end of the award year in which the records are submitted. Records pertaining to any loan, claim,\
    \ or expenditure questioned by a program audit, review, or investigation must be kept until resolution\
    \ or the end of the applicable retention period, whichever is later."
