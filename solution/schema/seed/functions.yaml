  citation: Teacher Preparation Policies and Issues in the  Higher Education Act
  statuteUrl: https://www.law.cornell.edu/uscode/text/20/chapter-28/subchapter-II/part-A
  description: "Provides that an institution with a teacher preparation program must report, among other\
    \ things: (1) whether it satisfied its annual goal for increasing the number of teachers in areas\
    \ of shortage; (2) the steps the institution is taking to improve its performance on these goals;\
    \ (3) program information, including admissions criteria and information related to supervised clinical\
    \ experience; (4) pass rates, including the percentage of students who have finished all nonclinical\
    \ coursework and passed the state teacher licensing exam, the average score for all students who took\
    \ the state teacher licensing exam, and a comparison between the pass rates of the institution and\
    \ the state; (7) a statement on the program's accreditation approval; (8) whether the program has\
    \ been designated low-performing by the state; (9) a description of the activities undertaken to assist\
    \ teachers with integrating technology into curricula and instruction; and (10) a description of the\
    \ activities undertaken to prepare teachers to teach students with disabilities effectively.\n\n \t\
    On an annual basis, the institution must report on the quality of teacher preparation and other information\
    \ using the institutional report card prescribed by the Department of Education. The report card must\
    \ also be posted on the institution's web site."
