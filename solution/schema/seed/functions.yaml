    misuse of Title IV funds, or failure to maintain institutional eligibility.
  reporting: No deadline for disclosures to enrolled students is set, but September 1 is suggested.
  deadlineNarrative: September 1 annually (no deadline mandated; suggested)
  resourceLabel: Consumer Information - Syracuse University
  resourceUrl: https://www.syracuse.edu/consumer-information/
  executiveOwner: lpagnew@syr.edu
  unitOwner: jmhasenw@syr.edu
  complianceOwner: null
