  name: Lead Hazard Reduction
  riskArea: T12
  domain: A056
  risk: null
  statute: Residential Lead-Based Paint Hazard Reduction Act of 1992
  citation: 42 U.S.C. § 4851; 24 C.F.R. Part 35
  statuteUrl: https://www.law.cornell.edu/uscode/text/42/chapter-63A
  description: "Regulations apply to owners of more than four residential housing units built before 1978.\n\
    \n\nBefore ratification of a contract for housing sale or lease, sellers and landlords must:\n\n \t\
    <li style=\"list-style-type: none\">\n\n \tGive an EPA-approved information pamphlet on identifying\
    \ and controlling lead-based paint hazards (\"Protect Your Family From Lead In Your Home\" pamphlet).\n\
    \n \tDisclose any known information concerning lead-based paint or lead-based paint hazards. The seller\
    \ or landlord must also disclose information such as the location of the lead-based paint and/or lead-based\
    \ paint hazards, and the condition of the painted surfaces.\n\n \tProvide any records and reports\
    \ on lead-based paint and/or lead-based paint hazards which are available to the seller or landlord\
    \ (for multi-unit buildings, this requirement includes records and reports concerning common areas\
    \ and other units, when such information was obtained as a result of a building-wide evaluation).\n\
    \n \tInclude an attachment to the contractor lease (or insert language in the lease itself) which\
    \ includes a Lead Warning Statement and confirms that the seller or landlord has complied with all\
    \ notification requirements. This attachment is to be provided in the same language used in the rest\
    \ of the contract. Sellers or landlords, and agents, as well as homebuyers or tenants, must sign and\
    \ date the attachment.\n\n \tSellers must provide homebuyers a 10-day period to conduct a paint inspection\
    \ or risk assessment for lead-based paint or lead-based paint hazards. Parties may mutually agree,\
    \ in writing, to lengthen or shorten the time period for inspection. Homebuyers may waive this inspection\
    \ opportunity.\n\n \tSellers and lessors must retain a copy of the disclosures for no less than three\
    \ years from the date of sale or the date the leasing period begins."
  reporting: >-
    Prior to lease execution and annually thereafter, the University must provide a disclosure notice
    to lessees of residential structures built before 1978, disclosing known lead paint hazards and providing
    EPA pamphlet.
  deadlineNarrative: Prior to lease signing and annually at lease renewal
  resourceLabel: Lead Paint Management - EHSS
  resourceUrl: https://ehss.syr.edu/construction-support/lead-paint/
  executiveOwner: padgett@syr.edu
  unitOwner: jphernon@syr.edu
  complianceOwner: cafabriz@syr.edu
