- code: '44'
  name: Federal Work Study
  riskArea: T01
  domain: A007
  risk: null
  statute: Higher Education Act
  citation: 38 U.S. Code § 3485 - Work-study allowance
  statuteUrl: https://www.gpo.gov/fdsys/pkg/PLAW-110publ315/pdf/PLAW-110publ315.pdf
  description: "Generally, under the Federal Work Study Program (FWS), the university or the employing\
    \ agency must pay 25% of the student's salary. The university must pay federal or state minimum wage,\
    \ whichever is higher, for all hours worked, per the Fair Labor Standards Act. Volunteered time does\
    \ not qualify. An institution must make employment under FWS reasonably available, to the extent of\
    \ available funds, to all eligible students.\n\n \tThe university must use 7% of FWS allocation to\
    \ employ students in community service, one of whom must be a reading tutor or part of a family literacy\
    \ project. The university must make students aware of community service opportunities.\n\n \tPrivate,\
    \ for-profit entities do not qualify as employers for community service, but institutions may use\
    \ up to 25% of FWS allocation to pay the compensation of FWS students employed by private for-profit\
    \ organizations generally. Students may work during non-attendance if planning to return the following\
    \ semester, but if they do not do so the university must demonstrate it had reason to believe the\
    \ student would returned.\n\n \tTo apply for Title III or Title V designation, and thus be eligible\
    \ for a waiver of the FWS and Federal Supplemental Education Opportunity Grant (FSEOG) non-federal\
    \ share requirements, an institution must complete the \"Application for Designation as an Eligible\
    \ Institution\" annually through the Department of Education."
  reporting: |-
    Fiscal Operations Report and Application to Participate (FISAP) reports cover the institution’s fiscal operations and request for future funding for Title IV Federal campus-based funds (SEOG, Perkins Loans, Work-study, and Federal Pell Grants. Due by September 30 each year.

    The University must reconcile reported student earnings to complete Department of Education Fiscal Operations Report (Form 646-1) at the end of the academic year.
