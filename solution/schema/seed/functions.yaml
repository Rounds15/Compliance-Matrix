  unitOwner: dferrell@syr.edu
  complianceOwner: dferrell@syr.edu
  description: Employers with 100 or more employees must submit demographic workforce data by job category,
    race, ethnicity, and sex.
  reporting: EEO-1 Component 1 report filed through the EEOC collection portal.
  deadlineNarrative: Annually, filing window typically opens in the spring.
  resourceLabel: Equal Opportunity Statement
  resourceUrl: https://policies.syr.edu
  risk: Medium
- code: CF-2016
  name: OSHA Form 300A Posting
  topic: Human Resources
  area: Workplace Safety
  statute: Occupational Safety and Health Act
  citation: 29 CFR § 1904.32
  statuteUrl: https://www.osha.gov/recordkeeping
  executiveOwner: awhitaker@syr.edu
  unitOwner: pnovak@syr.edu
  complianceOwner: pnovak@syr.edu
  description: The annual summary of work-related injuries and illnesses must be certified by a company
    executive and posted in a conspicuous location.
  reporting: Form 300A posted February 1 through April 30 and retained 5 years.
  deadlineNarrative: Post by February 1 each year.
  resourceLabel: Workplace Safety Program
  resourceUrl: https://policies.syr.edu
