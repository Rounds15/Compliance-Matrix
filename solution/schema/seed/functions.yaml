- code: '46'
  name: Financial Aid Counseling (Entrance and Exit)
  riskArea: T01
  domain: A007
  risk: null
  statute: Higher Education Act
  citation: 34 CFR § 682.604 - Required exit counseling for borrowers
  statuteUrl: https://www.law.cornell.edu/cfr/text/34/682.604
  description: "Under 20 U.S. Code § 1092(b), institutions must provide exit counseling to federal student\
    \ loan borrowers (excluding certain loan types) before they complete or leave their program. The counseling\
    \ must cover repayment options, debt management, loan forgiveness, deferment and forbearance, consequences\
    \ of default, consolidation effects, tax benefits, and how to use the National Student Loan Data System.\
    \ It must also warn about third-party debt relief scams. Schools must collect updated borrower contact\
    \ and employment information during the session and send any updates to the guaranty agency within\
    \ 60 days. Electronic delivery of personalized counseling is permitted, and schools must attempt to\
    \ provide written counseling to students who leave without notice.\n\n \tRequires institutions to\
    \ provide comprehensive information on the terms and conditions of loans and borrowers' responsibilities\
    \ prior to loan disbursement to a first-time borrower. Information shall be provided in simple and\
    \ understandable terms and may be provided: during an entrance counseling session conducted in person;\
    \ on a separate written form provided to the borrower that the borrower signs and returns to the institution\
    \ of higher education; or, online, with the borrower acknowledging receipt of the information. It\
    \ must include information on interest accrual, repayment obligations, use of the master promissory\
    \ note, the impact on other financial aid, and maintaining half-time enrollment. Borrowers must also\
    \ be informed about repayment options, loan default consequences, and their right to pay interest\
    \ while in school. Institutions must provide sample repayment amounts, access details for the National\
    \ Student Loan Data System, and a contact for further questions. Institutions of higher education\
    \ are encouraged to provide entrance counseling through interactive programs that test borrowers'\
    \ understanding of the terms and conditions of their loans."
  reporting: No deadline is set, but September 1 is suggested.
  deadlineNarrative: September 1 annually (no deadline mandated; suggested)
  resourceLabel: Loan Exit Counseling
  resourceUrl: https://financialaid.syr.edu/typesofaid/loans/exitcounseling/
