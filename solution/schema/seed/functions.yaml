  statute: Higher Education Act
  citation: 34 CFR § 668.14 - Program participation agreement
  statuteUrl: https://www.law.cornell.edu/cfr/text/34/668.14
  description: "An institution must enter into a written program participation agreement with the Department\
    \ of Education in order to participate in any Title IV, HEA program (other than the LEAP and NEISP\
    \ programs).\n\n \tThe written program participation agreement requires that the university, among\
    \ other things: (1) Maintain administrative and fiscal procedures for proper and efficient administration\
    \ of program funds; (2) demonstrate financial responsibility and administrative capability; (3) make\
    \ voter registration forms widely available to enrolled students at the institution (either by email\
    \ or regular email); (4) in the case of an institution that advertises job placement rates to attract\
    \ students, make available to prospective students the most recent available employment statistics\
    \ and state licensing requirements, (5) in the case of an institution participating in the FFEL or\
    \ Direct Loan programs, inform all eligible borrowers enrolled in the institution about the availability\
    \ and eligibility of such borrowers for state grant assistance from the state in which the institution\
    \ is located, and will inform such borrowers from another state of the source for further information\
    \ concerning such assistance from that state, and (6) certify that it has a drug abuse prevention\
    \ program available to everyone, a published financial aid code of conduct for employees, a published\
    \ financial aid code of conduct for employees, a campus security policy, and that it is in compliance\
    \ with athletic program participation rate and financial support data disclosures.\n\n \tUnder the\
    \ written program participation agreement the university is prohibited from engaging in the following\
    \ activities: (1) Charging students fees for processing program eligibility applications, forms or\
    \ data; (2) knowingly employing or contracting with individuals or entities in any capacity involving\
    \ administration of HEA programs if they have been found to have committed fraud or other violations\
    \ involving federal/state/local funds; (3) penalizing or denying students access because of inability\
    \ to meet financial obligations resulting from delays in disbursement due to program compliance requirements\
    \ or institutional delays; and (4) providing a commission/bonus to any person or entity engaged in\
    \ any student recruiting, admission activities, or award decision-making based on success in securing\
    \ enrollments or financial aid.\n\n \tUse of a third party servicer does not relieve the university\
    \ of the compliance requirements under this part."
  reporting: |-
    The institution must publish and make readily available to current and prospective students information on the entire federal, state, local, private, and institutional financial assistance programs available to students who enroll at the institution. Institutional information must also be made available as well. Although no deadline is specifically enumerated, September 1st is suggested.

    The institution should request the voter registration forms from the state at least 120 days before the deadline to register to vote.

    Employment statistics and state licensing requirements, if required, must be provided to prospective students at or before the time they apply.
  deadlineNarrative: Ongoing; no specific annual deadline
  resourceLabel: Consumer Information
  resourceUrl: https://www.syracuse.edu/consumer-information/
  executiveOwner: rcwill05@syr.edu
  unitOwner: null
  complianceOwner: mbsipley@syr.edu
