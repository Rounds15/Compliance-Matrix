  citation: 41 U.S.C. §§ 8101–8106; 2 C.F.R. Part 182
  statuteUrl: https://www.gpo.gov/fdsys/pkg/USCODE-2009-title41/pdf/USCODE-2009-title41-chap10.pdf
  description: "A federal contractor receiving $25,000 or more in funding must: 1) Certify it provides\
    \ a drug-free workplace; 2) publish a statement notifying employees that unlawful manufacture, distribution,\
    \ dispensing, possession, use of controlled substances is prohibited and stating what action will\
    \ be taken for violations; 3) establish an ongoing drug-free awareness program; 4) require that each\
    \ employee directly involved in the contract/grant work notify the employer of any criminal drug statute\
    \ convictions for a violation occurring in the workplace (however, drug testing is not mandated or\
    \ authorized); 5) notify the federal government of such a violation within ten days after learning\
    \ of conviction; and 6) require sanctions or remedial measures for an employee convicted of a drug\
    \ abuse violation in the workplace.\n\n \tFailure to comply can lead to being barred from participation\
    \ in future contract or grant activity for up to five (5) years."
  reporting: Annual distribution of drug-free workplace policy to all employees required. No external
    filing; compliance certified in federal award applications.
  deadlineNarrative: Annual distribution to employees; certified in federal grant applications as applicable
  resourceLabel: Employee Anti-Drug and Alcohol Abuse Policy
