  statute: Industrial Alcohol User Permits and Special Tax
  citation: Industrial Alcohol User Permits and Special Tax
  statuteUrl: https://www.law.cornell.edu/uscode/text/26/subtitle-E/chapter-51
  description: "Institutions that procure, use, sell, and/or recover denatured distilled spirits for industrial\
    \ purposes are required to obtain a permit from the ATF and pay an occupational tax of $250 per year.\n\
    \n \tHowever, a scientific university, college of learning, or institution of scientific research\
    \ which holds a permit to procure and use specially denatured spirits is exempt from payment of the\
    \ tax if: (i) The institution procures less than 25 gallons of specially denatured spirits per calendar\
    \ year; and (ii) such spirits are procured for use exclusively for experimental or research use and\
    \ not for consumption or sale."
