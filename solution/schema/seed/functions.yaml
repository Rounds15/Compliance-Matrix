- code: '15'
  name: Net Price Calculator
  riskArea: T01
  domain: A003
  risk: null
  statute: Higher Education Act
  citation: 20 U.S. Code § 1015a - Transparency in college tuition for consumers
  statuteUrl: https://www.law.cornell.edu/uscode/text/20/1015a
  description: "Any institution that receives Title IV funds must post on the institution's website a\
    \ net price calculator to help current and prospective students estimate their individual net price\
    \ at that institution as well as other financial aid information. Such calculator may be developed\
    \ by the Department or the institution if it meets, at a minimum, the same data elements as the Department's. Estimates\
    \ of Net Price must have a clear and conspicuous notice stating that the estimate (i) does not represent\
    \ a financial determination, or actual award, of financial assistance; (ii) is not binding on the\
    \ Secretary, the institution, or the State; and (iii) may change. The notice must also state that\
    \ the student must complete a FASFA in order to be eligible for, and receive an actual award. Lastly,\
    \ the notice must include a link to FAFSA.\n\n \t<li style=\"list-style-type: none;\">\n\n \tAny institution\
    \ that appears on the Department of Education's list of institutions with the largest percentage increase\
    \ in tuition and fees or net price over the most recent three academic years must submit a report\
    \ to the Department that includes the reason for the increase and the steps that will be taken to\
    \ reduce cost."
  reporting: Net price calculator must be posted on institution website. No periodic external filing;
    Dept of Education may audit compliance.
  deadlineNarrative: null
  resourceLabel: Net Price Calculator - Syracuse University
  resourceUrl: https://www.syracuse.edu/admissions-aid/tuition-fees/undergraduate-costs/net-price-calculator/
  executiveOwner: rcwill05@syr.edu
  unitOwner: mbsipley@syr.edu
  complianceOwner: null
