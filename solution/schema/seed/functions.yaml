  citation: 45 C.F.R. Part 46
  statuteUrl: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-A/part-46
  description: "Institutions must provide a written assurance application that they will comply with the\
    \ Common Rule requirements. These requirements include written procedures for reporting to the institutional\
    \ review board (IRB), institutional officials, and the department or agency head of unanticipated\
    \ problems involving risks to subjects or serious or continuing non-compliance, and any suspension\
    \ or termination of research.\n\n \tHuman subjects research must undergo review and be approved by\
    \ the designated IRB.\n\n \tWith certain exceptions, investigators must obtain informed consent from\
    \ any subject used for human subjects research. (Certain requirements regarding information that must\
    \ be given to prospective subjects as part of the informed consent process take effect January 19,\
    \ 2018.)\n\n \tEffective January 19, 2020, U.S.-based institutions engaged in cooperative research\
    \ must use a single IRB for that portion of the research that takes place within the U.S., with certain\
    \ exceptions."
  reporting: >-
    Federally funded human subjects research must be reviewed and approved by the IRB. Adverse events,
