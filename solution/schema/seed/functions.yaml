    \ requirements with respect to the regulations pertaining to human subjects and IRB review and approval.\n\
    \n \tThe regulation includes medical devices for human use as well as drugs. (Applies to federally-funded\
    \ projects). Sponsors of certain clinical trials of drugs/devices regulated by the FDA must obtain\
