  resourceUrl: https://finance.syr.edu/comptroller/resources/payments-to-or-from-syracuse-university/payments-to-individuals/
  executiveOwner: padgett@syr.edu
  unitOwner: kmflanne@syr.edu
  complianceOwner: null
