  citation: 34 CFR § 601.21 - Code of conduct
  statuteUrl: https://www.law.cornell.edu/cfr/text/34/601.21
  description: >-
    An institution that participates in Title IV programs must have a code of conduct for financial aid
    practices that prohibits conflicts of interest with respect to such loans, is published prominently
    on the university's website, and annually inform personnel with responsibilities with respect to loans
    made of the provisions of the code. Such code must prohibit the following: revenue-sharing arrangements
