  topic: Safety and Security
  area: Emergency Management
  statute: Jeanne Clery Act
  citation: 34 CFR § 668.46(g)
  statuteUrl: https://www.ecfr.gov/current/title-34/section-668.46
  executiveOwner: mdelgado@syr.edu
  unitOwner: cruiz@syr.edu
  complianceOwner: cruiz@syr.edu
  description: >-
    The institution must test emergency response and evacuation procedures at least annually and publicize
    its procedures in conjunction with at least one test per year.
  reporting: Test date, description, and whether announced or unannounced documented in the ASR.
  deadlineNarrative: At least annually; documented each test.
  resourceLabel: Emergency Management Plan
  resourceUrl: https://policies.syr.edu
