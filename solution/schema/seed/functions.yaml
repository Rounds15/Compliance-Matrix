- code: '138'
  name: 1099 Reporting and Classification
  riskArea: T05
  domain: A027
  risk: null
  statute: Independent Contractors
  citation: Independent Contractors
  statuteUrl: https://www.law.cornell.edu/uscode/text/26/6041
  description: "If an employee is mistakenly classified as an independent contractor and the employer\
    \ has no reasonable basis for doing so, the employer may be held liable for employment taxes for that\
    \ worker.\n\n \tIn order to qualify as independent contractors, the individual would need to meet\
    \ the Internal Revenue Service (IRS) requirements. The IRS regulatory definition of employee\" is\
    \ set forth in 26 C.F.R. § 31.3401 (c) -1(b).\n\n \tThe Fair Labor Standards Act utilizes a totality-of-the-circumstances\
    \ analysis of the economic reality test in which the factors do not have a predetermined weight and\
    \ are considered in view of the economic reality of the whole activity. There are six non-exclusive\
    \ factors to be considered: (1) the opportunity for profit or loss depending on managerial skill,\
    \ (2) investments by the worker and the potential employer, (3) the degree of permanence of the work\
    \ relationships, (4) the nature and degree of the employer’s control, (5) the extent to which the\
    \ work performed is an integral part of the employer’s business, and (6) the extent and nature of\
    \ the worker’s skill and initiative."
  reporting: |-
    Form 1099-MISC must be filed with the IRS if the employer makes payments to independent contractors in the amount of $600 or more during the year.

    A copy of same must be provided to the independent contractor by January 31 of the following year.
  deadlineNarrative: January 31 (Form 1099-NEC to contractors); February 28 (paper to IRS) or March 31
    (electronic to IRS)
