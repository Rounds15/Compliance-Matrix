  statuteUrl: https://www.dol.gov/oasam/regs/statutes/sec504.htm
  description: "Prohibits discrimination on the basis of disability at any federally-funded institution.\
    \ This covers admissions, recruitment, educational and/or academic programs and services.\n\n \tA\
    \ recipient that provides housing to its able-bodied students shall provide comparable, convenient,\
    \ and accessible housing to students with disabilities at the same cost as to others.\n\n \tIf an\
    \ existing facility is not accessible, redesign of equipment, reassignment of classes or other services\
    \ to accessible buildings is an alternative to new construction.\n\n \tNewly constructed facilities\
    \ must be readily accessible to persons with disabilities.\n\n \tEach facility or part of a facility\
    \ which is altered in a manner that affects or could affect the usability of the facility or part\
    \ of the facility shall, to the maximum extent feasible, be altered in such manner that the altered\
    \ portion of the facility is readily accessible to and usable by persons with disabilities."
