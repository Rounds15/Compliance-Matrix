  citation: Student Exchange and Visitor Information System (SEVIS)
  statuteUrl: https://www.ice.gov/sevis
  description: "The Student and Exchange Visitor Program (SEVP) acts as the bridge for various government\
    \ organizations that have an interest in information on foreign students.\n\n \tSEVIS was created\
    \ to improve data collection and reporting, enhance customer service, facilitate compliance with regulations\
    \ and help Immigration and Customs Enforcement (ICE) better monitor schools and exchange programs,\
    \ as well as F, M and J non-immigrants.\n\n \tVia SEVIS, the University must keep information and\
    \ records relating to each F-1 or M-1 student to whom it has issued a Form I-20A or I-20M."
  reporting: |-
    All J-1 sponsors must submit an annual report generated from SEVIS and a narrative report. Sponsors must submit an annual report to the Department of State. The report must be filed on an academic, calendar, or fiscal year basis, as stipulated on the program’s designation or re-designation letter. The due dates are:


    For Academic Year end designees (June 30th): report due to the Department of State July 31st.
    For Calendar Year end designees (December 31st): report due to the Department of State January 31st.
    For Fiscal Year end designees (September 30th): report due to Department of State October 31st.
  deadlineNarrative: July 31 (academic year end designees); January 31 (calendar year end); October 31
    (fiscal year end); ongoing SEVIS updates within required timeframes
