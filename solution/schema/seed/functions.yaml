- code: '192'
  name: Employer Shared Responsibility (Employer Mandate)
  riskArea: T07
  domain: A032
  risk: null
  statute: Patient Protection and Affordable Care Act
  citation: 26 U.S.C. § 4980H; 29 C.F.R. Part 2590
  statuteUrl: https://www.gpo.gov/fdsys/pkg/PLAW-111publ148/pdf/PLAW-111publ148.pdf
  description: "Beginning in 2015, under IRC 4980H applicable large employers (generally those with 50\
    \ or more employees) must pay a tax penalty if\n\n\n(1) they do not offer health insurance coverage\
    \ to substantially all of their full-time employees or\n(2) the coverage they do offer is not affordable\
    \ or does not provide a certain minimum level of benefits.\n\n \tA full-time employee under the employer\
    \ mandate is defined as a common law employee who is employed an average of at least 30 hours per\
    \ week.\n\n \tThe final regulations offer some specific guidance to higher education institutions\
    \ with respect to counting the hours worked by certain adjunct faculty and student workers."
  reporting: |-
    By July 31 of each year between 2013 and 2019 (for plan years ending on or after 10/1/12 and before 10/1/19), the University must file IRS Form 720 and pay applicable PCOR (Patient Centered Outcome Research Institute) fees for any covered self-insured plans, at the applicable rate ($1.00 per covered life for 2012, $2.00 for 2013, adjusted for health inflation thereafter).

    Section 6055 requires an applicable large employer to report to the IRS with respect to the minimum essential coverage it provides to an individual during a calendar year.

    Section 6056 requires an applicable large employer to file a return with the IRS that reports, for each employee who was a full-time employee for one or more months during the calendar year, certain information about the health care coverage the employer offered to that employee.

    Sections 6055 and 6056 also require applicable large employers to furnish, by January 31 of the calendar year following the calendar year for which the return must be filed, related statements to responsible individuals (Section 6055) and to full-time employees (Section 6056).

    (Note: The reporting rules take effect January 1, 2015, with the first returns filed under Section 6055 and 6056 due in early 2016.)
  deadlineNarrative: January 31 (Form 1095-C to employees); February 28 (paper to IRS) or March 31 (electronic
    to IRS)
  resourceLabel: Student Health Insurance Policy
  resourceUrl: https://policies.syr.edu/policies/academic-rules-student-responsibilities-and-services/student-health-insurance-requirement-policy/
  executiveOwner: aadietri@syr.edu
  unitOwner: desovoco@syr.edu
  complianceOwner: sazria@syr.edu
