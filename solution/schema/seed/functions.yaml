- code: '7'
  name: Readmission Requirements for Servicemembers
  riskArea: T01
  domain: A002
  risk: null
  statute: Higher Education Act
  citation: 20 U.S. Code § 1091c - Readmission requirements for servicemembers
  statuteUrl: https://www.law.cornell.edu/uscode/text/20/1091c
  description: >-
    Requires that the University readmit students who left in order to join the military. The student
    must be readmitted in the same academic status. Generally, the length of absence cannot be greater
    than five (5) years. Exceptions to this law include those veterans receiving a dishonorable discharge
    or bad conduct charge, those who were court marshaled, and those who the University is reasonably
    unable to prepare to resume or complete their program.
  reporting: >-
    Institutions must readmit servicemembers who leave due to military service and provide them with the
    same financial aid they had before departure. No periodic external filing; process documented internally.
  deadlineNarrative: null
  resourceLabel: Readmission - Student Experience
  resourceUrl: https://experience.syracuse.edu/student-outreach/student-support/readmission/
