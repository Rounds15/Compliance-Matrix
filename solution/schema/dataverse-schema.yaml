# =============================================================================
# Syracuse University Compliance Matrix - Dataverse schema (reconciled)
# =============================================================================
# Reconciled from the Claude Code generation (structure + tooling) and the
# ten-table model validated against the live SharePoint exports (data + names).
# Changes from the prototype-derived schema, all deliberate:
#   - Topic renamed to Risk Area; Area promoted from free text to a Domain table
#   - Assessment and AssessmentOwner added (Gaps link to an Assessment)
#   - Choice sets aligned to the real data (Low/Moderate/High, Open/In Progress/
#     Closed, deadline types, assessment statuses)
#   - Risk Rating and the Risk Area / Domain lookups made non-required so the
#     real data (Risk Rating mostly empty; one function missing its grouping)
#     imports without row failures
# =============================================================================
publisher:
  name: syracuseuniversity
  displayName: Syracuse University
  prefix: su
  optionValuePrefix: 10000
solution:
  uniqueName: ComplianceMatrix
  displayName: Compliance Matrix
  version: 1.0.0.0
  managed: false
  description: >-
    University-wide compliance obligation register. Maps every obligation the
    institution carries to its ownership chain, governing statute, reporting
    requirement, due dates, risk rating, and the assessments that surface gaps.

choices:
  su_risklevel:
    displayName: Risk Level
    description: Risk rating applied to functions, assessments, and gap severity.
    options:
      - { value: 100000001, label: High,     color: "#DC2626" }
      - { value: 100000002, label: Moderate, color: "#D97706" }
      - { value: 100000003, label: Low,      color: "#16A34A" }
  su_cadence:
    displayName: Cadence
    description: Recurrence pattern for a fixed-recurring compliance deadline.
    options:
      - { value: 100000010, label: Annually }
      - { value: 100000011, label: Semiannual }
      - { value: 100000012, label: Quarterly }
      - { value: 100000013, label: Monthly }
      - { value: 100000014, label: Biennial }
      - { value: 100000015, label: Ongoing }
      - { value: 100000016, label: One-time }
  su_deadlinetype:
    displayName: Deadline Type
    description: >-
      Discriminator. Only Fixed Recurring rows carry calendar fields and drive
      the reminder flow; Event-Relative rows carry a trigger and offset instead.
    options:
      - { value: 100000070, label: Fixed Recurring }
      - { value: 100000071, label: Event-Relative }
      - { value: 100000072, label: Ongoing }
      - { value: 100000073, label: Conditional }
  su_offsetunit:
    displayName: Offset Unit
    options:
      - { value: 100000080, label: Days }
      - { value: 100000081, label: Months }
  su_gapstatus:
    displayName: Gap Status
    options:
      - { value: 100000020, label: Open }
      - { value: 100000022, label: In Progress }
      - { value: 100000021, label: Closed }
  su_ownershiprole:
    displayName: Ownership Role
    description: >-
      The three tiers of the ownership chain: an executive owner accountable at
      cabinet level, a unit owner who runs it, a compliance owner who files it.
    options:
      - { value: 100000030, label: Executive Owner }
      - { value: 100000031, label: Unit Owner }
      - { value: 100000032, label: Compliance Owner }
  su_ownershipsubrole:
    displayName: Ownership Sub-role
    options:
      - { value: 100000040, label: Primary }
      - { value: 100000041, label: Advisory }
      - { value: 100000042, label: Support }
  su_flagstatus:
    displayName: Flag Status
    options:
      - { value: 100000050, label: Active }
      - { value: 100000051, label: Cleared }
  su_flagsource:
    displayName: Flag Source
    options:
      - { value: 100000110, label: Manual }
      - { value: 100000111, label: Survey }
  su_assessmentstatus:
    displayName: Assessment Status
    description: Normalized from the legacy free-text Progress field.
    options:
      - { value: 100000090, label: Drafting }
      - { value: 100000091, label: Report Complete }
      - { value: 100000092, label: Finalized }
      - { value: 100000093, label: Closed }
  su_assessmentownerrole:
    displayName: Assessment Owner Role
    options:
      - { value: 100000100, label: Compliance }
      - { value: 100000101, label: Executive }
  su_approle:
    displayName: Application Role
    options:
      - { value: 100000060, label: Administrator }
      - { value: 100000061, label: Compliance Owner }
      - { value: 100000062, label: Executive }

tables:

  su_riskarea:
    displayName: Risk Area
    displayCollectionName: Risk Areas
    description: >-
      The 13 top-level risk areas (ERM's term for what the prototype called
      topics). Drill into a risk area to see its domains, then the functions.
    primaryName: su_name
    ownership: OrganizationOwned
    hasActivities: false
    hasNotes: false
    columns:
      - { name: su_name, displayName: Risk Area, type: String, maxLength: 150, required: SystemRequired }
      - { name: su_riskareacode, displayName: Risk Area ID, type: String, maxLength: 20, alternateKey: true, description: "Legacy surrogate key for seed relationship resolution." }
      - { name: su_colorhex, displayName: Color Hex, type: String, maxLength: 9, description: "Brand color the app uses for this risk area." }
      - name: su_owner
        displayName: Risk Area Owner
        type: Lookup
        target: su_compliancedirectory
      - { name: su_functioncount, displayName: Published Function Count, type: Integer, minValue: 0, maxValue: 10000 }
      - { name: su_sortorder, displayName: Sort Order, type: Integer, minValue: 0, maxValue: 1000 }

  su_domain:
    displayName: Domain
    displayCollectionName: Domains
    description: >-
      The 61 sub-groupings, each under one risk area. Promoted from the
      prototype's free-text area because the values were drifting and leadership
      wants a coverage map broken out by domain.
    primaryName: su_name
    ownership: OrganizationOwned
    hasActivities: false
    hasNotes: false
    columns:
      - { name: su_name, displayName: Domain, type: String, maxLength: 200, required: SystemRequired }
      - { name: su_domaincode, displayName: Domain ID, type: String, maxLength: 30, alternateKey: true, description: "Legacy surrogate key for seed relationship resolution." }
      - name: su_riskarea
        displayName: Risk Area
        type: Lookup
        target: su_riskarea
        required: Recommended
        relationshipName: su_riskarea_su_domain
        cascade: { delete: RemoveLink }
      - name: su_owner
        displayName: Domain Owner
        type: Lookup
        target: su_compliancedirectory

  su_compliancedirectory:
    displayName: Compliance Directory
    displayCollectionName: Compliance Directory
    description: >-
      The people layer: every owner in an ownership chain, with title, unit, and
      contact info. May be created manually or linked to Entra ID.
    primaryName: su_name
    ownership: OrganizationOwned
    hasActivities: false
    hasNotes: false
    columns:
      - { name: su_name, displayName: Full Name, type: String, maxLength: 150, required: SystemRequired }
      - { name: su_jobtitle, displayName: Title, type: String, maxLength: 250 }
      - { name: su_unit, displayName: Unit, type: String, maxLength: 200 }
      - { name: su_email, displayName: Email, type: String, format: Email, maxLength: 150, alternateKey: true }
      - { name: su_phone, displayName: Phone, type: String, format: Phone, maxLength: 40 }
      - { name: su_location, displayName: Location, type: String, maxLength: 200 }
      - { name: su_netid, displayName: NetID, type: String, maxLength: 50 }
      - { name: su_active, displayName: Active, type: Boolean, default: true, description: "Cleared when a person leaves; drives the leaver rule and hides them from pickers." }
      - name: su_systemuser
        displayName: Dataverse User
        description: "Links a directory person to their Dataverse user for Assigned to you and Power BI row-level security."
        type: Lookup
        target: systemuser
      - { name: su_isexecutive, displayName: Executive Team Member, type: Boolean, default: false }

  su_compliancefunction:
    displayName: Compliance Function
    displayCollectionName: Compliance Functions
    description: >-
      One row per obligation, with the ownership chain, governing statute, what
      it requires, when it is due, and the risk it carries. System of record.
    primaryName: su_name
    ownership: UserOwned
    hasActivities: true
    hasNotes: true
    columns:
      - { name: su_name, displayName: Compliance Function, type: String, maxLength: 300, required: SystemRequired }
      - { name: su_functioncode, displayName: Function ID, type: String, maxLength: 20, alternateKey: true, description: "Stable public identifier, e.g. CF-1041." }
      - name: su_riskarea
        displayName: Risk Area
        type: Lookup
        target: su_riskarea
        required: Recommended
        relationshipName: su_riskarea_su_compliancefunction
      - name: su_domain
        displayName: Domain
        type: Lookup
        target: su_domain
        required: Recommended
        relationshipName: su_domain_su_compliancefunction
      - { name: su_statute, displayName: Statute, type: String, maxLength: 300 }
      - { name: su_citation, displayName: Citation, type: String, maxLength: 300 }
      - { name: su_statuteurl, displayName: Statute URL, type: String, format: Url, maxLength: 500 }
      - name: su_executiveowner
        displayName: Executive Owner
        type: Lookup
        target: su_compliancedirectory
      - name: su_unitowner
        displayName: Unit Owner
        type: Lookup
        target: su_compliancedirectory
      - name: su_complianceowner
        displayName: Compliance Owner
        type: Lookup
        target: su_compliancedirectory
      - { name: su_description, displayName: What The Obligation Is, type: Memo, maxLength: 4000 }
      - { name: su_reporting, displayName: Reporting Requirement, type: Memo, maxLength: 4000 }
      - { name: su_deadlinenarrative, displayName: Deadline And Cadence, type: Memo, maxLength: 2000 }
      - { name: su_resourcelabel, displayName: Resource Label, type: String, maxLength: 200 }
      - { name: su_resourceurl, displayName: Resource URL, type: String, format: Url, maxLength: 500 }
      - name: su_risk
        displayName: Risk Rating
        type: Choice
        choice: su_risklevel
        required: Recommended
        description: "Not required: empty on nearly all rows today, populated over time."
      - { name: su_lastreviewed, displayName: Last Reviewed, type: DateTime, format: DateOnly }
      - name: su_opengapcount
        displayName: Open Gaps
        type: Rollup
        rollup:
          aggregate: COUNT
          relatedTable: su_compliancegap
          relationship: su_compliancefunction_su_compliancegap
          filter: { column: su_status, operator: ne, value: 100000021 }
      - name: su_nextduedate
        displayName: Next Due Date
        type: Rollup
        rollup:
          aggregate: MIN
          relatedTable: su_compliancedeadline
          relationship: su_compliancefunction_su_compliancedeadline
          aggregateColumn: su_duedate
          filter: { column: su_complete, operator: eq, value: false }
      - { name: su_isflagged, displayName: Flagged For Review, type: Boolean, default: false }

  su_compliancedeadline:
    displayName: Compliance Deadline
    displayCollectionName: Compliance Deadlines
    description: >-
      One row per due event, joined to its function. Typed: Fixed Recurring rows
      carry the calendar fields; Event-Relative rows carry a trigger and offset.
    primaryName: su_name
    ownership: UserOwned
    hasActivities: true
    hasNotes: false
    columns:
      - { name: su_name, displayName: Deadline, type: String, maxLength: 300, required: SystemRequired }
      - name: su_function
        displayName: Compliance Function
        type: Lookup
        target: su_compliancefunction
        required: ApplicationRequired
        relationshipName: su_compliancefunction_su_compliancedeadline
        cascade: { delete: Cascade }
      - name: su_deadlinetype
        displayName: Deadline Type
        type: Choice
        choice: su_deadlinetype
        required: ApplicationRequired
      - { name: su_duedate, displayName: Next Due Date, type: DateTime, format: DateOnly, required: Recommended }
      - { name: su_cadence, displayName: Cadence, type: Choice, choice: su_cadence }
      - { name: su_duemonthnum, displayName: Due Month Number, type: Integer, minValue: 1, maxValue: 12 }
      - { name: su_dueday, displayName: Due Day, type: Integer, minValue: 1, maxValue: 31 }
      - { name: su_triggerevent, displayName: Trigger Event, type: String, maxLength: 250, description: "Event-Relative only: what starts the clock." }
      - { name: su_offsetvalue, displayName: Offset Value, type: Integer, minValue: 0, maxValue: 3650 }
      - { name: su_offsetunit, displayName: Offset Unit, type: Choice, choice: su_offsetunit }
      - { name: su_notes, displayName: Deadline Notes, type: Memo, maxLength: 2000 }
      - { name: su_complete, displayName: Complete, type: Boolean, default: false }
      - { name: su_completeddate, displayName: Last Completed Date, type: DateTime, format: DateOnly }
      - name: su_owner
        displayName: Owner
        description: "Copied from the parent function's compliance owner on save."
        type: Lookup
        target: su_compliancedirectory
      - { name: su_risk, displayName: Risk Rating, type: Choice, choice: su_risklevel }

  su_assessment:
    displayName: Assessment
    displayCollectionName: Assessments
    description: >-
      A compliance assessment: one conducted event, with its date, overall risk
      rating, status, and file. Produces gaps. Foundation of the Assessment
      Tracker.
    primaryName: su_name
    ownership: UserOwned
    hasActivities: true
    hasNotes: true
    columns:
      - { name: su_name, displayName: Assessment Name, type: String, maxLength: 300, required: SystemRequired }
      - { name: su_assessmentcode, displayName: Assessment ID, type: String, maxLength: 20, alternateKey: true, description: "Legacy surrogate key for seed relationship resolution." }
      - { name: su_assessmentdate, displayName: Assessment Date, type: DateTime, format: DateOnly, description: "When the assessment was conducted (one per assessment)." }
      - { name: su_risk, displayName: Risk Rating, type: Choice, choice: su_risklevel }
      - { name: su_status, displayName: Status, type: Choice, choice: su_assessmentstatus }
      - { name: su_currentholder, displayName: Current Holder, type: String, maxLength: 150 }
      - { name: su_followupround, displayName: Follow-up Round, type: Integer, minValue: 0, maxValue: 20 }
      - { name: su_unit, displayName: Unit, type: String, maxLength: 200 }
      - { name: su_keycontrolsmissing, displayName: Key Controls Missing, type: Integer, minValue: 0, maxValue: 1000 }
      - { name: su_approverstext, displayName: Approvers, type: String, maxLength: 400, description: "Approver names; becomes a junction once matched to directory." }
      - { name: su_fileurl, displayName: Assessment File URL, type: String, format: Url, maxLength: 500 }
      - name: su_domain
        displayName: Domain Assessed
        description: "What this assessment covers; optional link to a domain."
        type: Lookup
        target: su_domain
        relationshipName: su_domain_su_assessment

  su_assessmentowner:
    displayName: Assessment Owner
    displayCollectionName: Assessment Owners
    description: >-
      Junction between an assessment and a person, carrying the role. Mirrors
      Function Ownership. Handles the legacy multi-owner cells.
    primaryName: su_name
    ownership: UserOwned
    hasActivities: false
    hasNotes: false
    columns:
      - { name: su_name, displayName: Assignment, type: String, maxLength: 400, required: SystemRequired }
      - name: su_assessment
        displayName: Assessment
        type: Lookup
        target: su_assessment
        required: ApplicationRequired
        relationshipName: su_assessment_su_assessmentowner
        cascade: { delete: Cascade }
      - name: su_person
        displayName: Person
        type: Lookup
        target: su_compliancedirectory
        required: ApplicationRequired
      - { name: su_role, displayName: Role, type: Choice, choice: su_assessmentownerrole, required: ApplicationRequired }
    alternateKeys:
      - { name: su_uniqueassessmentowner, columns: [su_assessment, su_person, su_role] }

  su_compliancegap:
    displayName: Compliance Gap
    displayCollectionName: Compliance Gaps
    description: >-
      Open and closed gaps. A gap is raised against the function it came from and
      the assessment that surfaced it, and carries its own remediation target.
    primaryName: su_name
    ownership: UserOwned
    hasActivities: true
    hasNotes: true
    columns:
      - { name: su_name, displayName: Gap Summary, type: String, maxLength: 400, required: SystemRequired }
      - { name: su_gapcode, displayName: Gap ID, type: String, maxLength: 20, alternateKey: true }
      - name: su_function
        displayName: Compliance Function
        type: Lookup
        target: su_compliancefunction
        required: ApplicationRequired
        relationshipName: su_compliancefunction_su_compliancegap
        cascade: { delete: Cascade }
      - name: su_assessment
        displayName: Assessment
        description: "Which assessment surfaced this gap."
        type: Lookup
        target: su_assessment
        relationshipName: su_assessment_su_compliancegap
      - { name: su_severity, displayName: Severity, type: Choice, choice: su_risklevel, required: Recommended }
      - { name: su_status, displayName: Status, type: Choice, choice: su_gapstatus, required: SystemRequired }
      - { name: su_openeddate, displayName: Opened, type: DateTime, format: DateOnly }
      - { name: su_closeddate, displayName: Closed, type: DateTime, format: DateOnly }
      - { name: su_targetquarter, displayName: Target Quarter, type: String, maxLength: 20, description: "Owner's estimated remediation quarter (per gap)." }
      - { name: su_targetfy, displayName: Target FY, type: String, maxLength: 20 }
      - { name: su_note, displayName: Detail And Remediation Plan, type: Memo, maxLength: 4000 }
      - { name: su_closenote, displayName: Closure Notes, type: Memo, maxLength: 4000 }
      - name: su_owner
        displayName: Owner
        type: Lookup
        target: su_compliancedirectory
      - name: su_closedby
        displayName: Closed By
        type: Lookup
        target: su_compliancedirectory
      - name: su_daysopen
        displayName: Days Open
        type: Calculated
        calculated:
          returnType: Integer
          formula: >-
            IF(ISNULL(su_closeddate),
               DIFFINDAYS(su_openeddate, NOW()),
               DIFFINDAYS(su_openeddate, su_closeddate))

  su_functionownership:
    displayName: Function Ownership
    displayCollectionName: Function Ownership
    description: >-
      Junction between a function and a person, carrying the role tier and the
      sub-role weight. The authority for who is in charge of what.
    primaryName: su_name
    ownership: UserOwned
    hasActivities: false
    hasNotes: false
    columns:
      - { name: su_name, displayName: Assignment, type: String, maxLength: 400, required: SystemRequired }
      - name: su_function
        displayName: Compliance Function
        type: Lookup
        target: su_compliancefunction
        required: ApplicationRequired
        relationshipName: su_compliancefunction_su_functionownership
        cascade: { delete: Cascade }
      - name: su_person
        displayName: Person
        type: Lookup
        target: su_compliancedirectory
        required: ApplicationRequired
      - { name: su_role, displayName: Role, type: Choice, choice: su_ownershiprole, required: ApplicationRequired }
      - { name: su_subrole, displayName: Sub-role, type: Choice, choice: su_ownershipsubrole, required: ApplicationRequired }
    alternateKeys:
      - { name: su_uniqueassignment, columns: [su_function, su_person, su_role] }

  su_functionflag:
    displayName: Function Flag
    displayCollectionName: Function Flags
    description: Raised by any owner when a record looks wrong.
    primaryName: su_name
    ownership: UserOwned
    hasActivities: false
    hasNotes: false
    columns:
      - { name: su_name, displayName: Flag, type: String, maxLength: 400, required: SystemRequired }
      - name: su_function
        displayName: Compliance Function
        type: Lookup
        target: su_compliancefunction
        required: ApplicationRequired
        relationshipName: su_compliancefunction_su_functionflag
        cascade: { delete: Cascade }
      - { name: su_reason, displayName: Reason, type: Memo, maxLength: 2000, required: ApplicationRequired }
      - { name: su_source, displayName: Source, type: Choice, choice: su_flagsource }
      - { name: su_status, displayName: Status, type: Choice, choice: su_flagstatus, required: SystemRequired }
      - name: su_flaggedby
        displayName: Flagged By
        type: Lookup
        target: su_compliancedirectory
      - { name: su_flaggedon, displayName: Flagged On, type: DateTime, format: DateOnly }
      - name: su_clearedby
        displayName: Cleared By
        type: Lookup
        target: su_compliancedirectory
      - { name: su_clearedon, displayName: Cleared On, type: DateTime, format: DateOnly }

  su_counselassignment:
    displayName: Counsel Assignment
    displayCollectionName: Counsel Assignments
    description: >-
      Office of University Counsel attorney of record per risk area. Exactly one
      row should carry Is Default, used when a risk area has no explicit one.
    primaryName: su_name
    ownership: OrganizationOwned
    hasActivities: false
    hasNotes: false
    columns:
      - { name: su_name, displayName: Assignment, type: String, maxLength: 300, required: SystemRequired }
      - name: su_riskarea
        displayName: Risk Area
        description: Empty on the default escalation row.
        type: Lookup
        target: su_riskarea
        relationshipName: su_riskarea_su_counselassignment
      - name: su_attorney
        displayName: Attorney
        type: Lookup
        target: su_compliancedirectory
        required: ApplicationRequired
      - { name: su_isdefault, displayName: Is Default Escalation, type: Boolean, default: false }

  su_appadmin:
    displayName: App Role Assignment
    displayCollectionName: App Role Assignments
    description: Role gate for the canvas app.
    primaryName: su_name
    ownership: OrganizationOwned
    hasActivities: false
    hasNotes: false
    columns:
      - { name: su_name, displayName: Assignment, type: String, maxLength: 300, required: SystemRequired }
      - name: su_person
        displayName: Person
        type: Lookup
        target: su_compliancedirectory
        required: ApplicationRequired
      - { name: su_role, displayName: Role, type: Choice, choice: su_approle, required: ApplicationRequired }
      - { name: su_active, displayName: Active, type: Boolean, default: true }

fiscalCalendar:
  startMonth: 7
  label: "FY{yy} Q{q}"

reminders:
  offsetsDays: [90, 30, 0]
  overdueRepeatDays: 7
