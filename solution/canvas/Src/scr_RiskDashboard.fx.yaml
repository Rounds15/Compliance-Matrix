# =============================================================================
# Risk Dashboard - administrator only
# =============================================================================
# The canvas half of the hybrid dashboard: interactive, drillable, and always
# live against Dataverse. The Power BI half lives on scr_Reporting and carries
# the historical trend analysis that a canvas app cannot do well.
#
# The split is deliberate:
#   canvas   -> current state, click-through to the record, write actions
#   Power BI -> aggregation over time, gap-aging curves, executive distribution
#
# Heat map cells are shaded by count within the risk colour, matching the
# prototype. Selecting a cell lists the functions behind it.
# =============================================================================

Screens:

    scr_RiskDashboard:
        Properties:
            Fill: =gblTheme.White
            OnVisible: |
                =If(!gblIsAdmin, Navigate(scr_NoAccess, ScreenTransition.None));
                Set(gblHeatCell, Blank());
                ClearCollect(colAllFunctions, 'Compliance Functions');
                ClearCollect(colOpenGaps, Filter('Compliance Gaps', su_status <> 'Gap Status'.Closed));
                // Densest cell in the grid, used to scale the shading ramp.
                Set(
                    gblHeatMax,
                    Max(
                        ForAll(
                            colRiskAreas As t,
                            CountRows(
                                Filter(
                                    colAllFunctions,
                                    su_riskarea.su_riskareaid = t.su_riskareaid
                                )
                            )
                        ),
                        Value
                    )
                )

        Children:

            - cmp_HeaderRisk:
                Control: cmp_Header
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =104
                    ActiveScreen: ="RiskDashboard"
                    OpenGapCount: =gblOpenGapCount

            - cmp_RiskHead:
                Control: cmp_PageHead
                Properties:
                    X: =64
                    Y: =128
                    Width: =Parent.Width - 128
                    Height: =124
                    Eyebrow: ="Risk and Reporting - Administrator"
                    Title: ="Risk Dashboard"
                    Subtitle: |
                        ="The executive risk picture: where the institution's critical and high-risk obligations sit, and how gaps and deadlines cluster against them."

            # ---- risk distribution tiles -------------------------------------
            - gal_RiskStats:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                    X: =64
                    Y: =258
                    Width: =Parent.Width - 128
                    Height: =104
                    TemplateSize: =(Parent.Width - 128) / 4
                    TemplatePadding: =0
                    ShowScrollbar: =false
                    Items: |
                        =Table(
                            {RiskKey: 'Risk Level'.High,     RiskLabel: "High"},
                            {RiskKey: 'Risk Level'.Moderate, RiskLabel: "Moderate"},
                            {RiskKey: 'Risk Level'.Low,      RiskLabel: "Low"},
                            {RiskKey: Blank(),               RiskLabel: "Unrated"}
                        )
                Children:
                    - rec_RiskStatCard:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth - 14
                            Height: =96
                            Fill: =gblTheme.White
                            BorderColor: =gblTheme.Border
                            BorderThickness: =1
                    - lbl_RiskStatValue:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =12
                            Width: =Parent.TemplateWidth - 40
                            Height: =40
                            Text: |
                                =CountRows(
                                    Filter(
                                        colAllFunctions,
                                        If(
                                            ThisItem.RiskLabel = "Unrated",
                                            IsBlank(su_risk),
                                            su_risk = ThisItem.RiskKey
                                        )
                                    )
                                )
                            Color: |
                                =Switch(
                                    ThisItem.RiskLabel,
                                    "High",     gblTheme.High,
                                    "Moderate",   gblTheme.Moderate,
                                    gblTheme.Low
                                )
                            Size: =24
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontDisplay
                    - lbl_RiskStatLabel:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =52
                            Width: =Parent.TemplateWidth - 40
                            Height: =20
                            Text: =If(ThisItem.RiskLabel = "Unrated", "Unrated", ThisItem.RiskLabel & " risk")
                            Color: =gblTheme.GrayDark
                            Size: =10
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - lbl_RiskStatPct:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =70
                            Width: =Parent.TemplateWidth - 40
                            Height: =18
                            Text: |
                                =Round(
                                    CountRows(
                                        Filter(
                                            colAllFunctions,
                                            If(
                                                ThisItem.RiskLabel = "Unrated",
                                                IsBlank(su_risk),
                                                su_risk = ThisItem.RiskKey
                                            )
                                        )
                                    ) / Max(CountRows(colAllFunctions), 1) * 100,
                                    0
                                ) & "% of the matrix"
                            Color: =gblTheme.GrayMid
                            Size: =8
                            Font: =gblTheme.FontBody

            # ---- heat map ------------------------------------------------------
            - lbl_HeatHead:
                Control: Label@2.5.1
                Properties:
                    X: =64
                    Y: =382
                    Width: =600
                    Height: =24
                    Text: ="HEAT MAP - RISK AREA BY RISK RATING (INCLUDING UNRATED)"
                    Color: =gblTheme.OrangeDark
                    Size: =8
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontBody
            - lbl_HeatHint:
                Control: Label@2.5.1
                Properties:
                    X: =Parent.Width - 360
                    Y: =382
                    Width: =296
                    Height: =24
                    Text: ="Select a cell to list the functions"
                    Color: =gblTheme.GrayMid
                    Size: =9
                    Align: =Align.Right
                    Font: =gblTheme.FontBody
            - gal_HeatRows:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                    X: =64
                    Y: =412
                    Width: =Parent.Width - 128
                    Height: =Parent.Height - 470
                    TemplateSize: =38
                    TemplatePadding: =0
                    ShowScrollbar: =true
                    Items: =colRiskAreas
                Children:
                    - lbl_HeatRowLabel:
                        Control: Label@2.5.1
                        Properties:
                            X: =0
                            Y: =0
                            Width: =260
                            Height: =36
                            Text: =ThisItem.su_name
                            Fill: =gblTheme.Surface
                            Color: =gblTheme.Navy
                            Size: =9
                            FontWeight: =FontWeight.Semibold
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
                    - gal_HeatCells:
                        Control: Gallery@2.15.0
                        Variant: Horizontal
                        Properties:
                            X: =264
                            Y: =0
                            Width: =Parent.TemplateWidth - 364
                            Height: =36
                            TemplateSize: =(Parent.TemplateWidth - 364) / 4
                            TemplatePadding: =0
                            ShowScrollbar: =false
                            Items: |
                                =Table(
                                    {CellRisk: 'Risk Level'.High,     CellLabel: "High"},
                                    {CellRisk: 'Risk Level'.Moderate, CellLabel: "Moderate"},
                                    {CellRisk: 'Risk Level'.Low,      CellLabel: "Low"},
                                    {CellRisk: Blank(),               CellLabel: "Unrated"}
                                )
                        Children:
                            - rec_HeatCell:
                                Control: Rectangle@2.3.0
                                Properties:
                                    X: =1
                                    Y: =1
                                    Width: =Parent.TemplateWidth - 2
                                    Height: =34
                                    # Fade from 0.68 (dense) to near-white (sparse).
                                    Fill: |
                                        =With(
                                            {
                                                n: CountRows(
                                                    Filter(
                                                        colAllFunctions,
                                                        su_riskarea.su_riskareaid
                                                            = gal_HeatRows.Selected.su_riskareaid,
                                                        If(
                                                            ThisItem.CellLabel = "Unrated",
                                                            IsBlank(su_risk),
                                                            su_risk = ThisItem.CellRisk
                                                        )
                                                    )
                                                )
                                            },
                                            If(
                                                n = 0,
                                                gblTheme.White,
                                                ColorFade(
                                                    Switch(
                                                        ThisItem.CellLabel,
                                                        "High",     gblTheme.High,
                                                        "Moderate", gblTheme.Moderate,
                                                        "Low",      gblTheme.Low,
                                                        gblTheme.Unrated
                                                    ),
                                                    0.90 - 0.62 * (n / Max(gblHeatMax, 1))
                                                )
                                            )
                                        )
                                    BorderColor: =gblTheme.BorderSoft
                                    BorderThickness: =1
                            - lbl_HeatCellValue:
                                Control: Label@2.5.1
                                Properties:
                                    X: =1
                                    Y: =1
                                    Width: =Parent.TemplateWidth - 2
                                    Height: =34
                                    Text: |
                                        =With(
                                            {
                                                n: CountRows(
                                                    Filter(
                                                        colAllFunctions,
                                                        su_riskarea.su_riskareaid
                                                            = gal_HeatRows.Selected.su_riskareaid,
                                                        If(
                                                            ThisItem.CellLabel = "Unrated",
                                                            IsBlank(su_risk),
                                                            su_risk = ThisItem.CellRisk
                                                        )
                                                    )
                                                )
                                            },
                                            If(n = 0, "", Text(n))
                                        )
                                    Color: =gblTheme.GrayDark
                                    Size: =10
                                    FontWeight: =FontWeight.Bold
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Font: =gblTheme.FontBody
                            - btn_HeatCellOverlay:
                                Control: Classic/Button@2.2.0
                                Properties:
                                    X: =1
                                    Y: =1
                                    Width: =Parent.TemplateWidth - 2
                                    Height: =34
                                    Text: =""
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =RGBA(0, 14, 84, 0.08)
                                    BorderThickness: =0
                                    OnSelect: |
                                        =Set(
                                            gblHeatCell,
                                            {
                                                RiskArea: gal_HeatRows.Selected,
                                                Risk: ThisItem.CellRisk,
                                                RiskLabel: ThisItem.CellLabel
                                            }
                                        )
                    - lbl_HeatRowTotal:
                        Control: Label@2.5.1
                        Properties:
                            X: =Parent.TemplateWidth - 96
                            Y: =0
                            Width: =92
                            Height: =36
                            Text: |
                                =CountRows(
                                    Filter(
                                        colAllFunctions,
                                        su_riskarea.su_riskareaid = ThisItem.su_riskareaid
                                    )
                                )
                            Fill: =gblTheme.Surface
                            Color: =gblTheme.Navy
                            Size: =10
                            FontWeight: =FontWeight.Bold
                            Align: =Align.Center
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody

            # ---- exposure signals ----------------------------------------------
            - lbl_SignalsHead:
                Control: Label@2.5.1
                Properties:
                    X: =Parent.Width - 400
                    Y: =Parent.Height - 250
                    Width: =336
                    Height: =24
                    Text: ="RISK EXPOSURE SIGNALS"
                    Color: =gblTheme.OrangeDark
                    Size: =8
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontBody
            - lbl_SignalsBody:
                Control: Label@2.5.1
                Properties:
                    X: =Parent.Width - 400
                    Y: =Parent.Height - 222
                    Width: =336
                    Height: =220
                    # Distinct() collapses several gaps on one function to one row,
                    # so these are counts of exposed functions, not of gaps.
                    Text: |
                        ="Functions with an open gap        " &
                         CountRows(Distinct(colOpenGaps, su_function.su_compliancefunctionid)) &
                         Char(10) &
                         "High-risk functions with a gap  " &
                         CountRows(
                             Distinct(
                                 Filter(
                                     colOpenGaps,
                                     su_function.su_risk = 'Risk Level'.High
                                 ),
                                 su_function.su_compliancefunctionid
                             )
                         ) & Char(10) &
                         "Overdue deadlines                    " & gblHomeOverdue & Char(10) &
                         "Unassigned unit-owner roles     " &
                         CountRows(Filter(colAllFunctions, IsBlank(su_unitowner))) & Char(10) &
                         "Functions with no risk rating    " &
                         CountRows(Filter(colAllFunctions, IsBlank(su_risk))) & Char(10) &
                         "Functions with no risk area      " &
                         CountRows(Filter(colAllFunctions, IsBlank(su_riskarea))) & Char(10) &
                         "Functions with no domain          " &
                         CountRows(Filter(colAllFunctions, IsBlank(su_domain)))
                    Fill: =gblTheme.Surface
                    Color: =gblTheme.GrayDark
                    Size: =10
                    Font: =gblTheme.FontBody

            # =================================================================
            # CELL DRILL-DOWN
            # =================================================================
            - rec_HeatScrim:
                Control: Rectangle@2.3.0
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =Parent.Height
                    Fill: =RGBA(0, 14, 84, 0.55)
                    BorderThickness: =0
                    Visible: =!IsBlank(gblHeatCell)
            - cnt_HeatDialog:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                    X: =(Parent.Width - 720) / 2
                    Y: =(Parent.Height - 520) / 2
                    Width: =720
                    Height: =520
                    Fill: =gblTheme.White
                    Visible: =!IsBlank(gblHeatCell)
                Children:
                    - rec_HeatDialogHead:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =720
                            Height: =92
                            Fill: =gblTheme.Navy
                            BorderThickness: =0
                    - lbl_HeatDialogEyebrow:
                        Control: Label@2.5.1
                        Properties:
                            X: =24
                            Y: =16
                            Width: =600
                            Height: =20
                            Text: =Upper(gblHeatCell.RiskLabel & " RISK")
                            Color: =gblTheme.OrangeLight
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - lbl_HeatDialogTitle:
                        Control: Label@2.5.1
                        Properties:
                            X: =24
                            Y: =38
                            Width: =600
                            Height: =32
                            Text: =gblHeatCell.RiskArea.su_name
                            Color: =gblTheme.White
                            Size: =16
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontDisplay
                    - gal_HeatDrill:
                        Control: Gallery@2.15.0
                        Variant: Vertical
                        Properties:
                            X: =24
                            Y: =110
                            Width: =672
                            Height: =340
                            TemplateSize: =58
                            TemplatePadding: =0
                            ShowScrollbar: =true
                            Items: |
                                =Filter(
                                    colAllFunctions,
                                    su_riskarea.su_riskareaid
                                        = gblHeatCell.RiskArea.su_riskareaid,
                                    If(
                                        gblHeatCell.RiskLabel = "Unrated",
                                        IsBlank(su_risk),
                                        su_risk = gblHeatCell.Risk
                                    )
                                )
                        Children:
                            - lbl_HeatDrillName:
                                Control: Label@2.5.1
                                Properties:
                                    X: =8
                                    Y: =8
                                    Width: =Parent.TemplateWidth - 120
                                    Height: =22
                                    Text: =ThisItem.su_name
                                    Color: =gblTheme.Navy
                                    Size: =11
                                    FontWeight: =FontWeight.Semibold
                                    Font: =gblTheme.FontBody
                            - lbl_HeatDrillSub:
                                Control: Label@2.5.1
                                Properties:
                                    X: =8
                                    Y: =30
                                    Width: =Parent.TemplateWidth - 120
                                    Height: =18
                                    Text: |
                                        =ThisItem.su_domain.su_name & "  |  " &
                                         ThisItem.su_complianceowner.su_name
                                    Color: =gblTheme.GrayMid
                                    Size: =9
                                    Font: =gblTheme.FontBody
                            - rec_HeatDrillRule:
                                Control: Rectangle@2.3.0
                                Properties:
                                    X: =0
                                    Y: =57
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                                    Fill: =gblTheme.BorderSoft
                                    BorderThickness: =0
                            - btn_HeatDrillOverlay:
                                Control: Classic/Button@2.2.0
                                Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =58
                                    Text: =""
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =RGBA(0, 14, 84, 0.04)
                                    BorderThickness: =0
                                    OnSelect: |
                                        =Set(gblSelectedFunction, ThisItem);
                                        Set(gblHeatCell, Blank());
                                        Navigate(scr_FunctionDetail, ScreenTransition.None)
                    - btn_HeatDialogClose:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =586
                            Y: =464
                            Width: =110
                            Height: =40
                            Text: ="Close"
                            OnSelect: =Set(gblHeatCell, Blank())
                            Fill: =RGBA(0, 0, 0, 0)
                            Color: =gblTheme.Navy
                            BorderColor: =gblTheme.Navy
                            BorderThickness: =1
                            HoverFill: =RGBA(0, 14, 84, 0.06)
                            Size: =11
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
