# =============================================================================
# Assessment Detail
# =============================================================================
# The full record for one assessment: its metadata, its owners (from the
# su_assessmentowner junction), and the gaps it surfaced (su_compliancegap
# where su_assessment = this record), each with its remediation target.
#
# This is the screen that closes the loop the office cares about most: an
# assessment is only finished when the gaps it produced are closed, and until
# now that link lived in someone's spreadsheet.
# =============================================================================

Screens:

    scr_AssessmentDetail:
        Properties:
            Fill: =gblTheme.White
            OnVisible: |
                =If(!gblIsAdmin, Navigate(scr_NoAccess, ScreenTransition.None));
                ClearCollect(
                    colAsmtOwners,
                    Filter(
                        'Assessment Owners',
                        su_assessment.su_assessmentid
                            = gblSelectedAssessment.su_assessmentid
                    )
                );
                ClearCollect(
                    colAsmtGaps,
                    SortByColumns(
                        Filter(
                            'Compliance Gaps',
                            su_assessment.su_assessmentid
                                = gblSelectedAssessment.su_assessmentid
                        ),
                        "su_status",
                        SortOrder.Ascending
                    )
                )

        Children:

            - cmp_HeaderAsmtDetail:
                Control: cmp_Header
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =104
                    ActiveScreen: ="Assessments"
                    OpenGapCount: =gblOpenGapCount

            - btn_AdBack:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =64
                    Y: =116
                    Width: =150
                    Height: =32
                    Text: ="All assessments"
                    OnSelect: =Back()
                    Fill: =RGBA(0, 0, 0, 0)
                    Color: =gblTheme.OrangeDark
                    HoverFill: =RGBA(215, 65, 0, 0.06)
                    BorderThickness: =0
                    Align: =Align.Left
                    Size: =10
                    FontWeight: =FontWeight.Semibold
                    Font: =gblTheme.FontBody

            # ---- navy record header ------------------------------------------
            - rec_AdHead:
                Control: Rectangle@2.3.0
                Properties:
                    X: =0
                    Y: =156
                    Width: =Parent.Width
                    Height: =150
                    Fill: =gblTheme.Navy
                    BorderThickness: =0
            - rec_AdHeadRule:
                Control: Rectangle@2.3.0
                Properties:
                    X: =0
                    Y: =303
                    Width: =Parent.Width
                    Height: =3
                    Fill: =gblTheme.Orange
                    BorderThickness: =0
            - lbl_AdEyebrow:
                Control: Label@2.5.1
                Properties:
                    X: =64
                    Y: =174
                    Width: =800
                    Height: =20
                    Text: |
                        =Upper(
                            "ASSESSMENT" &
                            If(
                                IsBlank(gblSelectedAssessment.su_unit),
                                "",
                                "  |  " & gblSelectedAssessment.su_unit
                            )
                        )
                    Color: =gblTheme.OrangeLight
                    Size: =8
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontBody
            - lbl_AdTitle:
                Control: Label@2.5.1
                Properties:
                    X: =64
                    Y: =198
                    Width: =Parent.Width - 460
                    Height: =56
                    Text: =gblSelectedAssessment.su_name
                    Color: =gblTheme.White
                    Size: =22
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontDisplay
            - cmp_AdRisk:
                Control: cmp_RiskPill
                Properties:
                    X: =64
                    Y: =262
                    Width: =74
                    Height: =24
                    Risk: |
                        =Switch(
                            gblSelectedAssessment.su_risk,
                            'Risk Level'.High,     "High",
                            'Risk Level'.Moderate, "Moderate",
                            'Risk Level'.Low,      "Low",
                            ""
                        )
            - lbl_AdCode:
                Control: Label@2.5.1
                Properties:
                    X: =148
                    Y: =262
                    Width: =110
                    Height: =24
                    Text: =gblSelectedAssessment.su_assessmentcode
                    Fill: =RGBA(255, 255, 255, 0.1)
                    Color: =RGBA(199, 210, 234, 1)
                    Size: =9
                    Align: =Align.Center
                    VerticalAlign: =VerticalAlign.Middle
                    Font: =gblTheme.FontBody
            - lbl_AdGapBadge:
                Control: Label@2.5.1
                Properties:
                    X: =268
                    Y: =262
                    Width: =120
                    Height: =24
                    Text: |
                        =CountRows(
                            Filter(colAsmtGaps, su_status <> 'Gap Status'.Closed)
                        ) & " open gap(s)"
                    Visible: |
                        =CountRows(
                            Filter(colAsmtGaps, su_status <> 'Gap Status'.Closed)
                        ) > 0
                    Fill: =gblTheme.High
                    Color: =gblTheme.White
                    Size: =8
                    FontWeight: =FontWeight.Bold
                    Align: =Align.Center
                    VerticalAlign: =VerticalAlign.Middle
                    Font: =gblTheme.FontBody
            - btn_AdOpenFile:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =Parent.Width - 260
                    Y: =252
                    Width: =196
                    Height: =40
                    Text: ="Open assessment file"
                    Visible: =!IsBlank(gblSelectedAssessment.su_fileurl)
                    OnSelect: =Launch(gblSelectedAssessment.su_fileurl)
                    Fill: =gblTheme.Orange
                    HoverFill: =gblTheme.OrangeMedium
                    Color: =gblTheme.White
                    BorderThickness: =0
                    Size: =10
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontBody

            # =================================================================
            # MAIN COLUMN - gaps produced
            # =================================================================
            - lbl_AdGapsHead:
                Control: Label@2.5.1
                Properties:
                    X: =64
                    Y: =330
                    Width: =600
                    Height: =24
                    Text: ="GAPS SURFACED BY THIS ASSESSMENT"
                    Color: =gblTheme.OrangeDark
                    Size: =8
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontBody
            - gal_AdGaps:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                    X: =64
                    Y: =360
                    Width: =Parent.Width - 480
                    Height: =Parent.Height - 420
                    TemplateSize: =108
                    TemplatePadding: =0
                    ShowScrollbar: =true
                    Items: =colAsmtGaps
                Children:
                    - rec_AdGapCard:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth
                            Height: =100
                            Fill: =gblTheme.White
                            BorderColor: =gblTheme.Border
                            BorderThickness: =1
                    - rec_AdGapAccent:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =4
                            Height: =100
                            Fill: |
                                =Switch(
                                    ThisItem.su_status,
                                    'Gap Status'.Open,          gblTheme.High,
                                    'Gap Status'.'In Progress', gblTheme.Moderate,
                                    gblTheme.Low
                                )
                            BorderThickness: =0
                    - lbl_AdGapStatus:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =10
                            Width: =92
                            Height: =22
                            Text: |
                                =Switch(
                                    ThisItem.su_status,
                                    'Gap Status'.Open,          "Open",
                                    'Gap Status'.'In Progress', "In Progress",
                                    "Closed"
                                )
                            Fill: |
                                =ColorFade(
                                    Switch(
                                        ThisItem.su_status,
                                        'Gap Status'.Open,          gblTheme.High,
                                        'Gap Status'.'In Progress', gblTheme.Moderate,
                                        gblTheme.Low
                                    ),
                                    0.88
                                )
                            Color: |
                                =Switch(
                                    ThisItem.su_status,
                                    'Gap Status'.Open,          gblTheme.High,
                                    'Gap Status'.'In Progress', gblTheme.Moderate,
                                    gblTheme.Low
                                )
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Align: =Align.Center
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
                    - lbl_AdGapMeta:
                        Control: Label@2.5.1
                        Properties:
                            X: =116
                            Y: =10
                            Width: =Parent.TemplateWidth - 132
                            Height: =22
                            Text: |
                                =ThisItem.su_gapcode &
                                 If(
                                     IsBlank(ThisItem.su_targetquarter)
                                         && IsBlank(ThisItem.su_targetfy),
                                     "  |  no remediation target set",
                                     "  |  target " & ThisItem.su_targetquarter & " " &
                                         ThisItem.su_targetfy
                                 )
                            Color: =gblTheme.GrayMid
                            Size: =8
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
                    - lbl_AdGapTitle:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =34
                            Width: =Parent.TemplateWidth - 32
                            Height: =22
                            Text: =ThisItem.su_name
                            Color: =gblTheme.Navy
                            Size: =11
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - lbl_AdGapNote:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =56
                            Width: =Parent.TemplateWidth - 220
                            Height: =38
                            Text: =ThisItem.su_note
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Font: =gblTheme.FontBody
                    - lbl_AdGapOwner:
                        Control: Label@2.5.1
                        Properties:
                            X: =Parent.TemplateWidth - 196
                            Y: =58
                            Width: =180
                            Height: =34
                            Text: |
                                =If(
                                    IsBlank(ThisItem.su_owner),
                                    "Unassigned",
                                    ThisItem.su_owner.su_name
                                )
                            Color: =gblTheme.GrayDark
                            Size: =9
                            FontWeight: =FontWeight.Semibold
                            Align: =Align.Right
                            Font: =gblTheme.FontBody
                    - btn_AdGapOverlay:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth
                            Height: =100
                            Text: =""
                            Fill: =RGBA(0, 0, 0, 0)
                            HoverFill: =RGBA(0, 14, 84, 0.03)
                            BorderThickness: =0
                            # Jump to the function the gap sits on; the gap panel
                            # there shows the full remediation history.
                            OnSelect: |
                                =Set(gblSelectedFunction, ThisItem.su_function);
                                Navigate(scr_FunctionDetail, ScreenTransition.None)
            - lbl_AdGapsEmpty:
                Control: Label@2.5.1
                Properties:
                    X: =64
                    Y: =420
                    Width: =Parent.Width - 480
                    Height: =70
                    Text: |
                        ="No gaps recorded" & Char(10) &
                         "This assessment did not surface any findings, or they have not been entered yet."
                    Color: =gblTheme.GrayMid
                    Size: =11
                    Align: =Align.Center
                    Font: =gblTheme.FontBody
                    Visible: =CountRows(colAsmtGaps) = 0

            # =================================================================
            # RIGHT RAIL
            # =================================================================
            - cnt_AdRail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                    X: =Parent.Width - 396
                    Y: =330
                    Width: =332
                    Height: =Parent.Height - 390
                    Fill: =RGBA(0, 0, 0, 0)
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGap: =16
                    LayoutOverflowY: =LayoutOverflow.Scroll
                Children:
                    - lbl_AdDetailHead:
                        Control: Label@2.5.1
                        Properties:
                            Height: =24
                            Width: =Parent.Width
                            Text: ="ASSESSMENT DETAIL"
                            Color: =gblTheme.OrangeDark
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - lbl_AdDetailBody:
                        Control: Label@2.5.1
                        Properties:
                            Height: =154
                            Width: =Parent.Width
                            Text: |
                                ="Date                        " &
                                 If(
                                     IsBlank(gblSelectedAssessment.su_assessmentdate),
                                     "Not recorded",
                                     Text(gblSelectedAssessment.su_assessmentdate, "mmm d, yyyy")
                                 ) & Char(10) &
                                 "Unit                         " &
                                 Coalesce(gblSelectedAssessment.su_unit, "Not recorded") & Char(10) &
                                 "Current holder      " &
                                 Coalesce(gblSelectedAssessment.su_currentholder, "Not recorded") & Char(10) &
                                 "Follow-up round   " &
                                 Coalesce(Text(gblSelectedAssessment.su_followupround), "0") & Char(10) &
                                 "Key controls missing   " &
                                 Coalesce(Text(gblSelectedAssessment.su_keycontrolsmissing), "0")
                            Fill: =gblTheme.Surface
                            Color: =gblTheme.GrayDark
                            Size: =10
                            Font: =gblTheme.FontBody
                    - lbl_AdOwnersHead:
                        Control: Label@2.5.1
                        Properties:
                            Height: =24
                            Width: =Parent.Width
                            Text: ="ASSESSMENT OWNERS"
                            Color: =gblTheme.OrangeDark
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - gal_AdOwners:
                        Control: Gallery@2.15.0
                        Variant: Vertical
                        Properties:
                            Height: =Min(Max(CountRows(colAsmtOwners), 1) * 54, 216)
                            Width: =Parent.Width
                            TemplateSize: =54
                            TemplatePadding: =0
                            ShowScrollbar: =true
                            Items: =colAsmtOwners
                        Children:
                            - lbl_AdOwnerName:
                                Control: Label@2.5.1
                                Properties:
                                    X: =4
                                    Y: =6
                                    Width: =Parent.TemplateWidth - 90
                                    Height: =20
                                    Text: =ThisItem.su_person.su_name
                                    Color: =gblTheme.Navy
                                    Size: =10
                                    FontWeight: =FontWeight.Semibold
                                    Font: =gblTheme.FontBody
                            - lbl_AdOwnerTitle:
                                Control: Label@2.5.1
                                Properties:
                                    X: =4
                                    Y: =26
                                    Width: =Parent.TemplateWidth - 90
                                    Height: =24
                                    Text: =ThisItem.su_person.su_jobtitle
                                    Color: =gblTheme.GrayMid
                                    Size: =8
                                    Font: =gblTheme.FontBody
                            - lbl_AdOwnerRole:
                                Control: Label@2.5.1
                                Properties:
                                    X: =Parent.TemplateWidth - 84
                                    Y: =14
                                    Width: =80
                                    Height: =22
                                    Text: |
                                        =Switch(
                                            ThisItem.su_role,
                                            'Assessment Owner Role'.Compliance, "Compliance",
                                            "Executive"
                                        )
                                    Fill: |
                                        =If(
                                            ThisItem.su_role
                                                = 'Assessment Owner Role'.Executive,
                                            ColorFade(gblTheme.Navy, 0.88),
                                            ColorFade(gblTheme.GrayMid, 0.88)
                                        )
                                    Color: |
                                        =If(
                                            ThisItem.su_role
                                                = 'Assessment Owner Role'.Executive,
                                            gblTheme.Navy,
                                            gblTheme.GrayMid
                                        )
                                    Size: =8
                                    FontWeight: =FontWeight.Bold
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Font: =gblTheme.FontBody
                    - lbl_AdOwnersEmpty:
                        Control: Label@2.5.1
                        Properties:
                            Height: =40
                            Width: =Parent.Width
                            Text: ="No owners matched to the directory."
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Align: =Align.Center
                            Font: =gblTheme.FontBody
                            Visible: =CountRows(colAsmtOwners) = 0
                    - lbl_AdApproversHead:
                        Control: Label@2.5.1
                        Properties:
                            Height: =24
                            Width: =Parent.Width
                            Text: ="APPROVERS"
                            Color: =gblTheme.OrangeDark
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                            Visible: =!IsBlank(gblSelectedAssessment.su_approverstext)
                    - lbl_AdApprovers:
                        Control: Label@2.5.1
                        Properties:
                            Height: =62
                            Width: =Parent.Width
                            # Free text pending a directory match; becomes a
                            # junction once the names are reconciled.
                            Text: =gblSelectedAssessment.su_approverstext
                            Fill: =gblTheme.Surface
                            Color: =gblTheme.GrayDark
                            Size: =9
                            Font: =gblTheme.FontBody
                            Visible: =!IsBlank(gblSelectedAssessment.su_approverstext)
