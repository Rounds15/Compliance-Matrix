# =============================================================================
# Compliance Areas - for users who think in areas rather than topics
# =============================================================================
# Areas group related obligations regardless of which topic they sit under, so
# this list is derived from the distinct su_area values across the whole matrix
# rather than nested under a topic.
# =============================================================================

Screens:

    scr_Areas:
        Properties:
            Fill: =gblTheme.White
            OnVisible: |
                =Set(gblAreaScreenSel, "");
                ClearCollect(colAllFunctions, 'Compliance Functions')

        Children:

            - cmp_HeaderAreas:
                Control: Component
                ComponentName: cmp_Header
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =104
                    ActiveScreen: ="Areas"
                    OpenGapCount: =gblOpenGapCount

            - btn_AreaCrumbRoot:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =64
                    Y: =116
                    Width: =90
                    Height: =30
                    Text: ="Areas"
                    Visible: =!IsBlank(gblAreaScreenSel)
                    OnSelect: =Set(gblAreaScreenSel, "")
                    Fill: =RGBA(0, 0, 0, 0)
                    Color: =gblTheme.OrangeDark
                    BorderThickness: =0
                    HoverFill: =RGBA(215, 65, 0, 0.06)
                    Align: =Align.Left
                    Size: =10
                    FontWeight: =FontWeight.Semibold
                    Font: =gblTheme.FontBody

            - cmp_AreasHead:
                Control: Component
                ComponentName: cmp_PageHead
                Properties:
                    X: =64
                    Y: =152
                    Width: =Parent.Width - 128
                    Height: =124
                    Eyebrow: =If(IsBlank(gblAreaScreenSel), "Browse", "Compliance area")
                    Title: =If(IsBlank(gblAreaScreenSel), "Compliance Areas", gblAreaScreenSel)
                    Subtitle: |
                        =If(
                            IsBlank(gblAreaScreenSel),
                            "For users who think in areas rather than topics. Areas group related obligations regardless of which topic they sit under.",
                            CountRows(Filter(colAllFunctions, su_area = gblAreaScreenSel)) &
                                " functions in this compliance area."
                        )

            # ---- area tiles --------------------------------------------------
            - gal_Areas:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                    X: =64
                    Y: =286
                    Width: =Parent.Width - 128
                    Height: =Parent.Height - 330
                    TemplateSize: =(Parent.Width - 128) / 4 - 4
                    TemplatePadding: =16
                    WrapCount: =4
                    ShowScrollbar: =true
                    Visible: =IsBlank(gblAreaScreenSel)
                    Items: =Sort(Distinct(colAllFunctions, su_area), Value, SortOrder.Ascending)
                Children:
                    - rec_AreaCard:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth
                            Height: =140
                            Fill: =gblTheme.White
                            BorderColor: =gblTheme.Border
                            BorderThickness: =1
                            BorderRadius: =5
                    - rec_AreaCardBar:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth
                            Height: =5
                            Fill: =gblTheme.Orange
                            BorderThickness: =0
                    - lbl_AreaCardTopic:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =18
                            Width: =Parent.TemplateWidth - 32
                            Height: =18
                            # An area can appear under more than one topic; show the
                            # topic of the first matching row as orientation only.
                            Text: |
                                =Upper(
                                    LookUp(colAllFunctions, su_area = ThisItem.Value).su_topic.su_name
                                )
                            Color: =gblTheme.OrangeDark
                            Size: =7
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - lbl_AreaCardName:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =38
                            Width: =Parent.TemplateWidth - 32
                            Height: =56
                            Text: =ThisItem.Value
                            Color: =gblTheme.Navy
                            Size: =12
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontDisplay
                    - lbl_AreaCardCount:
                        Control: Label@2.5.1
                        Properties:
                            X: =16
                            Y: =102
                            Width: =Parent.TemplateWidth - 32
                            Height: =24
                            Text: |
                                =With(
                                    {n: CountRows(Filter(colAllFunctions, su_area = ThisItem.Value))},
                                    n & If(n = 1, " function", " functions")
                                )
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Font: =gblTheme.FontBody
                    - btn_AreaCardOverlay:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth
                            Height: =140
                            Text: =""
                            Fill: =RGBA(0, 0, 0, 0)
                            HoverFill: =RGBA(0, 14, 84, 0.03)
                            BorderThickness: =0
                            OnSelect: =Set(gblAreaScreenSel, ThisItem.Value)

            # ---- functions in the selected area ------------------------------
            - gal_AreaFunctions:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                    X: =64
                    Y: =286
                    Width: =Parent.Width - 128
                    Height: =Parent.Height - 330
                    TemplateSize: =62
                    TemplatePadding: =0
                    ShowScrollbar: =true
                    Visible: =!IsBlank(gblAreaScreenSel)
                    Items: =Filter(colAllFunctions, su_area = gblAreaScreenSel)
                Children:
                    - lbl_AfName:
                        Control: Label@2.5.1
                        Properties:
                            X: =14
                            Y: =10
                            Width: =Parent.TemplateWidth - 320
                            Height: =22
                            Text: =ThisItem.su_name
                            Color: =gblTheme.Navy
                            Size: =11
                            FontWeight: =FontWeight.Semibold
                            Font: =gblTheme.FontBody
                    - lbl_AfSub:
                        Control: Label@2.5.1
                        Properties:
                            X: =14
                            Y: =32
                            Width: =Parent.TemplateWidth - 320
                            Height: =18
                            Text: |
                                =ThisItem.su_topic.su_name & "  |  " & ThisItem.su_functioncode
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Font: =gblTheme.FontBody
                    - lbl_AfOwner:
                        Control: Label@2.5.1
                        Properties:
                            X: =Parent.TemplateWidth - 290
                            Y: =10
                            Width: =180
                            Height: =40
                            Text: |
                                =ThisItem.su_complianceowner.su_name & Char(10) &
                                 ThisItem.su_complianceowner.su_unit
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Font: =gblTheme.FontBody
                    - cmp_AfRisk:
                        Control: Component
                        ComponentName: cmp_RiskPill
                        Properties:
                            X: =Parent.TemplateWidth - 96
                            Y: =19
                            Width: =74
                            Height: =24
                            Risk: |
                                =Switch(
                                    ThisItem.su_risk,
                                    'Risk Level'.Critical, "Critical",
                                    'Risk Level'.High,     "High",
                                    'Risk Level'.Medium,   "Medium",
                                    "Low"
                                )
                    - rec_AfRule:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =61
                            Width: =Parent.TemplateWidth
                            Height: =1
                            Fill: =gblTheme.BorderSoft
                            BorderThickness: =0
                    - btn_AfOverlay:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth
                            Height: =62
                            Text: =""
                            Fill: =RGBA(0, 0, 0, 0)
                            HoverFill: =RGBA(0, 14, 84, 0.03)
                            BorderThickness: =0
                            OnSelect: |
                                =Set(gblSelectedFunction, ThisItem);
                                Navigate(scr_FunctionDetail, ScreenTransition.None)
