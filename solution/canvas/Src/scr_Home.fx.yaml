# =============================================================================
# Home - the way in for every audience
# =============================================================================
# Answers the question the hero asks: who is responsible for what, and are we
# on top of it. Three bands:
#   1. hero with the matrix-wide search
#   2. institution figures (functions, risk areas, due in 90 days, past due)
#   3. six destination cards, then the signed-in user's own assignments
#
# Counts are aggregated server-side with CountRows(Filter(...)) rather than
# pulled into collections, so they stay accurate at the full matrix size.
# =============================================================================

Screens:

    scr_Home:
        Properties:
            Fill: =gblTheme.White
            OnVisible: |
                =// Deadline windows used by the figures band and the assignment rail.
                Set(gblHomeUpcoming90,
                    CountRows(
                        Filter(
                            'Compliance Deadlines',
                            su_complete = false,
                            su_duedate >= gblToday,
                            su_duedate <= DateAdd(gblToday, 90, TimeUnit.Days)
                        )
                    )
                );
                Set(gblHomeOverdue,
                    CountRows(
                        Filter(
                            'Compliance Deadlines',
                            su_complete = false,
                            su_duedate < gblToday
                        )
                    )
                );
                Set(gblOpenGapCount,
                    CountRows(
                        Filter('Compliance Gaps', su_status <> 'Gap Status'.Closed)
                    )
                );
                Set(gblFunctionCount, CountRows('Compliance Functions'));

                // "Assigned to you" spans all three tiers of the ownership chain,
                // so it reads from the junction table rather than the three fixed
                // lookups. Blank directory row means nothing is assigned.
                ClearCollect(
                    colMyFunctions,
                    If(
                        IsBlank(gblMe),
                        Blank(),
                        ShowColumns(
                            Filter(
                                'Function Ownership',
                                su_person.su_compliancedirectoryid = gblMe.su_compliancedirectoryid
                            ),
                            "su_function"
                        )
                    )
                );
                // Assessments this person owns, so "assigned to you" reflects
                // the review work as well as the obligations.
                ClearCollect(
                    colMyAssessments,
                    If(
                        IsBlank(gblMe),
                        Blank(),
                        Filter(
                            'Assessment Owners',
                            su_person.su_compliancedirectoryid
                                = gblMe.su_compliancedirectoryid
                        )
                    )
                );
                ClearCollect(
                    colMyDeadlines,
                    FirstN(
                        SortByColumns(
                            Filter(
                                'Compliance Deadlines',
                                su_complete = false,
                                su_owner.su_compliancedirectoryid = gblMe.su_compliancedirectoryid
                            ),
                            "su_duedate",
                            SortOrder.Ascending
                        ),
                        4
                    )
                );

        Children:

            - cmp_HeaderHome:
                Control: Component
                ComponentName: cmp_Header
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =104
                    ActiveScreen: ="Home"
                    OpenGapCount: =gblOpenGapCount

            # ---- scrolling body -------------------------------------------
            - cnt_HomeScroll:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                    X: =0
                    Y: =104
                    Width: =Parent.Width
                    Height: =Parent.Height - 104
                    Fill: =gblTheme.White
                Children:

                    # ---- hero --------------------------------------------
                    - rec_HeroBg:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.Width
                            Height: =352
                            Fill: =gblTheme.Navy
                            BorderThickness: =0
                    - lbl_HeroEyebrow:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =40
                            Width: =700
                            Height: =20
                            Text: ="OFFICE OF COMPLIANCE AND ENTERPRISE RISK MANAGEMENT"
                            Color: =gblTheme.OrangeLight
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - lbl_HeroTitle:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =68
                            Width: =620
                            Height: =136
                            Text: |
                                ="Who is responsible for what " & Char(10) & "and are we on top of it."
                            Color: =gblTheme.White
                            Size: =36
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontDisplay
                    - lbl_HeroLede:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =210
                            Width: =600
                            Height: =56
                            Text: |
                                ="The Compliance Matrix maps every obligation Syracuse University carries to its owner, the law behind it, what it requires, when it is due, and the risk it carries."
                            Color: =RGBA(199, 210, 234, 1)
                            Size: =11
                            Font: =gblTheme.FontBody
                    - txt_HeroSearch:
                        Control: Classic/TextInput@2.3.2
                        Properties:
                            X: =64
                            Y: =278
                            Width: =470
                            Height: =46
                            Default: =""
                            HintText: ="Search a function, statute, citation, or owner"
                            BorderColor: =RGBA(255, 255, 255, 0.25)
                            BorderThickness: =1
                            Fill: =RGBA(255, 255, 255, 0.08)
                            Color: =gblTheme.White
                            HoverBorderColor: =gblTheme.Orange
                            FocusedBorderColor: =gblTheme.Orange
                            FocusedBorderThickness: =2
                            Size: =11
                            Font: =gblTheme.FontBody
                    - btn_HeroSearch:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =542
                            Y: =278
                            Width: =120
                            Height: =46
                            Text: ="Search"
                            # Seeds the shared filter record, then hands off to the
                            # Functions screen which owns all filtering.
                            OnSelect: |
                                =Set(
                                    gblFilter,
                                    {
                                        Query: txt_HeroSearch.Text,
                                        Topic: "All",
                                        Risk: "All",
                                        Area: "All"
                                    }
                                );
                                Navigate(scr_Functions, ScreenTransition.None)
                            Fill: =gblTheme.Orange
                            HoverFill: =gblTheme.OrangeMedium
                            PressedFill: =gblTheme.OrangeDark
                            Color: =gblTheme.White
                            BorderThickness: =0
                            Size: =11
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - img_HeroBlockS:
                        Control: Image@2.2.3
                        Properties:
                            X: =Parent.Width - 330
                            Y: =46
                            Width: =260
                            Height: =260
                            Image: |
                                ="data:image/svg+xml;utf8, " & EncodeUrl(
                                    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'>
                                       <text x='50' y='90' font-family='Georgia,serif' font-size='110'
                                             font-weight='bold' fill='#F76900' opacity='0.92'
                                             text-anchor='middle'>S</text>
                                     </svg>"
                                )

                    # ---- figures band ------------------------------------
                    - rec_BandBg:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =352
                            Width: =Parent.Width
                            Height: =104
                            Fill: =gblTheme.Surface
                            BorderThickness: =0
                    - gal_Figures:
                        Control: Gallery@2.15.0
                        Variant: Horizontal
                        Properties:
                            X: =64
                            Y: =352
                            Width: =Parent.Width - 400
                            Height: =104
                            TemplateSize: =210
                            TemplatePadding: =0
                            ShowScrollbar: =false
                            Items: |
                                =Table(
                                    {FigValue: gblFunctionCount,   FigLabel: "Compliance functions", FigAlert: false},
                                    {FigValue: CountRows(colRiskAreas), FigLabel: "Risk areas",        FigAlert: false},
                                    {FigValue: gblHomeUpcoming90,  FigLabel: "Due within 90 days",   FigAlert: false},
                                    {FigValue: gblHomeOverdue,     FigLabel: "Past due today",       FigAlert: true}
                                )
                        Children:
                            - lbl_FigValue:
                                Control: Label@2.5.1
                                Properties:
                                    X: =0
                                    Y: =20
                                    Width: =Parent.TemplateWidth - 20
                                    Height: =44
                                    Text: =ThisItem.FigValue
                                    Color: |
                                        =If(
                                            ThisItem.FigAlert && ThisItem.FigValue > 0,
                                            gblTheme.High,
                                            gblTheme.Navy
                                        )
                                    Size: =28
                                    FontWeight: =FontWeight.Bold
                                    Font: =gblTheme.FontDisplay
                            - lbl_FigLabel:
                                Control: Label@2.5.1
                                Properties:
                                    X: =0
                                    Y: =64
                                    Width: =Parent.TemplateWidth - 20
                                    Height: =20
                                    Text: =ThisItem.FigLabel
                                    Color: =gblTheme.GrayMid
                                    Size: =9
                                    Font: =gblTheme.FontBody
                    - lbl_AsOf:
                        Control: Label@2.5.1
                        Properties:
                            X: =Parent.Width - 300
                            Y: =374
                            Width: =236
                            Height: =60
                            # Fiscal year starts July 1, so Q1 is Jul-Sep.
                            Text: |
                                ="As of " & Text(gblToday, "mmm d, yyyy") & Char(10) &
                                 "FY" & Text(
                                     If(Month(gblToday) >= gblFiscalStartMonth,
                                        Year(gblToday) + 1,
                                        Year(gblToday)),
                                     "00"
                                 ) & " Q" & (RoundDown(Mod(Month(gblToday) + 5, 12) / 3, 0) + 1)
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Align: =Align.Right
                            Font: =gblTheme.FontBody

                    # ---- destination cards -------------------------------
                    - lbl_StartHere:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =492
                            Width: =400
                            Height: =24
                            Text: ="START HERE"
                            Color: =gblTheme.OrangeDark
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - gal_Destinations:
                        Control: Gallery@2.15.0
                        Variant: Horizontal
                        Properties:
                            X: =64
                            Y: =524
                            Width: =Parent.Width - 128
                            Height: =340
                            TemplateSize: =(Parent.Width - 128) / 3 - 2
                            TemplatePadding: =16
                            WrapCount: =3
                            ShowScrollbar: =false
                            Items: |
                                =Table(
                                    {
                                        DestKey: "Functions",
                                        DestTitle: "Compliance Functions",
                                        DestBody: "Every obligation in the matrix with statute, owner, requirement, and risk rating.",
                                        DestMeta: gblFunctionCount & " records"
                                    },
                                    {
                                        DestKey: "RiskAreas",
                                        DestTitle: "Risk Areas",
                                        DestBody: "Browse by risk area, then domain, then the functions inside.",
                                        DestMeta: CountRows(colRiskAreas) & " risk areas"
                                    },
                                    {
                                        DestKey: "Domains",
                                        DestTitle: "Domains",
                                        DestBody: "See obligations grouped by domain, including domains with no coverage yet.",
                                        DestMeta: "By unit"
                                    },
                                    {
                                        DestKey: "Deadlines",
                                        DestTitle: "Deadlines",
                                        DestBody: "Filings, certifications, and reports on the calendar, with automatic reminders.",
                                        DestMeta: gblHomeUpcoming90 & " in 90 days"
                                    },
                                    {
                                        DestKey: "Directory",
                                        DestTitle: "Owner Directory",
                                        DestBody: "Every compliance owner, unit owner, and executive sponsor in the matrix.",
                                        DestMeta: "Contacts"
                                    },
                                    {
                                        DestKey: "RiskDashboard",
                                        DestTitle: "Risk Dashboard",
                                        DestBody: "Risk concentration by topic and unit, gap trends, and executive reporting.",
                                        DestMeta: If(gblIsAdmin, "Administrator", "Restricted")
                                    }
                                )
                        Children:
                            - rec_DestCard:
                                Control: Classic/Button@2.2.0
                                Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =150
                                    Fill: =gblTheme.White
                                    BorderColor: =gblTheme.Border
                                    BorderThickness: =1
                                    BorderRadius: =5
                                    Text: =""
                                    OnSelect: =false
                                    HoverFill: =Self.Fill
                                    PressedFill: =Self.Fill
                                    HoverBorderColor: =Self.BorderColor
                                    PressedBorderColor: =Self.BorderColor
                                    FocusedBorderThickness: =0
                                    TabIndex: =-1
                            - rec_DestAccent:
                                Control: Rectangle@2.3.0
                                Properties:
                                    X: =0
                                    Y: =0
                                    Width: =4
                                    Height: =150
                                    Fill: =gblTheme.Orange
                                    BorderThickness: =0
                            - lbl_DestTitle:
                                Control: Label@2.5.1
                                Properties:
                                    X: =20
                                    Y: =18
                                    Width: =Parent.TemplateWidth - 40
                                    Height: =26
                                    Text: =ThisItem.DestTitle
                                    Color: =gblTheme.Navy
                                    Size: =13
                                    FontWeight: =FontWeight.Bold
                                    Font: =gblTheme.FontDisplay
                            - lbl_DestBody:
                                Control: Label@2.5.1
                                Properties:
                                    X: =20
                                    Y: =48
                                    Width: =Parent.TemplateWidth - 40
                                    Height: =58
                                    Text: =ThisItem.DestBody
                                    Color: =gblTheme.GrayMid
                                    Size: =10
                                    Font: =gblTheme.FontBody
                            - lbl_DestMeta:
                                Control: Label@2.5.1
                                Properties:
                                    X: =20
                                    Y: =112
                                    Width: =Parent.TemplateWidth - 40
                                    Height: =22
                                    Text: =ThisItem.DestMeta
                                    Color: =gblTheme.OrangeDark
                                    Size: =9
                                    FontWeight: =FontWeight.Bold
                                    Font: =gblTheme.FontBody
                            - btn_DestOverlay:
                                Control: Classic/Button@2.2.0
                                Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =150
                                    Text: =""
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =RGBA(0, 14, 84, 0.03)
                                    PressedFill: =RGBA(0, 14, 84, 0.07)
                                    BorderThickness: =0
                                    OnSelect: |
                                        =Switch(
                                            ThisItem.DestKey,
                                            "Functions",     Navigate(scr_Functions, ScreenTransition.None),
                                            "RiskAreas",     Navigate(scr_RiskAreas, ScreenTransition.None),
                                            "Domains",       Navigate(scr_Domains, ScreenTransition.None),
                                            "Deadlines",     Navigate(scr_Deadlines, ScreenTransition.None),
                                            "Directory",     Navigate(scr_Directory, ScreenTransition.None),
                                            "RiskDashboard", Navigate(scr_RiskDashboard, ScreenTransition.None)
                                        )

                    # ---- assigned to you ---------------------------------
                    - lbl_AssignedHead:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =900
                            Width: =500
                            Height: =24
                            Text: ="ASSIGNED TO YOU"
                            Color: =gblTheme.OrangeDark
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - lbl_AssignedWho:
                        Control: Label@2.5.1
                        Properties:
                            X: =Parent.Width - 500
                            Y: =900
                            Width: =436
                            Height: =24
                            Text: |
                                =Coalesce(gblMe.su_name, User().FullName) & "  |  " &
                                 Switch(
                                     gblRole,
                                     'Application Role'.Administrator, "Administrator",
                                     'Application Role'.Executive,     "Executive",
                                     "Compliance Owner"
                                 ) &
                                 If(
                                     CountRows(colMyAssessments) = 0,
                                     "",
                                     "  |  " & CountRows(colMyAssessments) & " assessment(s)"
                                 )
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Align: =Align.Right
                            Font: =gblTheme.FontBody
                    - gal_MyFunctions:
                        Control: Gallery@2.15.0
                        Variant: Vertical
                        Properties:
                            X: =64
                            Y: =932
                            Width: =(Parent.Width - 144) * 0.6
                            Height: =290
                            TemplateSize: =58
                            TemplatePadding: =0
                            ShowScrollbar: =true
                            Items: |
                                =FirstN(
                                    Distinct(colMyFunctions, su_function),
                                    5
                                )
                        Children:
                            - lbl_MyFnName:
                                Control: Label@2.5.1
                                Properties:
                                    X: =14
                                    Y: =8
                                    Width: =Parent.TemplateWidth - 200
                                    Height: =22
                                    Text: =ThisItem.Value.su_name
                                    Color: =gblTheme.Navy
                                    Size: =11
                                    FontWeight: =FontWeight.Semibold
                                    Font: =gblTheme.FontBody
                            - lbl_MyFnSub:
                                Control: Label@2.5.1
                                Properties:
                                    X: =14
                                    Y: =30
                                    Width: =Parent.TemplateWidth - 200
                                    Height: =18
                                    Text: |
                                        =ThisItem.Value.su_riskarea.su_name & "  |  " & ThisItem.Value.su_domain.su_name
                                    Color: =gblTheme.GrayMid
                                    Size: =9
                                    Font: =gblTheme.FontBody
                            - cmp_MyFnRisk:
                                Control: Component
                                ComponentName: cmp_RiskPill
                                Properties:
                                    X: =Parent.TemplateWidth - 96
                                    Y: =17
                                    Width: =74
                                    Height: =24
                                    Risk: |
                                        =Switch(
                                            ThisItem.Value.su_risk,
                                            'Risk Level'.High,     "High",
                                            'Risk Level'.Moderate,   "Moderate",
                                            'Risk Level'.Low,      "Low",
                                            ""
                                        )
                            - lbl_MyFnGapBadge:
                                Control: Label@2.5.1
                                Properties:
                                    X: =Parent.TemplateWidth - 132
                                    Y: =17
                                    Width: =28
                                    Height: =24
                                    Text: =ThisItem.Value.su_opengapcount
                                    Visible: =ThisItem.Value.su_opengapcount > 0
                                    Fill: =gblTheme.High
                                    Color: =gblTheme.White
                                    Size: =9
                                    FontWeight: =FontWeight.Bold
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Font: =gblTheme.FontBody
                            - rec_MyFnRule:
                                Control: Rectangle@2.3.0
                                Properties:
                                    X: =0
                                    Y: =57
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                                    Fill: =gblTheme.BorderSoft
                                    BorderThickness: =0
                            - btn_MyFnOverlay:
                                Control: Classic/Button@2.2.0
                                Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =58
                                    Text: =""
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =RGBA(0, 14, 84, 0.03)
                                    PressedFill: =RGBA(0, 14, 84, 0.07)
                                    BorderThickness: =0
                                    OnSelect: |
                                        =Set(gblSelectedFunction, ThisItem.Value);
                                        Navigate(scr_FunctionDetail, ScreenTransition.None)
                    - lbl_NothingAssigned:
                        Control: Label@2.5.1
                        Properties:
                            X: =64
                            Y: =990
                            Width: =(Parent.Width - 144) * 0.6
                            Height: =60
                            Text: |
                                ="Nothing assigned" & Char(10) &
                                 "No functions list you in the ownership chain."
                            Color: =gblTheme.GrayMid
                            Size: =11
                            Align: =Align.Center
                            Font: =gblTheme.FontBody
                            Visible: =CountRows(colMyFunctions) = 0

                    # ---- next deadlines rail -----------------------------
                    - rec_DeadlineRail:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =64 + (Parent.Width - 144) * 0.6 + 16
                            Y: =932
                            Width: =(Parent.Width - 144) * 0.4 - 16
                            Height: =290
                            Fill: =gblTheme.White
                            BorderColor: =gblTheme.Border
                            BorderThickness: =1
                            BorderRadius: =5
                            Text: =""
                            OnSelect: =false
                            HoverFill: =Self.Fill
                            PressedFill: =Self.Fill
                            HoverBorderColor: =Self.BorderColor
                            PressedBorderColor: =Self.BorderColor
                            FocusedBorderThickness: =0
                            TabIndex: =-1
                    - lbl_RailHead:
                        Control: Label@2.5.1
                        Properties:
                            X: =80 + (Parent.Width - 144) * 0.6 + 16
                            Y: =948
                            Width: =260
                            Height: =20
                            Text: ="YOUR NEXT DEADLINES"
                            Color: =gblTheme.OrangeDark
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - gal_MyDeadlines:
                        Control: Gallery@2.15.0
                        Variant: Vertical
                        Properties:
                            X: =80 + (Parent.Width - 144) * 0.6 + 16
                            Y: =976
                            Width: =(Parent.Width - 144) * 0.4 - 48
                            Height: =176
                            TemplateSize: =58
                            TemplatePadding: =0
                            ShowScrollbar: =true
                            Items: =colMyDeadlines
                        Children:
                            - lbl_DlTitle:
                                Control: Label@2.5.1
                                Properties:
                                    X: =0
                                    Y: =6
                                    Width: =Parent.TemplateWidth - 116
                                    Height: =20
                                    Text: =ThisItem.su_name
                                    Color: =gblTheme.Navy
                                    Size: =10
                                    FontWeight: =FontWeight.Semibold
                                    Font: =gblTheme.FontBody
                            - lbl_DlSub:
                                Control: Label@2.5.1
                                Properties:
                                    X: =0
                                    Y: =26
                                    Width: =Parent.TemplateWidth - 116
                                    Height: =28
                                    Text: |
                                        =Text(ThisItem.su_duedate, "mmm d, yyyy") & "  |  " &
                                         ThisItem.su_function.su_name
                                    Color: =gblTheme.GrayMid
                                    Size: =9
                                    Font: =gblTheme.FontBody
                            - cmp_DlPill:
                                Control: Component
                                ComponentName: cmp_DuePill
                                Properties:
                                    X: =Parent.TemplateWidth - 108
                                    Y: =16
                                    Width: =104
                                    Height: =24
                                    DueDate: =ThisItem.su_duedate
                                    IsComplete: =ThisItem.su_complete
                            - btn_DlOverlay:
                                Control: Classic/Button@2.2.0
                                Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =58
                                    Text: =""
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =RGBA(0, 14, 84, 0.03)
                                    PressedFill: =RGBA(0, 14, 84, 0.07)
                                    BorderThickness: =0
                                    OnSelect: |
                                        =Set(gblSelectedFunction, ThisItem.su_function);
                                        Navigate(scr_FunctionDetail, ScreenTransition.None)
                    - lbl_RailNote:
                        Control: Label@2.5.1
                        Properties:
                            X: =80 + (Parent.Width - 144) * 0.6 + 16
                            Y: =1158
                            Width: =(Parent.Width - 144) * 0.4 - 48
                            Height: =48
                            Text: |
                                ="Reminders are sent automatically at 90 days, 30 days, on the due date, and weekly once overdue."
                            Color: =gblTheme.GrayMid
                            Size: =9
                            Font: =gblTheme.FontBody
