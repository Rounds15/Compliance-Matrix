ComponentDefinitions:

    cmp_Header:
        DefinitionType: CanvasComponent
        Description: "University utility bar, lockup, and primary navigation."
        AllowCustomization: true
        AccessAppScope: false
        CustomProperties:
            ActiveScreen:
                PropertyKind: Input
                DisplayName: Active Screen
                DataType: Text
                Default: ="Home"
            OpenGapCount:
                PropertyKind: Input
                DisplayName: Open Gap Count
                DataType: Number
                Default: =0
        Properties:
            Height: =104
            Width: =1366
            Fill: =RGBA(0, 0, 0, 0)
        Children:
            - rec_UtilBar:
                Control: Rectangle@2.3.0
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =32
                    Fill: =gblTheme.Navy
                    BorderThickness: =0
            - btn_Syracuse:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =Parent.Width - 470
                    Y: =0
                    Width: =110
                    Height: =32
                    Text: ="Syracuse.edu"
                    OnSelect: =Launch("https://www.syracuse.edu")
                    Fill: =RGBA(0, 0, 0, 0)
                    HoverFill: =RGBA(255, 255, 255, 0.08)
                    PressedFill: =RGBA(255, 255, 255, 0.15)
                    Color: =RGBA(199, 210, 234, 1)
                    HoverColor: =gblTheme.White
                    PressedColor: =gblTheme.White
                    BorderThickness: =0
                    Size: =9
                    Font: =gblTheme.FontBody
            - btn_Policies:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =Parent.Width - 360
                    Y: =0
                    Width: =80
                    Height: =32
                    Text: ="Policies"
                    OnSelect: =Launch("https://policies.syr.edu")
                    Fill: =RGBA(0, 0, 0, 0)
                    HoverFill: =RGBA(255, 255, 255, 0.08)
                    PressedFill: =RGBA(255, 255, 255, 0.15)
                    Color: =RGBA(199, 210, 234, 1)
                    HoverColor: =gblTheme.White
                    PressedColor: =gblTheme.White
                    BorderThickness: =0
                    Size: =9
                    Font: =gblTheme.FontBody
            - btn_ReportConcern:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =Parent.Width - 280
                    Y: =0
                    Width: =140
                    Height: =32
                    Text: ="Report a Concern"
                    OnSelect: =Launch("https://compliance.syr.edu")
                    Fill: =RGBA(0, 0, 0, 0)
                    HoverFill: =RGBA(255, 255, 255, 0.08)
                    PressedFill: =RGBA(255, 255, 255, 0.15)
                    Color: =gblTheme.OrangeLight
                    HoverColor: =gblTheme.White
                    PressedColor: =gblTheme.White
                    BorderThickness: =0
                    Size: =9
                    FontWeight: =FontWeight.Semibold
                    Font: =gblTheme.FontBody
            - lbl_RoleBadge:
                Control: Label@2.5.1
                Properties:
                    X: =Parent.Width - 140
                    Y: =0
                    Width: =132
                    Height: =32
                    Text: |
                        ="Signed in as " & Switch(
                            gblRole,
                            'Application Role'.Administrator,      "Administrator",
                            'Application Role'.Executive,          "Executive",
                            "Compliance Owner"
                        )
                    Color: =RGBA(199, 210, 234, 1)
                    Size: =8
                    Align: =Align.Right
                    VerticalAlign: =VerticalAlign.Middle
                    Font: =gblTheme.FontBody

            - rec_HeaderBg:
                Control: Rectangle@2.3.0
                Properties:
                    X: =0
                    Y: =32
                    Width: =Parent.Width
                    Height: =72
                    Fill: =gblTheme.White
                    BorderThickness: =0
            - rec_HeaderRule:
                Control: Rectangle@2.3.0
                Properties:
                    X: =0
                    Y: =101
                    Width: =Parent.Width
                    Height: =3
                    Fill: =gblTheme.Orange
                    BorderThickness: =0
            - img_BlockS:
                Control: Image@2.2.3
                Properties:
                    X: =28
                    Y: =46
                    Width: =40
                    Height: =44
                    Image: |
                        ="data:image/svg+xml;utf8, " & EncodeUrl(
                            "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'>
                               <text x='50' y='88' font-family='Georgia,serif' font-size='104'
                                     font-weight='bold' fill='#F76900' text-anchor='middle'>S</text>
                             </svg>"
                        )
            - btn_HomeLockup:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =28
                    Y: =40
                    Width: =260
                    Height: =56
                    Text: =""
                    OnSelect: =Navigate(scr_Home, ScreenTransition.None)
                    Fill: =RGBA(0, 0, 0, 0)
                    HoverFill: =RGBA(0, 14, 84, 0.04)
                    PressedFill: =RGBA(0, 14, 84, 0.08)
                    BorderThickness: =0
                    Tooltip: ="Home"
            - lbl_University:
                Control: Label@2.5.1
                Properties:
                    X: =78
                    Y: =44
                    Width: =210
                    Height: =20
                    Text: ="Syracuse University"
                    Color: =gblTheme.GrayMid
                    Size: =9
                    FontWeight: =FontWeight.Semibold
                    Font: =gblTheme.FontBody
                    DisplayMode: =DisplayMode.View
            - lbl_AppName:
                Control: Label@2.5.1
                Properties:
                    X: =78
                    Y: =62
                    Width: =210
                    Height: =28
                    Text: ="Compliance Matrix"
                    Color: =gblTheme.Navy
                    Size: =16
                    FontWeight: =FontWeight.Bold
                    Font: =gblTheme.FontDisplay
                    DisplayMode: =DisplayMode.View

            - gal_Nav:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                    X: =330
                    Y: =46
                    Width: =Parent.Width - 360
                    Height: =44
                    TemplateSize: =128
                    TemplatePadding: =0
                    ShowScrollbar: =false
                    Items: |
                        =Filter(
                            Table(
                                {NavKey: "Home",           NavLabel: "Home",           NavAdmin: false},
                                {NavKey: "Functions",      NavLabel: "Functions",      NavAdmin: false},
                                {NavKey: "RiskAreas",      NavLabel: "Risk Areas",     NavAdmin: false},
                                {NavKey: "Domains",        NavLabel: "Domains",        NavAdmin: false},
                                {NavKey: "Deadlines",      NavLabel: "Deadlines",      NavAdmin: false},
                                {NavKey: "Directory",      NavLabel: "Directory",      NavAdmin: false},
                                {NavKey: "ExecutiveTeam",  NavLabel: "Executive Team", NavAdmin: false},
                                {NavKey: "Assessments",    NavLabel: "Assessments",    NavAdmin: true},
                                {NavKey: "GapTracker",     NavLabel: "Gap Tracker",    NavAdmin: true},
                                {NavKey: "RiskDashboard",  NavLabel: "Risk Dashboard", NavAdmin: true},
                                {NavKey: "Reporting",      NavLabel: "Reporting",      NavAdmin: true}
                            ),
                            !NavAdmin || gblIsAdmin
                        )
                Children:
                    - lbl_NavItem:
                        Control: Label@2.5.1
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth
                            Height: =40
                            Text: =ThisItem.NavLabel
                            Color: |
                                =If(
                                    ThisItem.NavKey = cmp_Header.ActiveScreen,
                                    gblTheme.Navy,
                                    gblTheme.GrayDark
                                )
                            Size: =10
                            FontWeight: |
                                =If(
                                    ThisItem.NavKey = cmp_Header.ActiveScreen,
                                    FontWeight.Bold,
                                    FontWeight.Semibold
                                )
                            Align: =Align.Center
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
                    - lbl_NavGapBadge:
                        Control: Label@2.5.1
                        Properties:
                            X: =Parent.TemplateWidth - 30
                            Y: =2
                            Width: =24
                            Height: =18
                            Text: =cmp_Header.OpenGapCount
                            Visible: |
                                =ThisItem.NavKey = "GapTracker"
                                    && cmp_Header.OpenGapCount > 0
                            Fill: =gblTheme.High
                            Color: =gblTheme.White
                            Size: =8
                            FontWeight: =FontWeight.Bold
                            Align: =Align.Center
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
                    - rec_NavActive:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =18
                            Y: =38
                            Width: =Parent.TemplateWidth - 36
                            Height: =3
                            Fill: =gblTheme.Orange
                            BorderThickness: =0
                            Visible: =ThisItem.NavKey = cmp_Header.ActiveScreen
                    - btn_NavOverlay:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =Parent.TemplateWidth
                            Height: =44
                            Text: =""
                            Fill: =RGBA(0, 0, 0, 0)
                            HoverFill: =RGBA(0, 14, 84, 0.04)
                            PressedFill: =RGBA(0, 14, 84, 0.08)
                            BorderThickness: =0
                            OnSelect: |
                                =Switch(
                                    ThisItem.NavKey,
                                    "Home",          Navigate(scr_Home, ScreenTransition.None),
                                    "Functions",     Navigate(scr_Functions, ScreenTransition.None),
                                    "RiskAreas",     Navigate(scr_RiskAreas, ScreenTransition.None),
                                    "Domains",       Navigate(scr_Domains, ScreenTransition.None),
                                    "Deadlines",     Navigate(scr_Deadlines, ScreenTransition.None),
                                    "Directory",     Navigate(scr_Directory, ScreenTransition.None),
                                    "ExecutiveTeam", Navigate(scr_ExecutiveTeam, ScreenTransition.None),
                                    "Assessments",   Navigate(scr_Assessments, ScreenTransition.None),
                                    "GapTracker",    Navigate(scr_GapTracker, ScreenTransition.None),
                                    "RiskDashboard", Navigate(scr_RiskDashboard, ScreenTransition.None),
                                    "Reporting",     Navigate(scr_Reporting, ScreenTransition.None)
                                )
