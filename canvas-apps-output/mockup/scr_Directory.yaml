
Screens:

    scr_Directory:
        Properties:
            Fill: =RGBA(247, 247, 248, 1)
            OnVisible: |
                =Set(gblMenu, "");
                Set(gblDirQuery, "");
                Set(gblDirSel, Blank())
        Children:

            - bodyGrid:
                Control: FluidGrid@2.3.0
                Properties:
                    AcceptsFocus: =true
                    BorderThickness: =0
                    X: =0
                    Y: =112
                    Width: =Parent.Width
                    Height: =656
                Children:

                    - HeadCard:
                        Control: DataCard@1.0.2
                        Variant: BlankCard
                        Properties:
                            Height: =308
                            Width: =1366
                            WidthFit: =true
                            X: =0
                            Y: =0
                        Children:

                            - cnt_Head:
                                Control: GroupContainer@1.5.0
                                Variant: ManualLayout
                                Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.Width
                                    Height: =Parent.Height
                                    Fill: =RGBA(247, 247, 248, 1)
                                Children:

                                    - lbl_Eyebrow:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =51
                                            Y: =24
                                            Width: =598
                                            Height: =20
                                            Text: ="BROWSE"
                                            Color: =gblTheme.OrangeDark
                                            Size: =10
                                            FontWeight: =FontWeight.Bold
                                            Font: =gblTheme.FontBody
                                    - lbl_Title:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =51
                                            Y: =52
                                            Width: =598
                                            Height: =50
                                            Text: ="Compliance Directory"
                                            Color: =gblTheme.Navy
                                            Size: =36
                                            FontWeight: =FontWeight.Bold
                                            Font: =gblTheme.FontDisplay
                                    - lbl_Sub:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =51
                                            Y: =110
                                            Width: =598
                                            Height: =60
                                            Text: |
                                                ="The people layer of the matrix: every owner, unit owner, and executive sponsor, with the portfolio each one carries."
                                            Color: =RGBA(59, 67, 88, 1)
                                            Size: =12
                                            Font: =gblTheme.FontBody
                                    - rec_HeadRule:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                            X: =51
                                            Y: =187
                                            Width: =Parent.Width - 102
                                            Height: =1
                                            Fill: =RGBA(221, 222, 226, 1)
                                            BorderThickness: =0
                                    - txt_Search:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                            X: =51
                                            Y: =227
                                            Width: =Parent.Width - 172
                                            Height: =50
                                            Default: =""
                                            HintText: ="Search a name, title, unit, or email"
                                            OnChange: =Set(gblDirQuery, txt_Search.Text)
                                            Fill: =gblTheme.White
                                            Color: =RGBA(59, 67, 88, 1)
                                            BorderColor: =RGBA(196, 199, 206, 1)
                                            BorderThickness: =1
                                            HoverBorderColor: =gblTheme.Orange
                                            FocusedBorderColor: =gblTheme.Orange
                                            FocusedBorderThickness: =2
                                            Size: =11
                                            Font: =gblTheme.FontBody
                                    - lbl_Count:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =Parent.Width - 113
                                            Y: =241
                                            Width: =62
                                            Height: =21
                                            Text: |
                                                =CountRows(
                                                    Filter(
                                                        dsDirectory,
                                                        IsBlank(gblDirQuery)
                                                            || gblDirQuery in su_name
                                                            || gblDirQuery in su_jobtitle
                                                            || gblDirQuery in su_unit
                                                            || gblDirQuery in su_email
                                                    )
                                                ) & " people"
                                            Color: =RGBA(107, 114, 128, 1)
                                            Size: =11
                                            Align: =Align.Right
                                            Font: =gblTheme.FontBody

                    - GridCard:
                        Control: DataCard@1.0.2
                        Variant: BlankCard
                        Properties:
                            Height: =1560
                            Width: =1366
                            WidthFit: =true
                            X: =0
                            Y: =1
                        Children:

                            - cnt_Grid:
                                Control: GroupContainer@1.5.0
                                Variant: ManualLayout
                                Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.Width
                                    Height: =Parent.Height
                                    Fill: =RGBA(247, 247, 248, 1)
                                Children:

                                    - gal_Directory:
                                        Control: Gallery@2.15.0
                                        Variant: Horizontal
                                        Properties:
                                            X: =51
                                            Y: =0
                                            Width: =Parent.Width - 102
                                            Height: =1530
                                            TemplateSize: =(Parent.Width - 102) / 4
                                            TemplatePadding: =0
                                            WrapCount: =4
                                            ShowScrollbar: =true
                                            Items: |
                                                =SortByColumns(
                                                    Filter(
                                                        dsDirectory,
                                                        IsBlank(gblDirQuery)
                                                            || gblDirQuery in su_name
                                                            || gblDirQuery in su_jobtitle
                                                            || gblDirQuery in su_unit
                                                            || gblDirQuery in su_email
                                                    ),
                                                    "su_name",
                                                    SortOrder.Ascending
                                                )
                                        Children:
                                            - rec_DirCard:
                                                Control: Rectangle@2.3.0
                                                Properties:
                                                    X: =0
                                                    Y: =0
                                                    Width: =Parent.TemplateWidth - 16
                                                    Height: =154
                                                    Fill: =gblTheme.White
                                                    BorderColor: =RGBA(221, 222, 226, 1)
                                                    BorderThickness: =1
                                            - lbl_DirAvatar:
                                                Control: Label@2.5.1
                                                Properties:
                                                    X: =17
                                                    Y: =28
                                                    Width: =44
                                                    Height: =44
                                                    Text: |
                                                        =Left(ThisItem.su_name, 1) &
                                                         Mid(ThisItem.su_name, Find(" ", ThisItem.su_name & " ") + 1, 1)
                                                    Fill: |
                                                        =Switch(
                                                            Mod(Len(ThisItem.su_name), 4),
                                                            0, RGBA( 15, 118, 110, 1),
                                                            1, RGBA(124,  58, 237, 1),
                                                            2, RGBA( 43, 114, 215, 1),
                                                            RGBA(32, 50, 153, 1)
                                                        )
                                                    Color: =gblTheme.White
                                                    Size: =13
                                                    FontWeight: =FontWeight.Bold
                                                    Align: =Align.Center
                                                    VerticalAlign: =VerticalAlign.Middle
                                                    Font: =gblTheme.FontBody
                                            - lbl_DirName:
                                                Control: Label@2.5.1
                                                Properties:
                                                    X: =72
                                                    Y: =28
                                                    Width: =Parent.TemplateWidth - 105
                                                    Height: =19
                                                    Text: =ThisItem.su_name
                                                    Color: =gblTheme.Navy
                                                    Size: =11
                                                    FontWeight: =FontWeight.Bold
                                                    Font: =gblTheme.FontBody
                                            - lbl_DirRole:
                                                Control: Label@2.5.1
                                                Properties:
                                                    X: =72
                                                    Y: =49
                                                    Width: =Parent.TemplateWidth - 105
                                                    Height: =20
                                                    Text: =ThisItem.su_jobtitle
                                                    Color: =RGBA(59, 67, 88, 1)
                                                    Size: =9
                                                    Font: =gblTheme.FontBody
                                            - lbl_DirUnit:
                                                Control: Label@2.5.1
                                                Properties:
                                                    X: =72
                                                    Y: =71
                                                    Width: =Parent.TemplateWidth - 105
                                                    Height: =21
                                                    Text: =ThisItem.su_unit
                                                    Color: =RGBA(107, 114, 128, 1)
                                                    Size: =11
                                                    Font: =gblTheme.FontBody
                                            - rec_DirChip:
                                                Control: Rectangle@2.3.0
                                                Properties:
                                                    X: =17
                                                    Y: =99
                                                    Width: =120
                                                    Height: =30
                                                    Fill: =gblTheme.White
                                                    BorderColor: =RGBA(196, 199, 206, 1)
                                                    BorderThickness: =1
                                            - lbl_DirChip:
                                                Control: Label@2.5.1
                                                Properties:
                                                    X: =17
                                                    Y: =99
                                                    Width: =120
                                                    Height: =30
                                                    Text: |
                                                        =With(
                                                            {
                                                                n: CountRows(
                                                                    Filter(
                                                                        dsOwnership,
                                                                        su_person.su_compliancedirectoryid
                                                                            = ThisItem.su_compliancedirectoryid
                                                                    )
                                                                )
                                                            },
                                                            n & If(n = 1, " function", " functions")
                                                        )
                                                    Color: =RGBA(59, 67, 88, 1)
                                                    Size: =10
                                                    Align: =Align.Center
                                                    VerticalAlign: =VerticalAlign.Middle
                                                    Font: =gblTheme.FontBody
                                            - btn_DirOverlay:
                                                Control: Classic/Button@2.2.0
                                                Properties:
                                                    X: =0
                                                    Y: =0
                                                    Width: =Parent.TemplateWidth - 16
                                                    Height: =154
                                                    Text: =""
                                                    Tooltip: =ThisItem.su_name & ". " & ThisItem.su_jobtitle
                                                    OnSelect: =Set(gblDirSel, ThisItem)
                                                    Fill: =RGBA(0, 0, 0, 0)
                                                    HoverFill: =RGBA(247, 105, 0, 0.06)
                                                    PressedFill: =RGBA(247, 105, 0, 0.12)
                                                    BorderThickness: =0

                    - FooterSlotCard:
                        Control: DataCard@1.0.2
                        Variant: BlankCard
                        Properties:
                            Height: =220
                            Width: =1366
                            WidthFit: =true
                            X: =0
                            Y: =2
                        Children:

                            - cnt_FooterSlot:
                                Control: GroupContainer@1.5.0
                                Variant: ManualLayout
                                Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.Width
                                    Height: =Parent.Height
                                    Fill: =RGBA(247, 247, 248, 1)
            - btn_Scrim:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =Parent.Height
                    Text: =""
                    Tooltip: ="Close"
                    Visible: =!IsBlank(gblDirSel)
                    OnSelect: =Set(gblDirSel, Blank())
                    Fill: =RGBA(0, 14, 84, 0.45)
                    HoverFill: =RGBA(0, 14, 84, 0.45)
                    PressedFill: =RGBA(0, 14, 84, 0.5)
                    BorderThickness: =0
            - cnt_DirDialog:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                    X: =(Parent.Width - 760) / 2
                    Y: =(Parent.Height - 580) / 2
                    Width: =760
                    Height: =580
                    Fill: =gblTheme.White
                    Visible: =!IsBlank(gblDirSel)
                Children:

                    - rec_DialogHead:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =760
                            Height: =104
                            Fill: =gblTheme.Navy
                            BorderThickness: =0
                    - lbl_DialogAvatar:
                        Control: Label@2.5.1
                        Properties:
                            X: =28
                            Y: =26
                            Width: =52
                            Height: =52
                            Text: |
                                =Left(gblDirSel.su_name, 1) &
                                 Mid(gblDirSel.su_name, Find(" ", gblDirSel.su_name & " ") + 1, 1)
                            Fill: =RGBA(32, 50, 153, 1)
                            Color: =gblTheme.White
                            Size: =16
                            FontWeight: =FontWeight.Bold
                            Align: =Align.Center
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
                    - lbl_DialogName:
                        Control: Label@2.5.1
                        Properties:
                            X: =96
                            Y: =22
                            Width: =600
                            Height: =32
                            Text: =gblDirSel.su_name
                            Color: =gblTheme.White
                            Size: =21
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontDisplay
                    - lbl_DialogTitle:
                        Control: Label@2.5.1
                        Properties:
                            X: =96
                            Y: =56
                            Width: =600
                            Height: =32
                            Text: =gblDirSel.su_jobtitle
                            Color: =RGBA(195, 204, 228, 1)
                            Size: =10
                            Font: =gblTheme.FontBody
                    - btn_DialogX:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =704
                            Y: =20
                            Width: =32
                            Height: =32
                            Text: ="X"
                            OnSelect: =Set(gblDirSel, Blank())
                            Fill: =RGBA(255, 255, 255, 0.1)
                            HoverFill: =RGBA(255, 255, 255, 0.2)
                            PressedFill: =RGBA(255, 255, 255, 0.3)
                            Color: =gblTheme.White
                            HoverColor: =gblTheme.White
                            PressedColor: =gblTheme.White
                            BorderThickness: =0
                            Size: =11
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - lbl_DialogContact:
                        Control: Label@2.5.1
                        Properties:
                            X: =28
                            Y: =124
                            Width: =704
                            Height: =84
                            Text: |
                                ="Unit          " & gblDirSel.su_unit & Char(10) &
                                 "Email        " & gblDirSel.su_email & Char(10) &
                                 "Location    " & Coalesce(gblDirSel.su_location, "Not recorded")
                            Color: =RGBA(59, 67, 88, 1)
                            Size: =10
                            Font: =gblTheme.FontBody
                    - lbl_PortfolioHead:
                        Control: Label@2.5.1
                        Properties:
                            X: =28
                            Y: =220
                            Width: =704
                            Height: =24
                            Text: ="PORTFOLIO"
                            Color: =gblTheme.OrangeDark
                            Size: =9
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - gal_Portfolio:
                        Control: Gallery@2.15.0
                        Variant: Vertical
                        Properties:
                            X: =28
                            Y: =248
                            Width: =704
                            Height: =250
                            TemplateSize: =58
                            TemplatePadding: =0
                            ShowScrollbar: =true
                            Items: |
                                =Filter(
                                    dsOwnership,
                                    su_person.su_compliancedirectoryid
                                        = gblDirSel.su_compliancedirectoryid
                                )
                        Children:
                            - lbl_PfName:
                                Control: Label@2.5.1
                                Properties:
                                    X: =8
                                    Y: =8
                                    Width: =Parent.TemplateWidth - 210
                                    Height: =22
                                    Text: =ThisItem.su_function.su_name
                                    Color: =gblTheme.Navy
                                    Size: =10
                                    FontWeight: =FontWeight.Semibold
                                    Font: =gblTheme.FontBody
                            - lbl_PfRole:
                                Control: Label@2.5.1
                                Properties:
                                    X: =8
                                    Y: =30
                                    Width: =Parent.TemplateWidth - 210
                                    Height: =18
                                    Text: |
                                        =ThisItem.su_role & "  |  " & ThisItem.su_subrole
                                    Color: =RGBA(107, 114, 128, 1)
                                    Size: =9
                                    Font: =gblTheme.FontBody
                            - lbl_PfRisk:
                                Control: Label@2.5.1
                                Properties:
                                    X: =Parent.TemplateWidth - 104
                                    Y: =16
                                    Width: =92
                                    Height: =26
                                    Text: |
                                        =If(
                                            IsBlank(ThisItem.su_function.su_risk),
                                            "UNRATED",
                                            Upper(ThisItem.su_function.su_risk)
                                        )
                                    Fill: |
                                        =Switch(
                                            ThisItem.su_function.su_risk,
                                            "High",     gblTheme.High,
                                            "Moderate", gblTheme.Moderate,
                                            "Low",      gblTheme.Low,
                                            gblTheme.Unrated
                                        )
                                    Color: =gblTheme.White
                                    Size: =9
                                    FontWeight: =FontWeight.Bold
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Font: =gblTheme.FontBody
                            - rec_PfRule:
                                Control: Rectangle@2.3.0
                                Properties:
                                    X: =0
                                    Y: =57
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                                    Fill: =RGBA(226, 229, 234, 1)
                                    BorderThickness: =0
                            - btn_PfOverlay:
                                Control: Classic/Button@2.2.0
                                Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =58
                                    Text: =""
                                    Tooltip: ="Open " & ThisItem.su_function.su_name
                                    OnSelect: |
                                        =Set(
                                            gblSelectedFunction,
                                            LookUp(
                                                dsFunctions,
                                                su_compliancefunctionid
                                                    = ThisItem.su_function.su_compliancefunctionid
                                            )
                                        );
                                        Set(gblDirSel, Blank());
                                        Navigate(scr_FunctionDetail, ScreenTransition.None)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =RGBA(247, 105, 0, 0.08)
                                    PressedFill: =RGBA(247, 105, 0, 0.15)
                                    BorderThickness: =0
                    - lbl_PortfolioEmpty:
                        Control: Label@2.5.1
                        Properties:
                            X: =28
                            Y: =340
                            Width: =704
                            Height: =40
                            Text: ="No functions list this person in the ownership chain."
                            Color: =RGBA(107, 114, 128, 1)
                            Size: =11
                            Align: =Align.Center
                            Font: =gblTheme.FontBody
                            Visible: |
                                =CountRows(
                                    Filter(
                                        dsOwnership,
                                        su_person.su_compliancedirectoryid
                                            = gblDirSel.su_compliancedirectoryid
                                    )
                                ) = 0
                    - btn_DialogEmail:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =28
                            Y: =520
                            Width: =180
                            Height: =40
                            Text: ="Email"
                            OnSelect: =Launch("mailto:" & gblDirSel.su_email)
                            Fill: =gblTheme.OrangeDark
                            HoverFill: =gblTheme.Orange
                            PressedFill: =RGBA(180, 55, 0, 1)
                            Color: =gblTheme.White
                            HoverColor: =gblTheme.White
                            PressedColor: =gblTheme.White
                            BorderThickness: =0
                            Size: =11
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - btn_DialogClose:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =622
                            Y: =520
                            Width: =110
                            Height: =40
                            Text: ="Close"
                            OnSelect: =Set(gblDirSel, Blank())
                            Fill: =RGBA(0, 0, 0, 0)
                            HoverFill: =RGBA(0, 14, 84, 0.06)
                            PressedFill: =RGBA(0, 14, 84, 0.12)
                            Color: =gblTheme.Navy
                            HoverColor: =gblTheme.Navy
                            PressedColor: =gblTheme.Navy
                            BorderColor: =gblTheme.Navy
                            BorderThickness: =2
                            Size: =11
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
