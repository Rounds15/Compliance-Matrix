                                    X: =51
                                    Y: =125
                                    Width: =Parent.Width - 102
                                    Height: =360
                                    TemplateSize: =(Parent.Width - 102) / 4
                                    TemplatePadding: =0
                                    WrapCount: =4
                                    ShowScrollbar: =false
                                    Items: |
                                        =Table(
                                            {
                                                DestKey: "Functions",
                                                DestTitle: "Compliance Functions",
                                                DestBody: "Every obligation in the matrix with statute, owner, requirement, and risk rating.",
                                                DestMeta: gblFunctionCount & " RECORDS"
                                            },
                                            {
                                                DestKey: "Topics",
                                                DestTitle: "Topics",
                                                DestBody: "Browse by compliance topic: research, health and safety, privacy, Title IX, and more.",
                                                DestMeta: gblTopicCount & " TOPICS"
                                            },
                                            {
                                                DestKey: "Areas",
                                                DestTitle: "Functional Areas",
                                                DestBody: "See obligations grouped by the university unit that carries them.",
                                                DestMeta: "BY UNIT"
                                            },
                                            {
                                                DestKey: "Deadlines",
                                                DestTitle: "Deadlines",
                                                DestBody: "Filings, certifications, and reports on the calendar, with automatic reminders.",
                                                DestMeta: gblHomeUpcoming90 & " IN 90 DAYS"
                                            },
                                            {
                                                DestKey: "Directory",
                                                DestTitle: "Owner Directory",
                                                DestBody: "Every compliance owner, unit owner, and executive sponsor in the matrix.",
                                                DestMeta: "CONTACTS"
                                            },
                                            {
                                                DestKey: "RiskDashboard",
                                                DestTitle: "Risk Dashboard",
                                                DestBody: "Risk concentration by topic and unit, gap trends, and executive reporting.",
                                                DestMeta: If(gblIsAdmin, "ADMINISTRATOR", "RESTRICTED")
                                            }
                                        )
                                Children:
                                    - rec_DestCard:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                            X: =0
                                            Y: =0
                                            Width: =Parent.TemplateWidth - 16
                                            Height: =172
                                            Fill: =gblTheme.White
                                            BorderColor: =RGBA(221, 222, 226, 1)
                                            BorderThickness: =1
                                    - rec_DestTopBar:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                            X: =0
                                            Y: =0
                                            Width: =Parent.TemplateWidth - 16
                                            Height: =5
                                            Fill: =gblTheme.Orange
                                            BorderThickness: =0
                                    - lbl_DestTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =17
                                            Y: =21
                                            Width: =Parent.TemplateWidth - 50
                                            Height: =23
                                            Text: =ThisItem.DestTitle
                                            Color: =gblTheme.Navy
                                            Size: =15
                                            FontWeight: =FontWeight.Bold
                                            Font: =gblTheme.FontDisplay
                                    - lbl_DestBody:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =17
                                            Y: =52
                                            Width: =Parent.TemplateWidth - 50
                                            Height: =76
                                            Text: =ThisItem.DestBody
                                            Color: =RGBA(59, 67, 88, 1)
                                            Size: =11
                                            Font: =gblTheme.FontBody
                                    - lbl_DestMeta:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =17
                                            Y: =136
                                            Width: =Parent.TemplateWidth - 80
                                            Height: =19
                                            Text: =ThisItem.DestMeta
                                            Color: =gblTheme.OrangeDark
                                            Size: =9
                                            FontWeight: =FontWeight.Bold
                                            Font: =gblTheme.FontBody
                                    - img_DestArrow:
                                        Control: Image@2.2.3
                                        Properties:
                                            X: =Parent.TemplateWidth - 56
                                            Y: =138
                                            Width: =14
                                            Height: =14
                                            Image: |
                                                ="data:image/svg+xml;utf8, " & EncodeUrl(
                                                    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'>
                                                       <path d='M2 8 L13 8 M9 4 L13 8 L9 12' fill='none'
                                                             stroke='#D74100' stroke-width='2' stroke-linecap='square'/>
                                                     </svg>"
                                                )
                                    - btn_DestOverlay:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                            X: =0
                                            Y: =0
                                            Width: =Parent.TemplateWidth - 16
                                            Height: =172
                                            Text: =""
                                            Tooltip: =ThisItem.DestTitle & ". " & ThisItem.DestBody
                                            Fill: =RGBA(0, 0, 0, 0)
                                            HoverFill: =RGBA(247, 105, 0, 0.06)
                                            PressedFill: =RGBA(247, 105, 0, 0.12)
                                            BorderThickness: =0
                                            OnSelect: |
                                                =Switch(
                                                    ThisItem.DestKey,
                                                    "Functions",     Navigate(scr_Functions, ScreenTransition.None),
                                                    "Topics",        Navigate(scr_Topics, ScreenTransition.None),
                                                    "Areas",         Navigate(scr_Areas, ScreenTransition.None),
                                                    "Deadlines",     Navigate(scr_Deadlines, ScreenTransition.None),
                                                    "Directory",     Navigate(scr_Directory, ScreenTransition.None),
                                                    "RiskDashboard", Navigate(scr_RiskDashboard, ScreenTransition.None)
                                                )

