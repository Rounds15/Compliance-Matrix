                                    Y: =70
                                    Width: =126
                                    Height: =21
                                    Text: ="Six ways into the matrix"
                                    Color: =RGBA(107, 114, 128, 1)
                                    Size: =11
                                    Align: =Align.Right
                                    Font: =gblTheme.FontBody
                            - gal_Destinations:
