                    - cnt_Band:
                        Control: GroupContainer@1.5.0
                        Variant: ManualLayout
                        Properties:
                            Width: =Parent.Width
                            Height: =115
                            Fill: =gblTheme.Orange
                        Children:

                            - gal_Figures:
                                Control: Gallery@2.15.0
                                Variant: Horizontal
                                Properties:
                                    X: =51
                                    Y: =0
                                    Width: =720
                                    Height: =115
                                    TemplateSize: =180
                                    TemplatePadding: =0
                                    ShowScrollbar: =false
                                    Items: |
                                        =Table(
                                            {FigValue: gblFunctionCount,  FigLabel: "COMPLIANCE FUNCTIONS"},
                                            {FigValue: gblTopicCount,     FigLabel: "COMPLIANCE TOPICS"},
                                            {FigValue: gblHomeUpcoming90, FigLabel: "DUE WITHIN 90 DAYS"},
                                            {FigValue: gblHomeOverdue,    FigLabel: "PAST DUE TODAY"}
                                        )
                                Children:
                                    - lbl_FigValue:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =0
                                            Y: =24
                                            Width: =Parent.TemplateWidth - 10
                                            Height: =46
                                            Text: =ThisItem.FigValue
                                            Color: =gblTheme.White
                                            Size: =34
                                            FontWeight: =FontWeight.Bold
                                            Font: =gblTheme.FontDisplay
                                    - lbl_FigLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =0
                                            Y: =72
                                            Width: =Parent.TemplateWidth - 10
                                            Height: =19
                                            Text: =ThisItem.FigLabel
                                            Color: =gblTheme.White
                                            Size: =9
                                            FontWeight: =FontWeight.Bold
                                            Font: =gblTheme.FontBody
                            - lbl_AsOf:
                                Control: Label@2.5.1
                                Properties:
                                    X: =Parent.Width - 157
                                    Y: =38
                                    Width: =106
                                    Height: =39
                                    Text: |
                                        ="As of " & Text(gblToday, "mmm d, yyyy") & Char(10) &
                                         "FY" & Text(
                                             If(Month(gblToday) >= gblFiscalStartMonth,
                                                Year(gblToday) + 1,
                                                Year(gblToday)),
                                             "00"
                                         ) & " Q" & (RoundDown(Mod(Month(gblToday) + 5, 12) / 3, 0) + 1)
                                    Color: =gblTheme.White
                                    Size: =11
                                    Align: =Align.Right
                                    Font: =gblTheme.FontBody

