
Screens:

    scr_Home:
        Properties:
            Fill: =RGBA(247, 247, 248, 1)
            OnVisible: |
                =Set(gblMenu, "");
                Set(gblFunctionCount, CountRows(dsFunctions));
                Set(gblTopicCount, CountRows(Distinct(dsFunctions, su_riskarea.su_name)));
                Set(
                    gblHomeUpcoming90,
                    CountRows(
                        Filter(
                            dsDeadlines,
                            su_complete = false,
                            su_duedate >= gblToday,
                            su_duedate <= DateAdd(gblToday, 90, TimeUnit.Days)
                        )
                    )
                );
                Set(
                    gblHomeOverdue,
                    CountRows(Filter(dsDeadlines, su_complete = false, su_duedate < gblToday))
                );
                Set(gblOpenGapCount, CountRows(Filter(dsGaps, su_status <> "Closed")));
                ClearCollect(
                    colMyFunctions,
                    If(
                        IsBlank(gblMe),
                        Blank(),
                        ShowColumns(
                            Filter(
                                dsOwnership,
                                su_person.su_compliancedirectoryid = gblMe.su_compliancedirectoryid
                            ),
                            "su_function"
                        )
                    )
                );
                ClearCollect(
                    colMyDeadlines,
                    If(
                        IsBlank(gblMe),
                        Blank(),
                        FirstN(
                            SortByColumns(
                                Filter(
                                    dsDeadlines,
                                    su_complete = false,
                                    su_owner.su_compliancedirectoryid = gblMe.su_compliancedirectoryid
                                ),
                                "su_duedate",
                                SortOrder.Ascending
                            ),
                            3
                        )
                    )
                )
        Children:

            - bodyGrid:
                Control: FluidGrid@2.3.0
                Properties:
                    AcceptsFocus: =true
                    BorderThickness: =0
                    X: =0
                    Y: =112
                    Width: =Parent.Width
                    Height: =656
                Children:

                    - HeroCard:
                        Control: DataCard@1.0.2
                        Variant: BlankCard
                        Properties:
                            Height: =520
                            Width: =1366
                            WidthFit: =true
                            X: =0
                            Y: =0
                        Children:

                            - heroBand:
                                Control: GroupContainer@1.5.0
                                Variant: AutoLayout
                                Properties:
                                    Fill: =gblTheme.Navy
                                    Width: =Parent.Width
                                    Height: =Parent.Height
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =16
                                    PaddingTop: =44
                                    PaddingBottom: =44
                                    PaddingLeft: =Max(28, (Parent.Width - 1320) / 2)
                                    PaddingRight: =Max(28, (Parent.Width - 1320) / 2)
                                Children:

                                    - lbl_HeroEyebrow:
                                        Control: Label@2.5.1
                                        Properties:
                                            Width: =Parent.Width - Max(28, (Parent.Width - 1320) / 2) * 2
                                            Height: =20
                                            Text: ="OFFICE OF COMPLIANCE AND ENTERPRISE RISK MANAGEMENT"
                                            Color: =gblTheme.OrangeLight
                                            Size: =10
                                            FontWeight: =FontWeight.Bold
                                            Font: =gblTheme.FontBody
                                    - cnt_HeroCopy:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
