                                    X: =171
                                    Y: =84
                                    Width: =Parent.Width - 349
                                    Height: =1
                                    Fill: =RGBA(221, 222, 226, 1)
                                    BorderThickness: =0
                            - lbl_StartRight:
                                Control: Label@2.5.1
