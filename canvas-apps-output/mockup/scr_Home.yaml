                                        Control: Label@2.5.1
                                        Properties:
                                            X: =0
                                            Y: =27
                                            Width: =Parent.TemplateWidth - 110
                                            Height: =21
                                            Text: |
                                                =If(
                                                    IsBlank(ThisItem.su_duedate),
                                                    "No fixed date",
                                                    Text(ThisItem.su_duedate, "mmm d, yyyy")
                                                ) & "  |  " & ThisItem.su_cadence
                                            Color: =RGBA(107, 114, 128, 1)
                                            Size: =11
                                            Font: =gblTheme.FontBody
                                    - lbl_DlFn:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =0
                                            Y: =50
                                            Width: =Parent.TemplateWidth - 110
                                            Height: =21
                                            Text: =ThisItem.su_function.su_name
                                            Color: =RGBA(59, 67, 88, 1)
                                            Size: =11
                                            FontWeight: =FontWeight.Semibold
                                            Font: =gblTheme.FontBody
                                    - lbl_DlPill:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =Parent.TemplateWidth - 94
                                            Y: =26
                                            Width: =77
                                            Height: =28
                                            Text: |
                                                =If(
                                                    IsBlank(ThisItem.su_duedate),
                                                    "No date",
                                                    If(
                                                        ThisItem.su_duedate < gblToday,
                                                        "Overdue " & DateDiff(ThisItem.su_duedate, gblToday, TimeUnit.Days) & "d",
                                                        "Due in " & DateDiff(gblToday, ThisItem.su_duedate, TimeUnit.Days) & "d"
                                                    )
                                                )
                                            Fill: |
                                                =If(
                                                    IsBlank(ThisItem.su_duedate),
                                                    RGBA(237, 238, 241, 1),
                                                    If(
                                                        ThisItem.su_duedate < gblToday,
                                                        RGBA(251, 233, 233, 1),
                                                        If(
                                                            ThisItem.su_duedate <= DateAdd(gblToday, 30, TimeUnit.Days),
                                                            RGBA(252, 243, 218, 1),
                                                            RGBA(230, 238, 251, 1)
                                                        )
                                                    )
                                                )
                                            Color: |
                                                =If(
                                                    IsBlank(ThisItem.su_duedate),
                                                    RGBA(107, 114, 128, 1),
                                                    If(
                                                        ThisItem.su_duedate < gblToday,
                                                        RGBA(142, 20, 20, 1),
                                                        If(
                                                            ThisItem.su_duedate <= DateAdd(gblToday, 30, TimeUnit.Days),
                                                            RGBA(124, 64, 8, 1),
                                                            RGBA(32, 50, 153, 1)
                                                        )
                                                    )
                                                )
                                            Size: =10
                                            FontWeight: =FontWeight.Bold
                                            Align: =Align.Center
                                            VerticalAlign: =VerticalAlign.Middle
                                            Font: =gblTheme.FontBody
