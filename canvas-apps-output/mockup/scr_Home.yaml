
Screens:

    scr_Home:
        Properties:
            Fill: =RGBA(247, 247, 248, 1)
            OnVisible: |
                =Set(gblMenu, "");
                Set(gblFunctionCount, CountRows(dsFunctions));
                Set(gblTopicCount, CountRows(Distinct(dsFunctions, su_riskarea.su_name)));
                Set(
                    gblHomeUpcoming90,
                    CountRows(
                        Filter(
                            dsDeadlines,
                            su_complete = false,
                            su_duedate >= gblToday,
                            su_duedate <= DateAdd(gblToday, 90, TimeUnit.Days)
                        )
                    )
                );
                Set(
                    gblHomeOverdue,
                    CountRows(Filter(dsDeadlines, su_complete = false, su_duedate < gblToday))
                );
                Set(gblOpenGapCount, CountRows(Filter(dsGaps, su_status <> "Closed")));
                ClearCollect(
                    colMyFunctions,
                    If(
                        IsBlank(gblMe),
                        Blank(),
                        ShowColumns(
                            Filter(
                                dsOwnership,
                                su_person.su_compliancedirectoryid = gblMe.su_compliancedirectoryid
                            ),
                            "su_function"
                        )
                    )
                );
                ClearCollect(
                    colMyDeadlines,
                    If(
                        IsBlank(gblMe),
                        Blank(),
                        FirstN(
                            SortByColumns(
                                Filter(
                                    dsDeadlines,
                                    su_complete = false,
                                    su_owner.su_compliancedirectoryid = gblMe.su_compliancedirectoryid
                                ),
                                "su_duedate",
                                SortOrder.Ascending
                            ),
                            3
                        )
                    )
                )
        Children:

            - cnt_Scroll:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                    X: =0
                    Y: =113
                    Width: =Parent.Width
                    Height: =Parent.Height - 113
                    Fill: =RGBA(247, 247, 248, 1)
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGap: =0
                    LayoutOverflowY: =LayoutOverflow.Scroll
                Children:

                    - cnt_Hero:
                        Control: GroupContainer@1.5.0
                        Variant: ManualLayout
                        Properties:
                            Width: =Parent.Width
                            Height: =552
                            Fill: =gblTheme.Navy
                        Children:

                            - lbl_HeroEyebrow:
                                Control: Label@2.5.1
                                Properties:
                                    X: =51
                                    Y: =48
                                    Width: =Parent.Width - 102
                                    Height: =20
                                    Text: ="OFFICE OF COMPLIANCE AND ENTERPRISE RISK MANAGEMENT"
                                    Color: =gblTheme.OrangeLight
                                    Size: =10
                                    FontWeight: =FontWeight.Bold
                                    Font: =gblTheme.FontBody
                            - lbl_HeroTitle:
                                Control: Label@2.5.1
                                Properties:
                                    X: =51
                                    Y: =84
                                    Width: =Parent.Width - 102
                                    Height: =196
                                    Text: |
                                        ="Who is responsible for what" & Char(10) &
                                         "and are we on top of it."
                                    Color: =gblTheme.White
                                    Size: =48
                                    FontWeight: =FontWeight.Bold
                                    Font: =gblTheme.FontDisplay
                            - lbl_HeroLede:
                                Control: Label@2.5.1
                                Properties:
                                    X: =51
                                    Y: =295
                                    Width: =616
                                    Height: =60
                                    Text: |
                                        ="The Compliance Matrix maps every obligation Syracuse University carries to its owner, the law behind it, what it requires, when it is due, and the risk it carries."
                                    Color: =RGBA(199, 210, 234, 1)
                                    Size: =15
                                    Font: =gblTheme.FontBody
                            - rec_SearchBox:
                                Control: Rectangle@2.3.0
                                Properties:
                                    X: =51
                                    Y: =379
                                    Width: =660
                                    Height: =60
                                    Fill: =gblTheme.White
                                    BorderThickness: =0
                            - img_SearchIcon:
                                Control: Image@2.2.3
                                Properties:
                                    X: =69
                                    Y: =400
                                    Width: =18
                                    Height: =18
                                    Image: |
                                        ="data:image/svg+xml;utf8, " & EncodeUrl(
                                            "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'>
                                               <circle cx='10' cy='10' r='7' fill='none' stroke='#707780' stroke-width='2'/>
                                               <path d='M15 15 L21 21' stroke='#707780' stroke-width='2'/>
                                             </svg>"
                                        )
                            - txt_HeroSearch:
                                Control: Classic/TextInput@2.3.2
                                Properties:
