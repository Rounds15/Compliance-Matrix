                                            Fill: =If(ThisItem.ModerateN = 0, RGBA(237, 238, 241, 1), gblTheme.Moderate)
                                            Color: =If(ThisItem.ModerateN = 0, RGBA(173, 179, 184, 1), gblTheme.White)
                                            Size: =15
                                            FontWeight: =FontWeight.Bold
                                            Align: =Align.Center
