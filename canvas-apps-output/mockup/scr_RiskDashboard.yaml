
Screens:

    scr_RiskDashboard:
        Properties:
            Fill: =RGBA(247, 247, 248, 1)
            OnVisible: |
                =Set(gblMenu, "");
                Set(gblFnTotal, CountRows(dsFunctions));
                ClearCollect(
                    colHeat,
                    AddColumns(
                        Distinct(dsFunctions, su_riskarea.su_name),
                        "HighN",     CountRows(Filter(dsFunctions, su_riskarea.su_name = Value, su_risk = "High")),
                        "ModerateN", CountRows(Filter(dsFunctions, su_riskarea.su_name = Value, su_risk = "Moderate")),
                        "LowN",      CountRows(Filter(dsFunctions, su_riskarea.su_name = Value, su_risk = "Low")),
                        "UnratedN",  CountRows(Filter(dsFunctions, su_riskarea.su_name = Value, IsBlank(su_risk))),
                        "TotalN",    CountRows(Filter(dsFunctions, su_riskarea.su_name = Value))
                    )
                );
                ClearCollect(
                    colHighByTopic,
                    AddColumns(
                        Distinct(Filter(dsFunctions, su_risk = "High"), su_riskarea.su_name),
                        "HighCount", CountRows(Filter(dsFunctions, su_risk = "High", su_riskarea.su_name = Value))
                    )
                );
                Set(gblHighTopicMax, Max(colHighByTopic, HighCount))
        Children:

            - cnt_Scroll:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                    X: =0
                    Y: =113
                    Width: =Parent.Width
                    Height: =Parent.Height - 113
                    Fill: =RGBA(247, 247, 248, 1)
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGap: =0
                    LayoutOverflowY: =LayoutOverflow.Scroll
                Children:

                    - cnt_Head:
                        Control: GroupContainer@1.5.0
                        Variant: ManualLayout
                        Properties:
                            Width: =Parent.Width
                            Height: =373
                            Fill: =RGBA(247, 247, 248, 1)
                        Children:

                            - lbl_Eyebrow:
                                Control: Label@2.5.1
                                Properties:
                                    X: =51
                                    Y: =24
                                    Width: =598
                                    Height: =20
                                    Text: ="RISK AND REPORTING  |  ADMINISTRATOR"
                                    Color: =gblTheme.OrangeDark
                                    Size: =10
                                    FontWeight: =FontWeight.Bold
                                    Font: =gblTheme.FontBody
                            - lbl_Title:
                                Control: Label@2.5.1
                                Properties:
                                    X: =51
                                    Y: =52
                                    Width: =598
                                    Height: =50
                                    Text: ="Risk Dashboard"
                                    Color: =gblTheme.Navy
                                    Size: =36
                                    FontWeight: =FontWeight.Bold
                                    Font: =gblTheme.FontDisplay
                            - lbl_Sub:
                                Control: Label@2.5.1
                                Properties:
                                    X: =51
                                    Y: =110
                                    Width: =598
                                    Height: =60
                                    Text: |
                                        ="The executive risk picture: where the highest rated obligations sit, which topics carry them, and what is still unrated."
                                    Color: =RGBA(59, 67, 88, 1)
                                    Size: =12
                                    Font: =gblTheme.FontBody
                            - rec_HeadRule:
                                Control: Rectangle@2.3.0
                                Properties:
                                    X: =51
                                    Y: =187
                                    Width: =Parent.Width - 102
                                    Height: =1
                                    Fill: =RGBA(221, 222, 226, 1)
                                    BorderThickness: =0
                            - gal_Stats:
                                Control: Gallery@2.15.0
                                Variant: Horizontal
                                Properties:
                                    X: =51
                                    Y: =211
                                    Width: =Parent.Width - 102
                                    Height: =130
                                    TemplateSize: =(Parent.Width - 102) / 4
                                    TemplatePadding: =0
                                    ShowScrollbar: =false
                                    Items: |
                                        =Table(
                                            {
                                                StatValue: CountRows(Filter(dsFunctions, su_risk = "High")),
                                                StatLabel: "HIGH RISK",
                                                StatNote:  Round(CountRows(Filter(dsFunctions, su_risk = "High")) / Max(gblFnTotal, 1) * 100, 0) & " percent of the inventory",
                                                StatTone:  "bad"
                                            },
                                            {
                                                StatValue: CountRows(Filter(dsFunctions, su_risk = "Moderate")),
                                                StatLabel: "MODERATE RISK",
                                                StatNote:  Round(CountRows(Filter(dsFunctions, su_risk = "Moderate")) / Max(gblFnTotal, 1) * 100, 0) & " percent of the inventory",
                                                StatTone:  "warn"
                                            },
                                            {
                                                StatValue: CountRows(Filter(dsFunctions, su_risk = "Low")),
                                                StatLabel: "LOW RISK",
                                                StatNote:  Round(CountRows(Filter(dsFunctions, su_risk = "Low")) / Max(gblFnTotal, 1) * 100, 0) & " percent of the inventory",
                                                StatTone:  ""
                                            },
                                            {
                                                StatValue: CountRows(Filter(dsFunctions, IsBlank(su_risk))),
                                                StatLabel: "UNRATED",
                                                StatNote:  "Risk is not yet recorded",
                                                StatTone:  "muted"
                                            }
                                        )
                                Children:
                                    - rec_StatTile:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                            X: =0
                                            Y: =0
                                            Width: =Parent.TemplateWidth - 16
                                            Height: =130
                                            Fill: =RGBA(237, 238, 241, 1)
                                            BorderThickness: =0
                                    - lbl_StatValue:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =24
                                            Y: =16
                                            Width: =Parent.TemplateWidth - 64
                                            Height: =44
                                            Text: =ThisItem.StatValue
                                            Color: |
                                                =Switch(
                                                    ThisItem.StatTone,
                                                    "bad",   gblTheme.High,
                                                    "warn",  gblTheme.Moderate,
                                                    "muted", RGBA(107, 114, 128, 1),
                                                    gblTheme.Navy
                                                )
                                            Size: =33
                                            FontWeight: =FontWeight.Bold
                                            Font: =gblTheme.FontDisplay
                                    - lbl_StatLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =24
                                            Y: =68
                                            Width: =Parent.TemplateWidth - 64
                                            Height: =21
                                            Text: =ThisItem.StatLabel
                                            Color: =gblTheme.Navy
                                            Size: =11
                                            FontWeight: =FontWeight.Bold
                                            Font: =gblTheme.FontBody
                                    - lbl_StatNote:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =24
                                            Y: =93
                                            Width: =Parent.TemplateWidth - 64
                                            Height: =21
                                            Text: =ThisItem.StatNote
                                            Color: =RGBA(107, 114, 128, 1)
                                            Size: =11
                                            Font: =gblTheme.FontBody

                    - cnt_Heat:
