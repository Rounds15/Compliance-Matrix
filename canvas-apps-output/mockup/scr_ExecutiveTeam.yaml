
Screens:

    scr_ExecutiveTeam:
        Properties:
            Fill: =RGBA(247, 247, 248, 1)
            OnVisible: |
                =Set(gblMenu, "");
                Set(gblExecSel, Blank())
        Children:

            - cnt_Scroll:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                    X: =0
                    Y: =113
                    Width: =Parent.Width
                    Height: =Parent.Height - 113
                    Fill: =RGBA(247, 247, 248, 1)
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGap: =0
                    LayoutOverflowY: =LayoutOverflow.Scroll
                Children:

                    - cnt_Head:
                        Control: GroupContainer@1.5.0
                        Variant: ManualLayout
                        Properties:
                            Width: =Parent.Width
                            Height: =188
                            Fill: =RGBA(247, 247, 248, 1)
                        Children:

                            - lbl_Eyebrow:
                                Control: Label@2.5.1
                                Properties:
                                    X: =51
                                    Y: =24
                                    Width: =598
                                    Height: =20
                                    Text: ="PORTFOLIO VIEW"
                                    Color: =gblTheme.OrangeDark
                                    Size: =10
                                    FontWeight: =FontWeight.Bold
                                    Font: =gblTheme.FontBody
                            - lbl_Title:
                                Control: Label@2.5.1
                                Properties:
                                    X: =51
                                    Y: =52
                                    Width: =598
                                    Height: =50
                                    Text: ="Executive Team"
                                    Color: =gblTheme.Navy
                                    Size: =36
                                    FontWeight: =FontWeight.Bold
                                    Font: =gblTheme.FontDisplay
                            - lbl_Sub:
                                Control: Label@2.5.1
                                Properties:
                                    X: =51
                                    Y: =110
                                    Width: =598
                                    Height: =60
                                    Text: |
                                        ="Executive owners sit at the top of every ownership chain. Sorted by last name; photos come from the directory, with initials shown where no photo exists."
                                    Color: =RGBA(59, 67, 88, 1)
                                    Size: =12
                                    Font: =gblTheme.FontBody
                            - rec_HeadRule:
                                Control: Rectangle@2.3.0
                                Properties:
                                    X: =51
                                    Y: =187
                                    Width: =Parent.Width - 102
                                    Height: =1
                                    Fill: =RGBA(221, 222, 226, 1)
                                    BorderThickness: =0

                    - cnt_Grid:
                        Control: GroupContainer@1.5.0
                        Variant: ManualLayout
                        Properties:
                            Width: =Parent.Width
                            Height: =460
                            Fill: =RGBA(247, 247, 248, 1)
                        Children:

                            - gal_Executives:
                                Control: Gallery@2.15.0
                                Variant: Horizontal
                                Properties:
                                    X: =51
                                    Y: =24
                                    Width: =Parent.Width - 102
                                    Height: =412
                                    TemplateSize: =(Parent.Width - 102) / 4
                                    TemplatePadding: =0
                                    WrapCount: =4
                                    ShowScrollbar: =true
                                    Items: =Filter(dsDirectory, su_isexecutive = true)
                                Children:
                                    - rec_ExecCard:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                            X: =0
                                            Y: =0
                                            Width: =Parent.TemplateWidth - 16
                                            Height: =190
                                            Fill: =gblTheme.White
                                            BorderColor: =RGBA(221, 222, 226, 1)
                                            BorderThickness: =1
                                    - rec_ExecBar:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                            X: =0
                                            Y: =0
                                            Width: =Parent.TemplateWidth - 16
                                            Height: =5
                                            Fill: =gblTheme.OrangeDark
                                            BorderThickness: =0
                                    - lbl_ExecAvatar:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =17
                                            Y: =47
                                            Width: =54
                                            Height: =54
                                            Text: |
                                                =Left(ThisItem.su_name, 1) &
                                                 Mid(ThisItem.su_name, Find(" ", ThisItem.su_name & " ") + 1, 1)
                                            Fill: |
                                                =Switch(
                                                    Mod(Len(ThisItem.su_name), 4),
                                                    0, RGBA( 15, 118, 110, 1),
                                                    1, RGBA(124,  58, 237, 1),
                                                    2, RGBA( 43, 114, 215, 1),
                                                    RGBA(32, 50, 153, 1)
                                                )
                                            Color: =gblTheme.White
                                            Size: =16
                                            FontWeight: =FontWeight.Bold
                                            Align: =Align.Center
                                            VerticalAlign: =VerticalAlign.Middle
                                            Font: =gblTheme.FontBody
                                    - lbl_ExecName:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =83
                                            Y: =26
                                            Width: =Parent.TemplateWidth - 115
                                            Height: =26
                                            Text: =ThisItem.su_name
                                            Color: =gblTheme.Navy
                                            Size: =17
                                            FontWeight: =FontWeight.Bold
                                            Font: =gblTheme.FontDisplay
                                    - lbl_ExecRole:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =83
                                            Y: =56
                                            Width: =Parent.TemplateWidth - 115
                                            Height: =38
                                            Text: =ThisItem.su_jobtitle
                                            Color: =RGBA(91, 99, 115, 1)
                                            Size: =9
                                            Font: =gblTheme.FontBody
                                    - lbl_ExecUnit:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =83
                                            Y: =96
                                            Width: =Parent.TemplateWidth - 115
                                            Height: =20
                                            Text: =ThisItem.su_unit
                                            Color: =RGBA(107, 114, 128, 1)
                                            Size: =8
                                            Font: =gblTheme.FontBody
                                    - lbl_ExecHighCount:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =17
                                            Y: =143
                                            Width: =49
                                            Height: =30
                                            Text: |
                                                =CountRows(
                                                    Filter(
                                                        dsFunctions,
                                                        su_executiveowner.su_compliancedirectoryid
                                                            = ThisItem.su_compliancedirectoryid,
                                                        su_risk = "High"
                                                    )
                                                )
                                            Visible: |
                                                =CountRows(
                                                    Filter(
                                                        dsFunctions,
                                                        su_executiveowner.su_compliancedirectoryid
                                                            = ThisItem.su_compliancedirectoryid,
                                                        su_risk = "High"
                                                    )
                                                ) > 0
                                            Fill: =gblTheme.High
                                            Color: =gblTheme.White
                                            Size: =9
                                            FontWeight: =FontWeight.Bold
                                            Align: =Align.Center
                                            VerticalAlign: =VerticalAlign.Middle
                                            Font: =gblTheme.FontBody
                                    - rec_ExecChip:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                            X: =Parent.TemplateWidth - 118
                                            Y: =143
                                            Width: =86
                                            Height: =30
                                            Fill: =gblTheme.White
                                            BorderColor: =RGBA(196, 199, 206, 1)
                                            BorderThickness: =1
                                    - lbl_ExecChip:
                                        Control: Label@2.5.1
                                        Properties:
                                            X: =Parent.TemplateWidth - 118
                                            Y: =143
                                            Width: =86
                                            Height: =30
                                            Text: |
                                                =CountRows(
                                                    Filter(
                                                        dsFunctions,
                                                        su_executiveowner.su_compliancedirectoryid
                                                            = ThisItem.su_compliancedirectoryid
                                                    )
                                                ) & " in portfolio"
                                            Color: =RGBA(59, 67, 88, 1)
                                            Size: =10
                                            Align: =Align.Center
                                            VerticalAlign: =VerticalAlign.Middle
                                            Font: =gblTheme.FontBody
                                    - btn_ExecOverlay:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                            X: =0
                                            Y: =0
                                            Width: =Parent.TemplateWidth - 16
                                            Height: =190
                                            Text: =""
                                            Tooltip: =ThisItem.su_name & ". " & ThisItem.su_jobtitle
                                            OnSelect: =Set(gblExecSel, ThisItem)
                                            Fill: =RGBA(0, 0, 0, 0)
                                            HoverFill: =RGBA(247, 105, 0, 0.06)
                                            PressedFill: =RGBA(247, 105, 0, 0.12)
                                            BorderThickness: =0

                    - cnt_FooterSlot:
                        Control: GroupContainer@1.5.0
                        Variant: ManualLayout
                        Properties:
                            Width: =Parent.Width
                            Height: =220
                            Fill: =RGBA(247, 247, 248, 1)

            - btn_Scrim:
                Control: Classic/Button@2.2.0
                Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =Parent.Height
                    Text: =""
                    Tooltip: ="Close"
                    Visible: =!IsBlank(gblExecSel)
                    OnSelect: =Set(gblExecSel, Blank())
                    Fill: =RGBA(0, 14, 84, 0.45)
                    HoverFill: =RGBA(0, 14, 84, 0.45)
                    PressedFill: =RGBA(0, 14, 84, 0.5)
                    BorderThickness: =0
            - cnt_ExecDialog:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                    X: =(Parent.Width - 800) / 2
                    Y: =(Parent.Height - 600) / 2
                    Width: =800
                    Height: =600
                    Fill: =gblTheme.White
                    Visible: =!IsBlank(gblExecSel)
                Children:

                    - rec_DialogHead:
                        Control: Rectangle@2.3.0
                        Properties:
                            X: =0
                            Y: =0
                            Width: =800
                            Height: =112
                            Fill: =gblTheme.Navy
                            BorderThickness: =0
                    - lbl_DialogAvatar:
                        Control: Label@2.5.1
                        Properties:
                            X: =28
                            Y: =30
                            Width: =52
                            Height: =52
                            Text: |
                                =Left(gblExecSel.su_name, 1) &
                                 Mid(gblExecSel.su_name, Find(" ", gblExecSel.su_name & " ") + 1, 1)
                            Fill: =RGBA(32, 50, 153, 1)
                            Color: =gblTheme.White
                            Size: =16
                            FontWeight: =FontWeight.Bold
                            Align: =Align.Center
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
                    - lbl_DialogEyebrow:
                        Control: Label@2.5.1
                        Properties:
                            X: =96
                            Y: =26
                            Width: =600
                            Height: =18
                            Text: ="EXECUTIVE OWNER"
                            Color: =gblTheme.OrangeLight
                            Size: =9
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - lbl_DialogName:
                        Control: Label@2.5.1
                        Properties:
                            X: =96
                            Y: =44
                            Width: =640
                            Height: =32
                            Text: =gblExecSel.su_name
                            Color: =gblTheme.White
                            Size: =21
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontDisplay
                    - lbl_DialogTitle:
                        Control: Label@2.5.1
                        Properties:
                            X: =96
                            Y: =76
                            Width: =640
                            Height: =28
                            Text: =gblExecSel.su_jobtitle
                            Color: =RGBA(195, 204, 228, 1)
                            Size: =10
                            Font: =gblTheme.FontBody
                    - btn_DialogX:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =744
                            Y: =24
                            Width: =32
                            Height: =32
                            Text: ="X"
                            OnSelect: =Set(gblExecSel, Blank())
                            Fill: =RGBA(255, 255, 255, 0.1)
                            HoverFill: =RGBA(255, 255, 255, 0.2)
                            PressedFill: =RGBA(255, 255, 255, 0.3)
                            Color: =gblTheme.White
                            HoverColor: =gblTheme.White
                            PressedColor: =gblTheme.White
                            BorderThickness: =0
                            Size: =11
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - lbl_StatFunctions:
                        Control: Label@2.5.1
                        Properties:
                            X: =28
                            Y: =136
                            Width: =240
                            Height: =74
                            Text: |
                                =CountRows(
                                    Filter(
                                        dsFunctions,
                                        su_executiveowner.su_compliancedirectoryid
                                            = gblExecSel.su_compliancedirectoryid
                                    )
                                ) & Char(10) & "FUNCTIONS IN PORTFOLIO"
                            Fill: =RGBA(237, 238, 241, 1)
                            Color: =gblTheme.Navy
                            Size: =12
                            FontWeight: =FontWeight.Bold
                            Align: =Align.Center
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
                    - lbl_StatHigh:
                        Control: Label@2.5.1
                        Properties:
                            X: =280
                            Y: =136
                            Width: =240
                            Height: =74
                            Text: |
                                =CountRows(
                                    Filter(
                                        dsFunctions,
                                        su_executiveowner.su_compliancedirectoryid
                                            = gblExecSel.su_compliancedirectoryid,
                                        su_risk = "High"
                                    )
                                ) & Char(10) & "HIGH RISK"
                            Fill: =RGBA(237, 238, 241, 1)
                            Color: =gblTheme.High
                            Size: =12
                            FontWeight: =FontWeight.Bold
                            Align: =Align.Center
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
                    - lbl_StatUnrated:
                        Control: Label@2.5.1
                        Properties:
                            X: =532
                            Y: =136
                            Width: =240
                            Height: =74
                            Text: |
                                =CountRows(
                                    Filter(
                                        dsFunctions,
                                        su_executiveowner.su_compliancedirectoryid
                                            = gblExecSel.su_compliancedirectoryid,
                                        IsBlank(su_risk)
                                    )
                                ) & Char(10) & "UNRATED"
                            Fill: =RGBA(237, 238, 241, 1)
                            Color: =RGBA(107, 114, 128, 1)
                            Size: =12
                            FontWeight: =FontWeight.Bold
                            Align: =Align.Center
                            VerticalAlign: =VerticalAlign.Middle
                            Font: =gblTheme.FontBody
                    - lbl_PortfolioHead:
                        Control: Label@2.5.1
                        Properties:
                            X: =28
                            Y: =222
                            Width: =744
                            Height: =24
                            Text: ="PORTFOLIO"
                            Color: =gblTheme.OrangeDark
                            Size: =9
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - gal_Portfolio:
                        Control: Gallery@2.15.0
                        Variant: Vertical
                        Properties:
                            X: =28
                            Y: =250
                            Width: =744
                            Height: =278
                            TemplateSize: =58
                            TemplatePadding: =0
                            ShowScrollbar: =true
                            Items: |
                                =Filter(
                                    dsFunctions,
                                    su_executiveowner.su_compliancedirectoryid
                                        = gblExecSel.su_compliancedirectoryid
                                )
                        Children:
                            - lbl_PfName:
                                Control: Label@2.5.1
                                Properties:
                                    X: =8
                                    Y: =8
                                    Width: =Parent.TemplateWidth - 120
                                    Height: =22
                                    Text: =ThisItem.su_name
                                    Color: =gblTheme.Navy
                                    Size: =10
                                    FontWeight: =FontWeight.Semibold
                                    Font: =gblTheme.FontBody
                            - lbl_PfSub:
                                Control: Label@2.5.1
                                Properties:
                                    X: =8
                                    Y: =30
                                    Width: =Parent.TemplateWidth - 120
                                    Height: =18
                                    Text: |
                                        =ThisItem.su_riskarea.su_name & "  |  " &
                                         Coalesce(ThisItem.su_complianceowner.su_name, "Unassigned")
                                    Color: =RGBA(107, 114, 128, 1)
                                    Size: =9
                                    Font: =gblTheme.FontBody
                            - lbl_PfRisk:
                                Control: Label@2.5.1
                                Properties:
                                    X: =Parent.TemplateWidth - 104
                                    Y: =16
                                    Width: =92
                                    Height: =26
                                    Text: |
                                        =If(IsBlank(ThisItem.su_risk), "UNRATED", Upper(ThisItem.su_risk))
                                    Fill: |
                                        =Switch(
                                            ThisItem.su_risk,
                                            "High",     gblTheme.High,
                                            "Moderate", gblTheme.Moderate,
                                            "Low",      gblTheme.Low,
                                            gblTheme.Unrated
                                        )
                                    Color: =gblTheme.White
                                    Size: =9
                                    FontWeight: =FontWeight.Bold
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Font: =gblTheme.FontBody
                            - rec_PfRule:
                                Control: Rectangle@2.3.0
                                Properties:
                                    X: =0
                                    Y: =57
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                                    Fill: =RGBA(226, 229, 234, 1)
                                    BorderThickness: =0
                            - btn_PfOverlay:
                                Control: Classic/Button@2.2.0
                                Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =58
                                    Text: =""
                                    Tooltip: ="Open " & ThisItem.su_name
                                    OnSelect: |
                                        =Set(gblSelectedFunction, ThisItem);
                                        Set(gblExecSel, Blank());
                                        Navigate(scr_FunctionDetail, ScreenTransition.None)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    HoverFill: =RGBA(247, 105, 0, 0.08)
                                    PressedFill: =RGBA(247, 105, 0, 0.15)
                                    BorderThickness: =0
                    - btn_DialogEmail:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =28
                            Y: =542
                            Width: =140
                            Height: =40
                            Text: ="Email"
                            OnSelect: =Launch("mailto:" & gblExecSel.su_email)
                            Fill: =gblTheme.OrangeDark
                            HoverFill: =gblTheme.Orange
                            PressedFill: =RGBA(180, 55, 0, 1)
                            Color: =gblTheme.White
                            HoverColor: =gblTheme.White
                            PressedColor: =gblTheme.White
                            BorderThickness: =0
                            Size: =11
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
                    - btn_DialogClose:
                        Control: Classic/Button@2.2.0
                        Properties:
                            X: =662
                            Y: =542
                            Width: =110
                            Height: =40
                            Text: ="Close"
                            OnSelect: =Set(gblExecSel, Blank())
                            Fill: =RGBA(0, 0, 0, 0)
                            HoverFill: =RGBA(0, 14, 84, 0.06)
                            PressedFill: =RGBA(0, 14, 84, 0.12)
                            Color: =gblTheme.Navy
                            HoverColor: =gblTheme.Navy
                            PressedColor: =gblTheme.Navy
                            BorderColor: =gblTheme.Navy
                            BorderThickness: =2
                            Size: =11
                            FontWeight: =FontWeight.Bold
                            Font: =gblTheme.FontBody
