
Screens:

    scr_FunctionDetail:
        Properties:
            Fill: =RGBA(247, 248, 250, 1)
            OnVisible: |
                =Set(gblMenu, "");
                ClearCollect(
                    colFdOwnership,
                    Filter(
                        dsOwnership,
                        su_function.su_compliancefunctionid
                            = gblSelectedFunction.su_compliancefunctionid
                    )
                );
                ClearCollect(
                    colFdGaps,
                    Filter(
                        dsGaps,
                        su_function.su_compliancefunctionid
                            = gblSelectedFunction.su_compliancefunctionid
                    )
                );
                ClearCollect(
                    colFdRelated,
                    FirstN(
                        Filter(
                            dsFunctions,
                            su_riskarea.su_name = gblSelectedFunction.su_riskarea.su_name,
                            su_compliancefunctionid <> gblSelectedFunction.su_compliancefunctionid
                        ),
                        4
                    )
                )
        Children:

            - bodyGrid:
                Control: FluidGrid@2.3.0
                Properties:
                    AcceptsFocus: =true
                    BorderThickness: =0
                    X: =0
                    Y: =112
                    Width: =Parent.Width
                    Height: =656
                Children:

                    - BackBarCard:
                        Control: DataCard@1.0.2
                        Variant: BlankCard
                        Properties:
                            Height: =41
                            Width: =1366
                            WidthFit: =true
                            X: =0
                            Y: =0
                        Children:

                            - cnt_BackBar:
                                Control: GroupContainer@1.5.0
                                Variant: ManualLayout
                                Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.Width
                                    Height: =Parent.Height
                                    Fill: =RGBA(242, 244, 248, 1)
                                Children:

                                    - btn_Back:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                            X: =51
                                            Y: =6
                                            Width: =80
                                            Height: =28
                                            Text: ="Back"
                                            Align: =Align.Left
                                            OnSelect: =Back(ScreenTransition.None)
                                            Fill: =RGBA(0, 0, 0, 0)
                                            HoverFill: =RGBA(247, 105, 0, 0.08)
                                            PressedFill: =RGBA(247, 105, 0, 0.15)
                                            Color: =gblTheme.OrangeDark
                                            HoverColor: =gblTheme.Orange
                                            PressedColor: =gblTheme.OrangeDark
                                            BorderThickness: =0
                                            Size: =9
                                            FontWeight: =FontWeight.Bold
                                            Font: =gblTheme.FontBody
