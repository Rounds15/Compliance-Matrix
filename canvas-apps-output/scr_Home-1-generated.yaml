
Screens:

    scr_Home:
        Properties:
            Fill: =gblTheme.White
            OnVisible: |
                =// Deadline windows used by the figures band and the assignment rail.
                Set(gblHomeUpcoming90,
                    CountRows(
                        Filter(
                            dsDeadlines,
                            su_complete = false,
                            su_duedate >= gblToday,
                            su_duedate <= DateAdd(gblToday, 90, TimeUnit.Days)
                        )
                    )
                );
                Set(gblHomeOverdue,
                    CountRows(
                        Filter(
                            dsDeadlines,
                            su_complete = false,
                            su_duedate < gblToday
                        )
                    )
                );
                Set(gblOpenGapCount,
                    CountRows(
                        Filter(dsGaps, su_status <> "Closed")
                    )
                );
                Set(gblFunctionCount, CountRows(dsFunctions));

                // "Assigned to you" spans all three tiers of the ownership chain,
                // so it reads from the junction table rather than the three fixed
                // lookups. Blank directory row means nothing is assigned.
                ClearCollect(
                    colMyFunctions,
                    If(
                        IsBlank(gblMe),
                        Blank(),
                        ShowColumns(
                            Filter(
                                dsOwnership,
                                su_person.su_compliancedirectoryid = gblMe.su_compliancedirectoryid
                            ),
                            "su_function"
                        )
                    )
                );
                // Assessments this person owns, so "assigned to you" reflects
                // the review work as well as the obligations.
                ClearCollect(
                    colMyAssessments,
                    If(
                        IsBlank(gblMe),
                        Blank(),
                        Filter(
                            dsAssessmentOwners,
                            su_person.su_compliancedirectoryid
                                = gblMe.su_compliancedirectoryid
                        )
                    )
                );
                // Guarded the same way as the two collections above. Without the
                // IsBlank check this filter dereferences gblMe on a blank record
                // when the signed-in user is not in the directory.
                ClearCollect(
                    colMyDeadlines,
                    If(
                        IsBlank(gblMe),
                        Blank(),
                        FirstN(
                            SortByColumns(
                                Filter(
                                    dsDeadlines,
                                    su_complete = false,
                                    su_owner.su_compliancedirectoryid = gblMe.su_compliancedirectoryid
                                ),
                                "su_duedate",
                                SortOrder.Ascending
                            ),
                            4
                        )
                    )
                );

        Children:

            - cnt_HomeScroll:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                    X: =0
                    Y: =104
                    Width: =Parent.Width
                    Height: =Parent.Height - 104
                    Fill: =gblTheme.White
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGap: =0
                    LayoutOverflowY: =LayoutOverflow.Scroll
                Children:

                    - cnt_Hero:
                        Control: GroupContainer@1.5.0
                        Variant: ManualLayout
                        Properties:
                            Width: =Parent.Width
                            Height: =352
                            Fill: =gblTheme.Navy
                        Children:

                            - lbl_HeroEyebrow:
                                Control: Label@2.5.1
                                Properties:
                                    X: =64
                                    Y: =40
                                    Width: =700
                                    Height: =20
                                    Text: ="OFFICE OF COMPLIANCE AND ENTERPRISE RISK MANAGEMENT"
                                    Color: =gblTheme.OrangeLight
                                    Size: =8
                                    FontWeight: =FontWeight.Bold
                                    Font: =gblTheme.FontBody
                            - lbl_HeroTitle:
                                Control: Label@2.5.1
                                Properties:
                                    X: =64
                                    Y: =68
                                    Width: =620
                                    Height: =128
                                    Text: |
                                        ="Who is responsible for what " & Char(10) & "and are we on top of it."
                                    Color: =gblTheme.White
                                    Size: =32
                                    FontWeight: =FontWeight.Bold
                                    Font: =gblTheme.FontDisplay
                            - lbl_HeroLede:
